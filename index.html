let CURRENT_QUALITY = 3;
function lodModel(name) {
  const q = GAME_DATA.QUALITY_PRESETS[CURRENT_QUALITY];
  if (q && q.low_poly_enemies && (name === 'sphere' || name === 'cone' || name === 'icosphere' || name === 'diamond')) {
    return 'cube';
  }
  return name;
}

class SimpleFXManager {
  constructor() {
    this.particles = [];
    this.shakeT = 0;
    this.shakeDur = 0.2;
    this.shakeMag = 0;
    this.smokeEnabled = true;
    this.debrisEnabled = true;
  }
  addShake(dur, mag) {
    this.shakeT = Math.max(this.shakeT, dur);
    this.shakeDur = Math.max(0.05, dur);
    this.shakeMag = Math.max(this.shakeMag, mag);
  }
  spawnHitSmoke(pos) {
    if (!this.smokeEnabled || this.particles.length > 48) return;
    for (let i = 0; i < 2; i++) {
      const node = new Node3D({
        model: 'quad', billboard: true, additive: true, tex: 'soft_glow',
        pos: pos.slice(), scale: [0.36, 0.36, 1], color: cRGBA(235, 228, 210, 185),
        useFog: false, shade: false
      });
      this.particles.push({
        node,
        vel: [(Math.random()*2-1)*2.6, 1.0 + Math.random()*2.6, (Math.random()*2-1)*2.6],
        rvel: [0, 0, 0], age: 0, life: 0.20, s0: [0.36, 0.36, 1], shrink: true
      });
    }
  }
  spawnDebris(pos, scaleVec, col, vel, rotVel, life = 0.55) {
    if (!this.debrisEnabled || this.particles.length > 64) return;
    const node = new Node3D({
      model: 'cube', pos: pos.slice(), scale: scaleVec.slice(), color: col.slice()
    });
    this.particles.push({
      node, vel: vel.slice(), rvel: rotVel.slice(), age: 0, life, s0: scaleVec.slice(), shrink: false
    });
  }
  update(dt, renderer) {
    const alive = [];
    for (const p of this.particles) {
      p.age += dt;
      if (p.age >= p.life) continue;
      p.node.pos[0] += p.vel[0] * dt;
      p.node.pos[1] += p.vel[1] * dt;
      p.node.pos[2] += p.vel[2] * dt;
      p.node.rot[0] += p.rvel[0] * dt;
      p.node.rot[1] += p.rvel[1] * dt;
      p.node.rot[2] += p.rvel[2] * dt;
      if (p.shrink) {
        const sc = Math.max(0.02, 1 - p.age / p.life);
        p.node.scale[0] = p.s0[0] * sc;
        p.node.scale[1] = p.s0[1] * sc;
      }
      alive.push(p);
    }
    this.particles = alive;
    if (this.shakeT > 0) {
      this.shakeT = Math.max(0, this.shakeT - dt);
      const ratio = this.shakeT / Math.max(0.05, this.shakeDur);
      renderer.camRot[2] = (Math.random()*2 - 1) * this.shakeMag * 2.6 * ratio;
      if (this.shakeT <= 0) {
        this.shakeMag = 0;
        renderer.camRot[2] = 0;
      }
    }
  }
  collectDrawables(renderer, outO, outT, outA) {
    for (const p of this.particles) p.node.collectDrawables(null, renderer, outO, outT, outA);
  }
  clear(renderer) {
    this.particles.length = 0;
    this.shakeT = 0; this.shakeMag = 0;
    if (renderer) renderer.camRot[2] = 0;
  }
}
const FX = new SimpleFXManager();

const WORLD_UI = document.getElementById('worldUI');
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

class TypingProjectile {
  constructor(startPos, targetPos, kind, wordPair, flightSec = 2.6) {
    this.pos = startPos.slice();
    this.startPos = startPos.slice();
    this.targetPos = targetPos.slice();
    this.kind = kind;
    this.word = new TypingWord(wordPair[0], wordPair[1]);
    this.flightSec = flightSec;
    this.t = 0;
    this.alive = true;
    this.isProjectile = true;
    this.isItem = false;
    this.isBoss = false;

    this.root = new Node3D({ pos: this.pos });
    this.mesh = this.root.addChild({});
    if (kind === "axe") {
      this.mesh.addChild({ model:'cube', scale:[0.12, 0.9, 0.12], color:cRGBA(115,78,44) });
      this.mesh.addChild({ model:'cube', pos:[0.22,0.25,0], scale:[0.45,0.35,0.08], color:cRGBA(215,220,225) });
      this.mesh.addChild({ model:lodModel('sphere'), pos:[0.22,0.25,0], scale:0.25, color:cRGBA(245,130,50) });
    } else if (kind === "rock") {
      this.mesh.addChild({ model:lodModel('icosphere'), scale:0.85, tex:'rock', color:cRGBA(165,155,145) });
    } else if (kind === "venom") {
      this.mesh.addChild({ model:lodModel('sphere'), scale:0.52, color:cRGBA(115,225,75) });
      this.mesh.addChild({ model:lodModel('sphere'), scale:0.68, color:cRGBA(135,245,95,110) });
    } else {
      this.mesh.addChild({ model:lodModel('sphere'), scale:0.65, color:cRGBA(120,200,255) });
      this.mesh.addChild({ model:lodModel('sphere'), scale:0.82, color:cRGBA(255,170,95,125) });
    }

    this.el = document.createElement('div');
    this.el.className = 'w-card proj';
    this.el.innerHTML = `<div class="w-jp">${escapeHtml(this.word.displayJp)}</div><div class="w-roma"></div>`;
    WORLD_UI.appendChild(this.el);
    this.romaEl = this.el.querySelector('.w-roma');
    this.refreshUI(false);
  }
  refreshUI(locked) {
    if (!this.alive) return;
    const [done, rem] = this.word.getParts();
    this.el.classList.toggle('locked', !!locked);
    this.romaEl.innerHTML = `<span class="done">${escapeHtml(done)}</span><span class="rem">${escapeHtml(rem)}</span>`;
  }
  step(dt, isLocked, renderer) {
    if (!this.alive) return null;
    this.t += dt / this.flightSec;
    if (this.t >= 1.0) { this.cleanup(); return "HIT_PLAYER"; }
    const x = lerp(this.startPos[0], this.targetPos[0], this.t);
    const y = lerp(this.startPos[1], this.targetPos[1], this.t) + Math.sin(this.t * Math.PI) * (this.kind === "axe" ? 2.0 : 0.7);
    const z = lerp(this.startPos[2], this.targetPos[2], this.t);
    this.pos[0] = x; this.pos[1] = y; this.pos[2] = z;
    this.root.pos[0] = x; this.root.pos[1] = y; this.root.pos[2] = z;
    this.mesh.rot[0] += 480 * dt;
    this.mesh.rot[1] += 220 * dt;
    this.mesh.scale[0] = lerp(this.mesh.scale[0], 1.0, Math.min(1, dt * 10));
    this.mesh.scale[1] = this.mesh.scale[0];
    this.mesh.scale[2] = this.mesh.scale[0];

    const sp = renderer.projectWorldToScreen(x, y + 0.55, z);
    const sx = clamp(sp.x, 0.14, 0.86) * 100;
    const sy = clamp(sp.y, 0.16, 0.84) * 100;
    this.el.style.display = 'block';
    this.el.style.left = sx.toFixed(2) + '%';
    this.el.style.top = sy.toFixed(2) + '%';
    this.el.style.zIndex = isLocked ? '16' : '11';
    return null;
  }
  onHitChar() {
    this.mesh.scale = [1.22, 1.22, 1.22];
    this.t = Math.max(0, this.t - 0.06);
  }
  cleanup() {
    if (!this.alive) return;
    this.alive = false;
    if (this.el && this.el.parentNode) this.el.parentNode.removeChild(this.el);
  }
}

class HealBox {

    this.box.addChild({ model:'cube', pos:[0,0,-0.52], scale:[0.45,0.14,0.05], color:cRGBA(55,195,105) });

    this.refreshUI(false);
  }
  setWord(wordPair) {
    if (!this.alive) return;
    this.word = new TypingWord(wordPair[0], wordPair[1]);
    this.jpEl.textContent = "回復: " + this.word.displayJp;
    this.refreshUI(false);
  }
  refreshUI(locked) {
    if (!this.alive) return;
    const [done, rem] = this.word.getParts();
    this.el.classList.toggle('locked', !!locked);
    this.romaEl.innerHTML = `<span class="done">${escapeHtml(done)}</span><span class="rem">${escapeHtml(rem)}</span>`;
  }
  step(dt, isLocked, renderer) {
    if (!this.alive) return;
    this.box.rot[1] += 55 * dt;
    this.box.pos[1] = lerp(this.box.pos[1], 0.45, Math.min(1, dt * 8));
    const d = dist2d(this.pos[0], this.pos[2], renderer.camPos[0], renderer.camPos[2]);
    const dx = this.pos[0] - renderer.camPos[0], dy = this.pos[1] - renderer.camPos[1], dz = this.pos[2] - renderer.camPos[2];
    const dl = Math.hypot(dx, dy, dz) || 1;
    const dotF = (dx*renderer.camFwd[0] + dy*renderer.camFwd[1] + dz*renderer.camFwd[2]) / dl;
    if (d > 1.4 && d < 34.0 && dotF > 0.42) {
      const sp = renderer.projectWorldToScreen(this.pos[0], this.pos[1] + 1.35, this.pos[2]);
      if (sp.inFront) {
        const tx = clamp(sp.x, 0.14, 0.86), ty = clamp(sp.y, 0.16, 0.84);
        if (!this.uiVisible) { this.uiX = tx; this.uiY = ty; this.uiVisible = true; this.el.style.display = 'block'; }
        else {
          const a = 1 - Math.exp(-18 * dt);
          this.uiX = lerp(this.uiX, tx, a);
          this.uiY = lerp(this.uiY, ty, a);
        }
        this.el.style.left = (this.uiX * 100).toFixed(2) + '%';
        this.el.style.top = (this.uiY * 100).toFixed(2) + '%';
        this.el.style.zIndex = isLocked ? '14' : '6';
        return;
      }
    }
    this.uiVisible = false;
    this.el.style.display = 'none';
  }
  onHitChar() { this.box.pos[1] = 0.65; }
  cleanup() {
    if (!this.alive) return;
    this.alive = false;
    this.uiVisible = false;
    if (this.el && this.el.parentNode) this.el.parentNode.removeChild(this.el);
  }
}

class Enemy3D {
  constructor(opts) {
    this.kind = opts.kind;
    this.difficulty = opts.difficulty || 4;
    const meta = GAME_DATA.ENEMY_META[this.kind];
    this.displayName = opts.customName || meta.name;
    this.rawSpeed = meta.spd;
    this.rawWindup = meta.wind;
    const dp = GAME_DATA.DIFFICULTY_PARAMS[this.difficulty];
    this.speed = this.rawSpeed * dp.spd_mult;
    this.baseWindup = this.rawWindup * dp.wind_mult;
    this.windupSec = this.baseWindup;
    this.backoffDist = dp.backoff;
    this.stopDist = meta.stop;
    this.isRanged = meta.ranged;
    this.isBoss = meta.boss;
    this.bossStyle = opts.bossStyle || 5;
    this.isProjectile = false;
    this.isItem = false;
    this.descendToPlayer = !!opts.descendToPlayer;

    this.wordQueue = opts.wordPairs.map(([jp, kn]) => new TypingWord(jp, kn));
    this.word = this.wordQueue.shift();
    this.totalPhases = opts.wordPairs.length;
    this.phase = 1;

    this.pos = opts.spawnPos.slice();
    this.rotY = 0;
    this.state = "EMERGE";
    this.emergeMode = opts.emergeMode || "normal";
    this.emergeT = 0;
    this.emergeStart = opts.spawnPos.slice();
    this.emergeEnd = opts.spawnPos.slice();
    this.doorNode = opts.doorNode || null;
    const ed = opts.emergeDir || [0, 0, -1];

    if (this.emergeMode === "door") {
      this.emergeStart = [opts.spawnPos[0] - ed[0]*2.2, opts.spawnPos[1], opts.spawnPos[2] - ed[2]*2.2];
      this.emergeEnd   = [opts.spawnPos[0] + ed[0]*1.5, opts.spawnPos[1], opts.spawnPos[2] + ed[2]*1.5];
      this.pos = this.emergeStart.slice();
      AUDIO.playSfx('door');
    } else if (this.emergeMode === "climb") {
      this.emergeStart = [opts.spawnPos[0], opts.spawnPos[1] - 3.0, opts.spawnPos[2]];
      this.pos = this.emergeStart.slice();
    } else if (this.emergeMode === "peek") {
      this.emergeStart = [opts.spawnPos[0] - ed[0]*2.0, opts.spawnPos[1], opts.spawnPos[2] - ed[2]*2.0];
      this.pos = this.emergeStart.slice();
    } else if (this.emergeMode === "swoop") {
      this.emergeStart = [opts.spawnPos[0], opts.spawnPos[1] + 7.5, opts.spawnPos[2]];
      this.pos = this.emergeStart.slice();
    }

    this.windupT = 0;
    this.staggerT = 0;
    this.strikeT = 0;
    this.dyingT = 0;
    this.recoilT = 0;
    this.animT = Math.random() * 6.28;
    this.lastBeat = -1;
    this.stepShakeCd = 0;
    this.alive = true;
    this.targetable = true;
    this.startY = this.emergeEnd[1];
    this.startDist = 16.0;
    this.offscreenTag = "";
    this.uiInit = false;
    this.uiX = 0.5; this.uiY = 0.5;

    this.root = new Node3D({ pos: this.pos });
    this._buildVisualRig();

    // DOM Typing Card
    this.el = document.createElement('div');
    this.el.className = 'w-card' + (this.isBoss ? ' boss' : '');
    this.el.innerHTML = `<div class="w-hdr"><span class="w-name"></span><span class="w-phase"></span></div><div class="w-jp"></div><div class="w-roma"></div>`;
    WORLD_UI.appendChild(this.el);
    this.nameEl = this.el.querySelector('.w-name');
    this.phaseEl = this.el.querySelector('.w-phase');
    this.jpEl = this.el.querySelector('.w-jp');
    this.romaEl = this.el.querySelector('.w-roma');

    // DOM Attack Warning Reticle
    this.warnEl = document.createElement('div');
    this.warnEl.className = 'w-warn';
    this.warnEl.style.display = 'none';

    WORLD_UI.appendChild(this.warnEl);
    this.warnBox = this.warnEl.querySelector('.w-warn-box');

      this.rArm.addChild({ model:'cube', pos:[0,-1.02,-1.42], rot:[78,0,0], scale:[0.12,0.65,0.55], color:cRGBA(195,200,208) });
      if (k === "boss" && this.bossStyle === 4) {
        this.magicRing = this.rig.addChild({ model:'quad', pos:[0,1.5,-0.8], scale:[1.8,1.8,1], color:cRGBA(110,220,255,110), shade:false });
      }
    } else if (k === "assassin") {
      for (const arm of [this.lArm, this.rArm]) {
        arm.addChild({ model:'cube', pos:[0,-0.72,-0.45], rot:[75,0,0], scale:[0.05,0.95,0.10], color:cRGBA(215,220,232) });
      }
    } else if (k === "bomber") {
      this.rArm.addChild({ model:lodModel('sphere'), pos:[0,-0.72,-0.25], scale:0.35, color:cRGBA(255,140,50) });
    } else if (k === "necromancer") {
      this.rArm.addChild({ model:'cube', pos:[0,-0.45,-0.25], scale:[0.08,1.85,0.08], color:cRGBA(88,66,112) });
      this.rArm.addChild({ model:lodModel('sphere'), pos:[0,0.48,-0.25], scale:0.28, color:cRGBA(145,225,255), shade:false });
      this.magicRing = this.rig.addChild({ model:'quad', pos:[0,1.5,-0.8], scale:[1.45,1.45,1], color:cRGBA(150,115,255,105), shade:false });
    } else {
      this.rArm.addChild({ model:'cube', pos:[0,-0.70,-0.35], rot:[72,0,0], scale:[0.06,0.85,0.10], color:cRGBA(155,160,165) });
    }
  }

  applyDifficulty(diff) {
    this.difficulty = diff;
    const dp = GAME_DATA.DIFFICULTY_PARAMS[diff];
    this.speed = this.rawSpeed * dp.spd_mult;
    this.baseWindup = this.rawWindup * dp.wind_mult;
    this.backoffDist = dp.backoff;
    this._syncWindupToWord();
  }

  _syncWindupToWord() {
    const dp = GAME_DATA.DIFFICULTY_PARAMS[this.difficulty];
    const [, rem] = this.word.getParts();
    this.windupSec = Math.max(this.rawWindup, rem.length * 0.065 + 0.55) * dp.wind_mult;
  }

  refreshUI(locked) {
    if (!this.alive) return;
    const [done, rem] = this.word.getParts();
    this.el.classList.toggle('locked', !!locked);
    this.nameEl.textContent = this.offscreenTag + this.displayName;
    this.phaseEl.textContent = this.totalPhases > 1 ? `${this.phase}/${this.totalPhases}` : "";
    this.jpEl.textContent = this.word.displayJp;
    this.romaEl.innerHTML = `<span class="done">${escapeHtml(done)}</span><span class="rem">${escapeHtml(rem)}</span>`;
  }

  step(playerPos, dt, isLocked, uiYOff, renderer, nowSec) {
    if (!this.alive) return null;

    if (this.state === "DYING") {
      this.dyingT += dt / 0.65;
      if (this.dyingT >= 1.0) { this.cleanup(); return null; }
      const fallP = Math.min(1, this.dyingT * 1.55);
      let bx = this.pos[0] - playerPos[0], bz = this.pos[2] - playerPos[2];
      const bl = Math.hypot(bx, bz) || 1;
      bx /= bl; bz /= bl;
      this.pos[0] += bx * (4.8 * (1 - this.dyingT)) * dt;
      this.pos[2] += bz * (4.8 * (1 - this.dyingT)) * dt;
      this.root.pos = this.pos.slice();
      this.rig.rot[0] = lerp(0, 92, fallP * fallP);
      this.rig.pos[1] = lerp(0, 0.22, fallP);
      this.lArm.rot[0] = lerp(this.lArm.rot[0], -135, Math.min(1, dt * 10));
      this.rArm.rot[0] = lerp(this.rArm.rot[0], -135, Math.min(1, dt * 10));
      return null;
    }

    const dxP = playerPos[0] - this.pos[0], dzP = playerPos[2] - this.pos[2];
    if (Math.hypot(dxP, dzP) > 0.05) {
      this.rotY = Math.atan2(dxP, dzP) * 180 / Math.PI + 180;
    }
    this.root.rot[1] = this.rotY;

    if (this.recoilT > 0) {
      this.recoilT = Math.max(0, this.recoilT - dt);
      this.rig.rot[0] = -12 * (this.recoilT / 0.12);
    } else if (this.state !== "STAGGER" && this.state !== "STRIKE") {
      this.rig.rot[0] = lerp(this.rig.rot[0], 0, Math.min(1, dt * 8));
    }

    // Idle / Ambient animations
    const wingSpd = this.kind === "wasp" ? 28.0 : 11.0;
    for (const [wp, s] of this.wings) {
      wp.rot[2] = s * (12 + Math.sin(nowSec * wingSpd + this.animT) * (this.kind === "wasp" ? 38 : 30));
    }
    if (this.magicRing) {
      this.magicRing.rot[2] += 90 * dt;
      this.rig.pos[1] = 0.45 + Math.sin(nowSec * 3.5 + this.animT) * 0.22;
    } else if (this.ghostParts.length) {
      this.rig.pos[1] = 0.35 + Math.sin(nowSec * 2.8 + this.animT) * 0.30;
      const a = (105 + 75 * (0.5 + 0.5 * Math.sin(nowSec * 4.2 + this.animT))) / 255;
      for (const gp of this.ghostParts) gp.color[3] = a;
    } else if (this.kind === "wasp") {
      this.rig.pos[1] = Math.sin(nowSec * 7.5 + this.animT) * 0.32;
    } else if (!this.spiderLegs.length && this.state !== "APPROACH") {
      this.rig.pos[1] = Math.sin(nowSec * 2.4 + this.animT) * 0.04;
    }

    if (this.state === "EMERGE") {
      this.emergeT += dt / 0.85;
      if (this.doorNode) this.doorNode.rot[1] = lerp(this.doorNode.rot[1], 105, Math.min(1, dt * 7));
      if (this.emergeT >= 1.0) {
        this.pos = this.emergeEnd.slice();
        this.startDist = Math.max(this.stopDist + 1.0, dist2d(this.pos[0], this.pos[2], playerPos[0], playerPos[2]));
        this.state = this.isRanged ? "WINDUP" : "APPROACH";
      } else {
        const s = this.emergeT * this.emergeT * (3 - 2 * this.emergeT);
        this.pos[0] = lerp(this.emergeStart[0], this.emergeEnd[0], s);
        this.pos[1] = lerp(this.emergeStart[1], this.emergeEnd[1], s);
        this.pos[2] = lerp(this.emergeStart[2], this.emergeEnd[2], s);
      }
      this.root.pos = this.pos.slice();
      this._update2DUI(isLocked, uiYOff, dt, renderer);
      return null;
    }

    if (this.state === "STAGGER") {
      this.staggerT -= dt;
      this.rig.rot[0] = -34 * Math.sin(Math.max(0, this.staggerT / 0.80) * Math.PI);
      this.lArm.rot[0] = -45;
      this.rArm.rot[0] = -45;
      if (this.staggerT <= 0) {
        this.rig.rot[0] = 0;
        this.state = this.isRanged ? "WINDUP" : "APPROACH";
      }
      this.root.pos = this.pos.slice();
      this._update2DUI(isLocked, uiYOff, dt, renderer);
      return null;
    }

    let evOut = null;
    if (this.state === "APPROACH") {
      const d = dist2d(this.pos[0], this.pos[2], playerPos[0], playerPos[2]);
      if (d > this.stopDist) {
        let dirX = (playerPos[0] - this.pos[0]) / d, dirZ = (playerPos[2] - this.pos[2]) / d;
        if (["runner","assassin","wasp","ghost"].includes(this.kind)) {
          const att = clamp((d - this.stopDist) / 7.5, 0, 1);
          const sideX = -dirZ, sideZ = dirX;
          const freq = this.kind === "wasp" ? 5.4 : (this.kind === "ghost" ? 3.0 : 4.4);
          const amp = (this.kind === "wasp" || this.kind === "ghost") ? 0.65 : 0.42;
          const sw = Math.sin(nowSec * freq + this.animT) * amp * att;
          let mx = dirX + sideX * sw, mz = dirZ + sideZ * sw;
          const ml = Math.hypot(mx, mz) || 1;
          dirX = mx / ml; dirZ = mz / ml;
        }
        this.pos[0] += dirX * this.speed * dt;
        this.pos[2] += dirZ * this.speed * dt;

        if (this.kind === "gargoyle" || this.kind === "wasp" || (this.isBoss && this.bossStyle === 3)) {
          this.pos[1] = lerp(this.pos[1], playerPos[1] - 0.5, Math.min(1, dt * 1.6));
        } else if (this.descendToPlayer) {
          const prog = clamp(1 - (d - this.stopDist) / Math.max(1, this.startDist - this.stopDist), 0, 1);
          this.pos[1] = lerp(this.startY, playerPos[1] - 2.2, prog);
        } else {
          this.pos[1] = lerp(this.pos[1], this.startY, Math.min(1, dt * 4));
        }

        if (this.spiderLegs.length) {
          for (const [piv, s, idx] of this.spiderLegs) {
            const ph = nowSec * 16 + idx * 1.4 + (s === 1 ? 0 : 3.14);
            piv.rot[1] = Math.sin(ph) * 24;
            piv.rot[2] = s * Math.cos(ph) * 14;
          }
        } else if (!this.wings.length && !this.ghostParts.length) {
          const wt = nowSec * (this.kind === "runner" ? 8.5 : (this.kind === "giant" ? 3.6 : 5.8)) + this.animT;
          this.lLeg.rot[0] = Math.sin(wt) * 32;
          this.rLeg.rot[0] = -Math.sin(wt) * 32;
          if (this.kind !== "shield") {
            this.lArm.rot[0] = -18 - Math.sin(wt) * 20;
            this.rArm.rot[0] = -24 + Math.sin(wt) * 20;
          }
          if (this.kind === "runner") this.rig.rot[0] = 16;
          if (!this.magicRing) this.rig.pos[1] = Math.abs(Math.sin(wt)) * (this.kind === "giant" ? 0.15 : 0.09);
          if (this.kind === "giant") {
            this.stepShakeCd -= dt;
            if (this.stepShakeCd <= 0 && Math.abs(Math.sin(wt)) < 0.15) {
              this.stepShakeCd = 0.75;
              FX.addShake(0.14, 0.35);
            }
          }
        }
      } else {
        this.state = "WINDUP";
        this.windupT = 0;
        this.lastBeat = -1;
      }
    } else if (this.state === "WINDUP") {
      this.windupT += dt / this.windupSec;
      if (!this.isRanged) this.rArm.rot[0] = lerp(this.rArm.rot[0], -145, Math.min(1, dt * 3.5));
      if (this.windupT > 0.45) {
        const iv = this.windupT < 0.78 ? 0.85 : 0.45;
        const bIdx = Math.floor(this.windupT * this.windupSec / iv);
        if (bIdx !== this.lastBeat) {
          this.lastBeat = bIdx;
          AUDIO.playSfx('warn');
        }
      }
      if (this.windupT >= 1.0) {
        this.windupT = 0;
        const throwProj = this.kind === "bomber" || this.kind === "necromancer"
          || (this.kind === "giant" && Math.random() < 0.5)
          || (this.kind === "spider" && Math.random() < 0.45)
          || (this.kind === "boss" && Math.random() < 0.55);
        if (throwProj) {
          this.rArm.rot[0] = 20;
          this.state = this.isRanged ? "WINDUP" : "APPROACH";
          const pk = this.kind === "bomber" ? "axe" : (this.kind === "giant" ? "rock" : (this.kind === "spider" ? "venom" : "orb"));
          const ey = this.isBoss ? 4.6 : (this.kind === "giant" ? 2.6 : 1.5);
          evOut = ["SPAWN_PROJ", pk, [this.pos[0], this.pos[1] + ey, this.pos[2]]];
        } else {
          this.state = "STRIKE";
          this.strikeT = 0;
          evOut = ["STRIKE_PLAYER", null, null];
        }
      }
    } else if (this.state === "STRIKE") {
      this.strikeT += dt / 0.25;
      this.rArm.rot[0] = lerp(-145, 35, Math.min(1, this.strikeT * 2.4));
      if (this.strikeT >= 1.0) {
        this.state = this.isRanged ? "WINDUP" : "APPROACH";
        if (!this.isRanged) {
          let bx = this.pos[0] - playerPos[0], bz = this.pos[2] - playerPos[2];
          const bl = Math.hypot(bx, bz) || 1;
          this.pos[0] += (bx / bl) * this.backoffDist;
          this.pos[2] += (bz / bl) * this.backoffDist;
        }
      }
    }

    this.root.pos = this.pos.slice();
    this._update2DUI(isLocked, uiYOff, dt, renderer);
    return evOut;
  }

  _update2DUI(isLocked, uiYOff, dt, renderer) {
    if (!this.targetable) {
      this.el.style.display = 'none';
      this.warnEl.style.display = 'none';
      return;
    }
    const hOff = this.isBoss ? 6.4 : (this.kind === "giant" ? 4.2 : ((this.kind === "crawler" || this.kind === "spider") ? 1.5 : 2.45));
    const sp = renderer.projectWorldToScreen(this.pos[0], this.pos[1] + hOff, this.pos[2]);
    let tx, ty, tag = "";
    if (sp.inFront) {
      tx = clamp(sp.x, 0.14, 0.86);
      ty = clamp(sp.y + uiYOff, 0.16, 0.84);
      if (sp.x < 0.08) tag = "◀ ";
      else if (sp.x > 0.92) tag = "▶ ";
    } else {
      tx = sp.side > 0 ? 0.85 : 0.15;
      ty = clamp(0.45 + uiYOff, 0.20, 0.78);
      tag = sp.side > 0 ? "▶ " : "◀ ";
    }
    if (tag !== this.offscreenTag) {
      this.offscreenTag = tag;
      this.nameEl.textContent = tag + this.displayName;
    }
    if (!this.uiInit) {
      this.uiX = tx; this.uiY = ty; this.uiInit = true;
      this.el.style.display = 'block';
    } else {
      const a = 1 - Math.exp(-18 * dt);
      this.uiX = lerp(this.uiX, tx, a);
      this.uiY = lerp(this.uiY, ty, a);
    }
    this.el.style.left = (this.uiX * 100).toFixed(2) + '%';
    this.el.style.top = (this.uiY * 100).toFixed(2) + '%';
    this.el.style.zIndex = isLocked ? '14' : '8';

    if (this.state === "WINDUP") {
      const cp = renderer.projectWorldToScreen(this.pos[0], this.pos[1] + hOff * 0.55, this.pos[2]);
      const wx = cp.inFront ? clamp(cp.x, 0.15, 0.85) : this.uiX;
      const wy = cp.inFront ? clamp(cp.y, 0.16, 0.84) : Math.min(0.86, this.uiY + 0.12);
      this.warnEl.style.display = 'block';
      this.warnEl.style.left = (wx * 100).toFixed(2) + '%';
      this.warnEl.style.top = (wy * 100).toFixed(2) + '%';
      const boxPx = Math.round(lerp(130, 32, this.windupT));
      this.warnBox.style.width = boxPx + 'px';
      this.warnBox.style.height = boxPx + 'px';
      const remS = Math.max(0, (1 - this.windupT) * this.windupSec);
      this.warnTxt.textContent = `こうげき ${remS.toFixed(1)}s`;
    } else {
      this.warnEl.style.display = 'none';
    }
  }

  onHitChar() {
    if (!this.alive) return;
    this.recoilT = 0.11;
    if (this.state === "WINDUP") this.windupT = Math.max(0, this.windupT - 0.10);
    FX.spawnHitSmoke([this.pos[0] + (Math.random()*2-1)*0.3, this.pos[1] + 1.5, this.pos[2] + (Math.random()*2-1)*0.2]);
  }

  onWordCompleted() {
    if (this.wordQueue.length) {
      AUDIO.playSfx('stagger');
      if (this.shieldNode) {
        const m = this.shieldNode.worldMat;
        FX.spawnDebris([m[12], m[13], m[14]], [0.82,1.28,0.14], cRGBA(118,126,138), [-5.5,3.6,2.4], [320,420,210], 0.55);
        this.shieldNode.enabled = false;
        this.shieldNode = null;
      }
      this.word = this.wordQueue.shift();
      this._syncWindupToWord();
      this.phase += 1;
      this.state = "STAGGER";
      this.staggerT = 0.80;
      this.windupT = 0;
      this.refreshUI(true);
      return false;
    } else {
      AUDIO.playSfx('kill');
      this.targetable = false;
      this.el.style.display = 'none';
      this.warnEl.style.display = 'none';
      if (this.kind === "skeleton") {
        const cp = [this.pos[0], this.pos[1] + 1.2, this.pos[2]];
        for (let i = 0; i < 8; i++) {
          FX.spawnDebris(
            cp, [0.10,0.45,0.10], cRGBA(228,224,210),
            [(Math.random()*2-1)*4.2, -1 + Math.random()*5, (Math.random()*2-1)*4.2],
            [180+Math.random()*300, 180+Math.random()*300, 180+Math.random()*300],
            0.55
          );
        }
        this.cleanup();
        return true;
      }
      this.state = "DYING";
      this.dyingT = 0;
      return true;
    }
  }

  cleanup() {
    if (!this.alive) return;
    this.alive = false;
    this.targetable = false;
    if (this.el && this.el.parentNode) this.el.parentNode.removeChild(this.el);
    if (this.warnEl && this.warnEl.parentNode) this.warnEl.parentNode.removeChild(this.warnEl);
  }
}

// =====================================================================
// 6. 5ステージ×13区間 3Dコースビルダー（区間ごとVBOバッチ＋動的カリング）
// =====================================================================
function buildLongStageCourse(stageNum, qualityLevel, renderer) {
  const q = GAME_DATA.QUALITY_PRESETS[qualityLevel];
  const th = GAME_DATA.STAGE_THEMES[stageNum];
  const rng = makeRng(stageNum * 997 + 13);
  const randRange = (a, b) => a + rng() * (b - a);
  const choice = (arr) => arr[Math.floor(rng() * arr.length)];

  const hazeColors = {
    1: [0.78, 0.89, 0.94],
    2: [0.76, 0.73, 0.70],
    3: [0.72, 0.87, 0.97],
    4: [0.14, 0.25, 0.39],
    5: [0.92, 0.66, 0.47],
  };
  const hazeCol = hazeColors[stageNum] || hazeColors[1];
  const groundTint = cRGBA(...th.ground_tint);
  const pathTint = cRGBA(...th.path_tint);
  const sunCol = cRGBA(...th.sun_color);
  const moteCol = cRGBA(...th.mote_color);

  const globalBgItems = [];
  const globalFxNodes = [];
  const segBatches = [];
  const segFxLists = [];
  const segDoors = [];
  const doors = {};
  const healPositions = [];
  const encounters = [];
  const motes = [];

  const pushStatic = (list, parentMat, opts) => {
    const pos = opts.pos || [0,0,0];
    const rot = opts.rot || [0,0,0];
    const sc = typeof opts.scale === 'number' ? [opts.scale, opts.scale, opts.scale] : (opts.scale || [1,1,1]);
    const lm = M4.fromTRS(pos[0], pos[1], pos[2], rot[0], rot[1], rot[2], sc[0], sc[1], sc[2]);
    const wm = parentMat ? M4.mul(parentMat, lm) : lm;
    list.push({
      model: opts.model,
      worldMat: wm,
      tex: opts.tex || 'white',
      color: opts.color || [1,1,1,1],
      uvScale: opts.uvScale || [1,1],
    });
  };

  const rooms = th.rooms;
  const hasOutdoor = rooms.some(r => r === "forest" || r === "village" || r === "bridge");

  if (hasOutdoor) {
    if (q.fx_glow) {
      const sunPos = stageNum !== 5 ? [95, 82, 170] : [0, 38, 225];
      globalFxNodes.push(new Node3D({ model:lodModel('sphere'), pos:sunPos, scale:16, color:sunCol, useFog:false, shade:false }));
      globalFxNodes.push(new Node3D({ model:'quad', billboard:true, additive:true, pos:sunPos, scale:[64,64,1], tex:'soft_glow', color:cRGBA(255,248,225,190), useFog:false, shade:false }));
    }
    const mtnCnt = q.mountains;
    if (mtnCnt > 0) {
      const mtnCol = (stageNum === 1 || stageNum === 3) ? cRGBA(118,152,168) : (stageNum === 5 ? cRGBA(126,94,96) : cRGBA(98,112,134));
      const mtnFar = (stageNum === 1 || stageNum === 3) ? cRGBA(142,174,192) : (stageNum === 5 ? cRGBA(158,112,92) : cRGBA(118,128,148));
      const step = Math.max(15, Math.floor(360 / mtnCnt));
      for (let ang = 0; ang < 360; ang += step) {
        const ar = ang * Math.PI / 180;
        const dr = randRange(165, 195);
        const mx = Math.cos(ar) * dr, mz = 140 + Math.sin(ar) * dr;
        const mh = randRange(32, 70), mw = randRange(40, 70);
        pushStatic(globalBgItems, null, { model:'cone', pos:[mx, mh*0.42 - 10, mz], scale:[mw, mh, mw], color:(ang % (step*2) === 0) ? mtnCol : mtnFar });
      }
    }
  }

  for (let i = 0; i < q.motes; i++) {
    const m = new Node3D({
      model:'quad', billboard:true, additive:true, tex:'soft_glow',
      scale: randRange(0.18, 0.34), color:[moteCol[0], moteCol[1], moteCol[2], 0.65],
      useFog:false, shade:false
    });
    globalFxNodes.push(m);
    motes.push([m, [randRange(-9, 9), randRange(0.6, 5.2), randRange(4, 22)], randRange(0, 6.28)]);
  }

  const addTree = (list, pos, hSc) => {
    const tm = M4.fromTRS(pos[0], pos[1], pos[2], 0, 0, 0, 1, 1, 1);
    const h = 6.0 * hSc;
    const botY = Math.min(-0.4, -1.9 - pos[1]);
    const trunkH = h - botY, trunkY = (h + botY) * 0.5, w = 0.72 * hSc;
    const mode = q.tree_mode;
    const leaves = stageNum !== 5 ? [cRGBA(54,116,48), cRGBA(68,136,58), cRGBA(44,96,40)] : [cRGBA(188,96,46), cRGBA(215,132,54), cRGBA(152,70,40)];
    pushStatic(list, tm, { model:'cube', pos:[0,trunkY,0], scale:[w,trunkH,w], tex:'bark', color:cRGBA(205,185,168) });
    if (mode === "full" || mode === "mid") {
      pushStatic(list, tm, { model:'cube', pos:[0,trunkY,0], rot:[0,45,0], scale:[w,trunkH,w], tex:'bark', color:cRGBA(195,175,158) });
    }
    if (mode === "full") {
      for (const [ox,oy,oz,rad] of [[0,h,0,3.0],[-1.4,h-0.8,0.9,2.3],[1.4,h-0.6,-0.9,2.4],[0.3,h+1.1,0.2,2.1],[-0.8,h-1.5,-1.0,1.9]]) {
        pushStatic(list, tm, { model:'sphere', pos:[ox*hSc,oy,oz*hSc], scale:[rad*hSc,rad*0.72*hSc,rad*hSc], color:choice(leaves) });
      }
      pushStatic(list, tm, { model:'sphere', pos:[0.8,botY+0.45,0.5], scale:[1.5,0.85,1.3], color:leaves[2] });
    } else if (mode === "mid") {
      for (const [ox,oy,oz,rad] of [[0,h+0.2,0,3.2],[-1.3,h-0.8,0.8,2.3],[1.3,h-0.6,-0.8,2.3]]) {
        pushStatic(list, tm, { model:'sphere', pos:[ox*hSc,oy,oz*hSc], scale:[rad*hSc,rad*0.74*hSc,rad*hSc], color:choice(leaves) });
      }
    } else if (mode === "low") {
      pushStatic(list, tm, { model:'sphere', pos:[0,h+0.2,0], scale:[3.4*hSc,2.5*hSc,3.4*hSc], color:leaves[0] });
      pushStatic(list, tm, { model:'sphere', pos:[0.9*hSc,h-0.9,-0.6*hSc], scale:[2.3*hSc,1.8*hSc,2.3*hSc], color:leaves[1] });
    } else if (mode === "box") {
      pushStatic(list, tm, { model:'cube', pos:[0,h,0], rot:[0,20,0], scale:[3.2*hSc,2.1*hSc,3.2*hSc], color:leaves[0] });
      pushStatic(list, tm, { model:'cube', pos:[0,h+1.2*hSc,0], rot:[0,55,0], scale:[2.2*hSc,1.5*hSc,2.2*hSc], color:leaves[1] });
    } else {
      pushStatic(list, tm, { model:'cube', pos:[0,h,0], rot:[0,25,0], scale:[3.1*hSc,2.3*hSc,3.1*hSc], color:leaves[0] });
    }
  };

  const addSunbeam = (fxList, orig, flr, yawDeg, tint, beamW = 3.2) => {
    const cnt = q.sunbeams;
    if (cnt <= 0) return;
    const mid = [(orig[0]+flr[0])*0.5, (orig[1]+flr[1])*0.5, (orig[2]+flr[2])*0.5];
    const len = dist3d(orig[0],orig[1],orig[2], flr[0],flr[1],flr[2]);
    const az = (orig[0] - flr[0]) >= 0 ? 26 : -26;
    const dyaws = cnt >= 2 ? [0, 52] : [0];
    for (const dy of dyaws) {
      fxList.push(new Node3D({
        model:'quad', additive:true, pos:mid, rot:[0, yawDeg + dy, az], scale:[beamW, len, 1],
        tex:'soft_beam', color:[tint[0], tint[1], tint[2], 0.52], useFog:false, shade:false
      }));
    }
    fxList.push(new Node3D({
      model:'quad', additive:true, pos:[flr[0], flr[1]+0.08, flr[2]], rot:[90, 0, 0],
      scale:[beamW*1.45, beamW*1.15, 1], tex:'soft_glow',
      color:[tint[0], tint[1], tint[2], 0.42], useFog:false, shade:false
    }));
  };

  const addLamp = (list, fxList, pos, yawDeg) => {
    if (q.props === "min") return;
    const lm = M4.fromTRS(pos[0], pos[1], pos[2], 0, yawDeg, 0, 1, 1, 1);
    pushStatic(list, lm, { model:'cube', pos:[0,1.9,0], scale:[0.18,3.8,0.18], color:cRGBA(52,56,62) });
    pushStatic(list, lm, { model:'cube', pos:[0,3.9,0], scale:[0.45,0.55,0.45], color:cRGBA(255,232,165) });
    if (q.fx_glow && q.props === "full") {
      fxList.push(new Node3D({ model:'quad', billboard:true, additive:true, pos:[pos[0],pos[1]+3.9,pos[2]], scale:[2.4,2.4,1], tex:'soft_glow', color:cRGBA(255,225,145,145), useFog:false, shade:false }));
    }
  };

  const addHouse = (list, doorNodeList, pos, yawDeg, doorId = null) => {
    const hm = M4.fromTRS(pos[0], pos[1], pos[2], 0, yawDeg, 0, 1, 1, 1);
    pushStatic(list, hm, { model:'cube', pos:[0,2.5,0], scale:[6.8,5.0,5.6], tex:'wood', color:cRGBA(218,206,192) });
    if (q.props !== "min") {
      pushStatic(list, hm, { model:'cube', pos:[0,0.45,0], scale:[7.0,0.9,5.8], tex:'stone', color:cRGBA(175,172,165) });
      pushStatic(list, hm, { model:'cube', pos:[1.9,6.6,1.2], scale:[0.9,2.4,0.9], tex:'brick', color:cRGBA(170,150,140) });
      pushStatic(list, hm, { model:'cube', pos:[-2.6,0.5,-3.2], scale:[0.9,0.9,0.9], tex:'crate' });
    }
    pushStatic(list, hm, { model:'cube', pos:[-1.8,5.85,0], rot:[0,0,28], scale:[4.4,0.32,6.4], tex:'roof' });
    pushStatic(list, hm, { model:'cube', pos:[1.8,5.85,0], rot:[0,0,-28], scale:[4.4,0.32,6.4], tex:'roof' });
    pushStatic(list, hm, { model:'quad', pos:[2.1,2.8,-2.84], scale:[1.2,1.3,1], color:cRGBA(255,222,145) });
    if (doorId) {
      pushStatic(list, hm, { model:'quad', pos:[0,1.5,-2.84], scale:[1.9,3.0,1], color:cRGBA(18,18,22) });
      const houseRoot = new Node3D({ pos, rot:[0, yawDeg, 0] });
      const hinge = houseRoot.addChild({ pos:[-0.95, 1.5, -2.90] });
      hinge.addChild({ model:'cube', pos:[0.95, 0, 0], scale:[1.9, 3.0, 0.14], tex:'wood', color:cRGBA(165,132,98) });
      doors[doorId] = hinge;
      doorNodeList.push(houseRoot);
    }
  };

  const addArch = (list, pos, yawDeg, width, height = 7.4, col = cRGBA(195,188,178)) => {
    const am = M4.fromTRS(pos[0], pos[1], pos[2], 0, yawDeg, 0, 1, 1, 1);
    const hw = width * 0.5 + 0.35;
    pushStatic(list, am, { model:'cube', pos:[-hw,height*0.5,0], scale:[1.4,height,1.4], tex:'brick', color:col });
    pushStatic(list, am, { model:'cube', pos:[hw,height*0.5,0], scale:[1.4,height,1.4], tex:'brick', color:col });
    pushStatic(list, am, { model:'cube', pos:[0,height+0.5,0], scale:[width+2.4,1.3,1.5], tex:'stone', color:col });
    if (q.props !== "min") {
      pushStatic(list, am, { model:'cube', pos:[0,height+0.5,-0.78], scale:[1.2,1.6,0.25], color:cRGBA(225,215,195) });
    }
  };

  const addDining = (list, fxList, pos, yawDeg) => {
    const dm = M4.fromTRS(pos[0], pos[1], pos[2], 0, yawDeg, 0, 1, 1, 1);
    pushStatic(list, dm, { model:'cube', pos:[0,0.88,0], scale:[2.2,0.12,4.8], tex:'wood', color:cRGBA(145,95,62) });
    pushStatic(list, dm, { model:'cube', pos:[0,0.96,0], scale:[1.2,0.04,4.4], color:cRGBA(175,45,48) });
    for (const lx of [-0.85,0.85]) for (const lz of [-2.0,2.0]) {
      pushStatic(list, dm, { model:'cube', pos:[lx,0.44,lz], scale:[0.14,0.88,0.14], color:cRGBA(95,62,40) });
    }
    if (q.props === "min") return;
    const ry = yawDeg * Math.PI / 180;
    const czs = q.props === "full" ? [-1.5, 0.0, 1.5] : [0.0];
    for (const cz of czs) {
      pushStatic(list, dm, { model:lodModel('sphere'), pos:[0,1.22,cz], scale:0.14, color:cRGBA(255,215,105) });
      if (q.fx_glow) {
        fxList.push(new Node3D({ model:'quad', billboard:true, additive:true, pos:[pos[0]+Math.sin(ry)*cz, pos[1]+1.25, pos[2]+Math.cos(ry)*cz], scale:[0.95,0.95,1], tex:'soft_glow', color:cRGBA(255,205,105,120), useFog:false, shade:false }));
      }
      for (const sx of [-1.45, 1.45]) {
        pushStatic(list, dm, { model:'cube', pos:[sx,0.48,cz], scale:[0.55,0.10,0.55], color:cRGBA(125,78,52) });
        pushStatic(list, dm, { model:'cube', pos:[sx + (sx>0?0.24:-0.24),0.92,cz], scale:[0.10,0.95,0.55], color:cRGBA(115,70,46) });
      }
    }
  };

  const addCrystalOrTorch = (list, fxList, pos, isCrystal) => {
    if (isCrystal) {
      const specs = q.props !== "min" ? [[0,0,2.5,10],[0.45,0.3,1.6,-18],[-0.4,0.2,1.3,22]] : [[0,0,2.4,10]];
      for (const [ox,oz,sh,rz] of specs) {
        pushStatic(list, null, { model:lodModel('cone'), pos:[pos[0]+ox, pos[1]+sh*0.48, pos[2]+oz], rot:[8,20,rz], scale:[0.55,sh,0.55], color:cRGBA(125,235,255,245) });
      }
      if (q.fx_glow) {
        fxList.push(new Node3D({ model:'quad', billboard:true, additive:true, pos:[pos[0],pos[1]+1.6,pos[2]], scale:[3.4,3.4,1], tex:'soft_glow', color:cRGBA(110,225,255,135), useFog:false, shade:false }));
      }
    } else {
      pushStatic(list, null, { model:'cube', pos:[pos[0],pos[1]+1.4,pos[2]], scale:[0.16,2.8,0.16], color:cRGBA(85,65,48) });
      pushStatic(list, null, { model:lodModel('sphere'), pos:[pos[0],pos[1]+2.9,pos[2]], scale:0.30, color:cRGBA(255,200,85) });
      if (q.fx_glow) {
        fxList.push(new Node3D({ model:'quad', billboard:true, additive:true, pos:[pos[0],pos[1]+2.95,pos[2]], scale:[2.6,2.6,1], tex:'soft_glow', color:cRGBA(255,175,75,135), useFog:false, shade:false }));
      }
    }
  };

  let curPos = [0, 0, 0], curYaw = 0;
  const segLen = 28.0;
  let doorCounter = 0;

  for (let idx = 0; idx < 13; idx++) {
    const isBossWave = (idx === 12);
    const rm = rooms[idx];
    const isIndoor = ["hall","dining","library","dungeon","barn","cave","crystal"].includes(rm);

    const staticItems = [];
    const fxList = [];
    const doorNodes = [];

    const nextYaw = curYaw + GAME_DATA.TURN_PATTERNS[stageNum - 1][idx];
    const nextY = GAME_DATA.ELEV_PATTERNS[stageNum - 1][idx];
    const rad = nextYaw * Math.PI / 180;
    const fwd = [Math.sin(rad), 0, Math.cos(rad)];
    const right = [Math.cos(rad), 0, -Math.sin(rad)];

    const segStart = curPos.slice();
    const segEnd = [curPos[0] + fwd[0]*segLen, nextY, curPos[2] + fwd[2]*segLen];
    const segMid = [(segStart[0]+segEnd[0])*0.5, (segStart[1]+segEnd[1])*0.5, (segStart[2]+segEnd[2])*0.5];
    const dy = segEnd[1] - segStart[1];
    const segLen3d = Math.hypot(segLen, dy);
    const slopePitch = -Math.atan2(dy, segLen) * 180 / Math.PI;

    const pathW = isBossWave ? 18.0 : ((rm === "dining" || rm === "library") ? 14.5 : ((rm === "hall" || rm === "crystal") ? 10.4 : 9.4));
    const floorTex = rm === "hall" ? 'carpet' : ((rm === "dining" || rm === "library" || rm === "barn") ? 'wood' : 'stone');
    const floorCol = rm === "dungeon" ? cRGBA(135,140,152) : (rm === "cave" ? cRGBA(150,145,140) : (rm === "crystal" ? cRGBA(185,205,228) : pathTint));
    const wallTex = rm === "cave" ? 'rock' : (rm === "barn" ? 'wood' : 'brick');
    const wallCol = rm === "dungeon" ? cRGBA(115,120,132) : (rm === "cave" ? cRGBA(145,138,132) : (rm === "crystal" ? cRGBA(145,168,200) : cRGBA(215,205,196)));

    // 1. Floor slope
    pushStatic(staticItems, null, {
      model:'cube', pos:[segMid[0], segMid[1]-0.36, segMid[2]], rot:[slopePitch, nextYaw, 0],
      scale:[pathW, 0.72, segLen3d + 0.5], tex:floorTex,
      uvScale:[Math.max(1, Math.floor(pathW/4)), Math.max(2, Math.floor(segLen3d/5))], color:floorCol
    });
    // 2. Corner joint + Arch
    const hubW = pathW * 0.92;
    pushStatic(staticItems, null, { model:'cube', pos:[segStart[0], segStart[1]-0.39, segStart[2]], rot:[0,nextYaw,0], scale:[hubW,0.70,hubW], tex:'stone', color:floorCol });
    if (q.props !== "min") {
      pushStatic(staticItems, null, { model:'cube', pos:[segStart[0], segStart[1]-0.40, segStart[2]], rot:[0,nextYaw+45,0], scale:[hubW,0.70,hubW], tex:'stone', color:floorCol });
    }
    if (idx > 0 && (isIndoor || rm === "village" || rm === "bridge" || isBossWave)) {
      addArch(staticItems, [segStart[0]+fwd[0]*0.8, segStart[1], segStart[2]+fwd[2]*0.8], nextYaw, pathW - 0.6, isIndoor ? 7.6 : 6.4, wallCol);
    }

    const lerpSeg = (f) => [lerp(segStart[0],segEnd[0],f), lerp(segStart[1],segEnd[1],f), lerp(segStart[2],segEnd[2],f)];

    if (isIndoor) {
      const wallH = 9.2 + Math.abs(dy);
      for (const s of [-1, 1]) {
        const wOff = s * (pathW * 0.5 + 0.45);
        pushStatic(staticItems, null, {
          model:'cube', pos:[segMid[0]+right[0]*wOff, segMid[1]+4.4, segMid[2]+right[2]*wOff], rot:[0,nextYaw,0],
          scale:[0.9, wallH, segLen + 2.2], tex:wallTex, uvScale:[6,2], color:wallCol
        });
        if (q.props !== "min") {
          const bOff = s * (pathW * 0.5 - 0.05);
          pushStatic(staticItems, null, {
            model:'cube', pos:[segMid[0]+right[0]*bOff, segMid[1]+0.55, segMid[2]+right[2]*bOff], rot:[slopePitch,nextYaw,0],
            scale:[0.25, 1.1, segLen3d + 0.4], color:rm !== "dungeon" ? cRGBA(68,56,48) : cRGBA(74,78,86)
          });
        }
      }
      const ceilC = (rm === "dungeon" || rm === "cave") ? cRGBA(30,32,40) : ((rm === "dining" || rm === "library" || rm === "barn") ? cRGBA(68,56,52) : cRGBA(54,52,62));
      pushStatic(staticItems, null, { model:'cube', pos:[segMid[0],segMid[1]+8.9,segMid[2]], rot:[slopePitch,nextYaw,0], scale:[pathW+1.8,0.4,segLen3d+1.4], color:ceilC });

      const fracs = (q.props === "full" || q.props === "mid") ? [0.22, 0.50, 0.78] : [0.50];
      for (const frac of fracs) {
        const p = lerpSeg(frac);
        if (q.props !== "min") {
          pushStatic(staticItems, null, { model:'cube', pos:[p[0],p[1]+8.3,p[2]], rot:[0,nextYaw,0], scale:[pathW+0.6,0.65,0.65], color:rm!=="dungeon"?cRGBA(58,46,38):cRGBA(64,68,76) });
        }
        for (const s of [-1, 1]) {
          pushStatic(staticItems, null, { model:'cube', pos:[p[0]+right[0]*s*(pathW*0.48), p[1]+4.3, p[2]+right[2]*s*(pathW*0.48)], rot:[0,nextYaw,0], scale:[0.85,8.6,0.85], color:rm==="dungeon"?cRGBA(82,84,92):cRGBA(162,148,134) });
          if (rm === "library" && (frac !== 0.50 || q.props === "min")) {
            pushStatic(staticItems, null, { model:'cube', pos:[p[0]+right[0]*s*(pathW*0.43), p[1]+2.8, p[2]+right[2]*s*(pathW*0.43)], rot:[0,nextYaw,0], scale:[1.1,5.6,4.6], tex:'bookshelf' });
          } else if (rm === "dungeon" && (frac !== 0.50 || q.props === "min")) {
            pushStatic(staticItems, null, { model:'quad', pos:[p[0]+right[0]*s*(pathW*0.42), p[1]+2.2, p[2]+right[2]*s*(pathW*0.42)], rot:[0,nextYaw+(s===1?90:-90),0], scale:[4.8,4.4,1], tex:'bars' });
            if (frac === 0.22) addCrystalOrTorch(staticItems, fxList, [p[0]+right[0]*s*(pathW*0.34), p[1], p[2]+right[2]*s*(pathW*0.34)], false);
          } else if (rm === "hall" && frac !== 0.50) {
            pushStatic(staticItems, null, { model:'quad', pos:[p[0]+right[0]*s*(pathW*0.485), p[1]+4.2, p[2]+right[2]*s*(pathW*0.485)], rot:[0,nextYaw+(s===1?90:-90),0], scale:[2.0,3.8,1], tex:'tapestry' });
          } else if (rm === "barn" && frac === 0.22) {
            pushStatic(staticItems, null, { model:'cube', pos:[p[0]+right[0]*s*(pathW*0.36), p[1]+0.65, p[2]+right[2]*s*(pathW*0.36)], rot:[0,nextYaw+15,0], scale:1.3, tex:'crate' });
          } else if (rm === "cave") {
            pushStatic(staticItems, null, { model:lodModel('cone'), pos:[p[0]+right[0]*s*3.0, p[1]+7.6, p[2]+right[2]*s*3.0], rot:[180,0,0], scale:[1.0,2.4,1.0], tex:'rock', color:cRGBA(120,114,110) });
          } else if (rm === "crystal" && frac === 0.50) {
            addCrystalOrTorch(staticItems, fxList, [p[0]+right[0]*s*3.8, p[1], p[2]+right[2]*s*3.8], true);
          }
        }
        if (frac === 0.50) {
          if (rm === "hall" || rm === "dining") {
            const winP = [p[0]+right[0]*(pathW*0.48), p[1]+4.9, p[2]+right[2]*(pathW*0.48)];
            pushStatic(staticItems, null, { model:'quad', pos:winP, rot:[0,nextYaw+90,0], scale:[3.2,4.8,1], tex:'stained' });
            addSunbeam(fxList, winP, [p[0]+right[0]*0.6, p[1], p[2]+right[2]*0.6], nextYaw, cRGBA(255,240,200), 3.2);
          } else if (rm === "barn") {
            const winP = [p[0]+right[0]*(pathW*0.47), p[1]+4.6, p[2]+right[2]*(pathW*0.47)];
            pushStatic(staticItems, null, { model:'quad', pos:winP, rot:[0,nextYaw+90,0], scale:[2.4,1.8,1], color:cRGBA(255,250,232) });
            addSunbeam(fxList, winP, [p[0]+right[0]*0.4, p[1], p[2]+right[2]*0.4], nextYaw, cRGBA(255,246,215), 2.8);
          }
          if (rm === "dining") {
            addDining(staticItems, fxList, [p[0]-right[0]*4.2, p[1], p[2]-right[2]*4.2], nextYaw);
            addDining(staticItems, fxList, [p[0]+right[0]*4.2, p[1], p[2]+right[2]*4.2], nextYaw);
            pushStatic(staticItems, null, { model:'cube', pos:[p[0],p[1]+7.6,p[2]], scale:[0.1,1.6,0.1], color:cRGBA(65,58,50) });
            pushStatic(staticItems, null, { model:lodModel('sphere'), pos:[p[0],p[1]+6.7,p[2]], scale:[2.4,0.52,2.4], color:cRGBA(255,224,138) });
            if (q.fx_glow) {
              fxList.push(new Node3D({ model:'quad', billboard:true, additive:true, pos:[p[0],p[1]+6.7,p[2]], scale:[5.2,5.2,1], tex:'soft_glow', color:cRGBA(255,220,145,125), useFog:false, shade:false }));
            }
          }
        }
      }
    } else {
      if (stageNum !== 3) {
        pushStatic(staticItems, null, { model:'quad', pos:[segMid[0],-1.8,segMid[2]], rot:[90,nextYaw,0], scale:[120,segLen+18,1], tex:th.ground_tex, uvScale:[10,4], color:groundTint });
      } else {
        pushStatic(staticItems, null, { model:'quad', pos:[segMid[0],-24,segMid[2]], rot:[90,nextYaw,0], scale:[140,segLen+24,1], color:cRGBA(210,232,248,235) });
      }
      for (const s of [-1, 1]) {
        const eo = s * (pathW*0.5 + 0.18);
        pushStatic(staticItems, null, { model:'cube', pos:[segMid[0]+right[0]*eo, segMid[1]+0.18, segMid[2]+right[2]*eo], rot:[slopePitch,nextYaw,0], scale:[0.45,0.48,segLen3d+0.4], tex:'brick', color:cRGBA(195,190,182) });
      }
      const fracs = (q.props === "full" || q.props === "mid") ? [0.18, 0.46, 0.76] : [0.46];
      for (const frac of fracs) {
        const p = lerpSeg(frac);
        for (const s of [-1, 1]) {
          if (rm === "bridge") {
            pushStatic(staticItems, null, { model:'cube', pos:[p[0]+right[0]*s*4.7, p[1]+0.85, p[2]+right[2]*s*4.7], rot:[0,nextYaw,0], scale:[0.65,1.7,3.8], tex:'brick', color:cRGBA(222,218,210) });
            if (frac === 0.46 && q.props !== "min") {
              pushStatic(staticItems, null, { model:'cube', pos:[p[0]+right[0]*s*22, p[1]-4, p[2]+right[2]*s*22], rot:[0,nextYaw,0], scale:[14,38,16], tex:'rock', color:cRGBA(192,182,168) });
              pushStatic(staticItems, null, { model:'quad', pos:[p[0]+right[0]*s*4.7, p[1]+3.2, p[2]+right[2]*s*4.7], rot:[0,nextYaw+90,0], scale:[1.1,2.2,1], tex:'tapestry' });
            }
          } else {
            if (q.props !== "min" || (idx % 2 === 0)) {
              const td = randRange(9.5, 16.5);
              addTree(staticItems, [p[0]+right[0]*s*td, p[1], p[2]+right[2]*s*td], randRange(1.0, 1.55));
            }
            if (frac === 0.18 && s === -1) addLamp(staticItems, fxList, [p[0]-right[0]*5.2, p[1], p[2]-right[2]*5.2], nextYaw);
            if (rm === "village" && frac === 0.46) addHouse(staticItems, doorNodes, [p[0]+right[0]*s*9.8, p[1], p[2]+right[2]*s*9.8], nextYaw+(s===1?90:-90));
            else if (rm === "forest" && frac === 0.46 && (q.props === "full" || q.props === "mid")) {
              pushStatic(staticItems, null, { model:lodModel('icosphere'), pos:[p[0]+right[0]*s*6.8, -1.55, p[2]+right[2]*s*6.8], scale:[1.1,0.65,1.0], tex:'rock', color:cRGBA(155,160,150) });
            }
            if (frac === 0.76 && s === 1 && (q.props === "full" || q.props === "mid")) {
              pushStatic(staticItems, null, { model:'cube', pos:[p[0]+right[0]*5.3, p[1]+0.55, p[2]+right[2]*5.3], rot:[0,nextYaw+22,0], scale:1.1, tex:'crate' });
            }
          }
        }
        if (rm === "forest" && frac === 0.46) {
          addSunbeam(fxList, [p[0]+right[0]*4.5, p[1]+10.5, p[2]+right[2]*4.5], [p[0]-right[0]*0.5, p[1], p[2]-right[2]*0.5], nextYaw, cRGBA(255,250,232), 3.8);
        }
      }
    }

    const camStop = [segStart[0]+fwd[0]*4.5, segStart[1]+2.25, segStart[2]+fwd[2]*4.5];
    const camMid  = [segStart[0]+fwd[0]*1.5, segStart[1]+2.25, segStart[2]+fwd[2]*1.5];
    const initPitch = isBossWave ? -15.0 : clamp(slopePitch, -14, 14);
    const camRot = [initPitch, nextYaw, 0];

    if (idx === 2 || idx === 6 || idx === 9 || idx === 11) {
      const hpB = lerpSeg(0.46);
      const hs = (idx % 2) ? 3.1 : -3.1;
      healPositions.push([hpB[0]+right[0]*hs, hpB[1]+0.05, hpB[2]+right[2]*hs]);
    }

    const spawns = [];
    if (!isBossWave) {
      for (const [kind, emerge, sideOff, yOff, distAhead, delay] of th.waves[idx]) {
        const u = clamp(distAhead / segLen, 0.25, 0.90);
        const bp = lerpSeg(u);
        const spPos = [bp[0]+right[0]*sideOff, bp[1]+yOff, bp[2]+right[2]*sideOff];
        if (yOff >= 2.5 && kind !== "gargoyle" && kind !== "wasp") {
          pushStatic(staticItems, null, { model:'cube', pos:[spPos[0], spPos[1]-yOff*0.5, spPos[2]], rot:[0,nextYaw,0], scale:[4.6,yOff,4.6], tex:th.wall_tex, color:cRGBA(210,202,192) });
        }
        let doorId = null;
        let emDir = [-fwd[0], 0, -fwd[2]];
        if (emerge === "door") {
          doorCounter++;
          doorId = `s${stageNum}_d${doorCounter}`;
          if (Math.abs(sideOff) > 2.0) {
            const ss = sideOff > 0 ? 1 : -1;
            addHouse(staticItems, doorNodes, [spPos[0]+right[0]*ss*3.4, spPos[1], spPos[2]+right[2]*ss*3.4], nextYaw+(ss>0?90:-90), doorId);
            emDir = [-right[0]*ss, 0, -right[2]*ss];
          } else {
            addHouse(staticItems, doorNodes, [spPos[0]+fwd[0]*3.0, spPos[1], spPos[2]+fwd[2]*3.0], nextYaw, doorId);
          }
        } else if (emerge === "peek") {
          const ss = sideOff >= 0 ? 1 : -1;
          emDir = [-right[0]*ss, 0, -right[2]*ss];
          pushStatic(staticItems, null, { model:'cube', pos:[spPos[0]+right[0]*ss*1.9, spPos[1]+2.2, spPos[2]+right[2]*ss*1.9], rot:[0,nextYaw,0], scale:[1.5,4.4,1.5], tex:'brick', color:cRGBA(205,198,190) });
        }
        spawns.push({
          kind, pos: spPos, emerge, dir: emDir, door: doorId, delay,
          descend: (yOff > 0.5 && !GAME_DATA.ENEMY_META[kind].ranged && kind !== "gargoyle" && kind !== "wasp")
        });
      }
    } else {
      const ac = [segStart[0]+fwd[0]*22.0, segStart[1], segStart[2]+fwd[2]*22.0];
      pushStatic(staticItems, null, { model:'cube', pos:[ac[0],ac[1]-0.34,ac[2]], scale:[32,0.72,32], tex:'stone', uvScale:[6,6], color:pathTint });
      for (let ang = 0; ang < 360; ang += 45) {
        const ar = ang * Math.PI / 180;
        const pp = [ac[0]+Math.cos(ar)*14.0, ac[1], ac[2]+Math.sin(ar)*14.0];
        if (dist2d(pp[0], pp[2], camStop[0], camStop[2]) > 7.5) {
          pushStatic(staticItems, null, { model:'cube', pos:[pp[0],pp[1]+3.8,pp[2]], scale:[1.5,7.6,1.5], tex:'brick', color:cRGBA(215,208,198) });
          addCrystalOrTorch(staticItems, fxList, pp, stageNum === 4);
        }
      }
      spawns.push({
        kind: "boss", pos: ac, emerge: stageNum === 3 ? "swoop" : "climb",
        dir: [-fwd[0], 0, -fwd[2]], door: null, delay: 0.4, descend: false,
        bossStyle: stageNum, customName: GAME_DATA.STAGE_BOSS_DATA[stageNum].name
      });
      spawns.push({
        kind: stageNum === 3 ? "gargoyle" : "ghost",
        pos: [ac[0]-right[0]*5.2, ac[1]+(stageNum===3?3.0:0.6), ac[2]-right[2]*5.2],
        emerge: stageNum === 3 ? "swoop" : "normal", dir: right.slice(), door: null, delay: 10.0, descend: false
      });
    }

    segBatches.push(renderer.createStaticBatch(staticItems));
    segFxLists.push(fxList);
    segDoors.push(doorNodes);
    encounters.push({ path: [[camMid, camRot], [camStop, camRot]], spawns, isBoss: isBossWave });

    curPos = segEnd;
    curYaw = nextYaw;
  }

  const globalBgBatch = globalBgItems.length ? renderer.createStaticBatch(globalBgItems) : null;

  return {
    stageNum, hazeCol, skyTex: th.sky,
    globalBgBatch, globalFxNodes, segBatches, segFxLists, segDoors,
    doors, healPositions, encounters, motes,
    destroy(r) {
      r.destroyStaticBatch(this.globalBgBatch);
      for (const b of this.segBatches) r.destroyStaticBatch(b);
    }
  };
}


// =====================================================================
// 7. 一人称ライフル ＆ ゲームディレクター（v8完全準拠）
// =====================================================================
class PlayerRifle {
  constructor() {
    this.basePos = [0.46, -0.37, 0.86];
    this.recoilT = 0;
    this.root = new Node3D({ pos: this.basePos.slice(), rot: [-3, -7, 0], useFog: false });
    this.root.addChild({ model:'cube', scale:[0.11, 0.14, 0.70], color:cRGBA(52,56,64), useFog:false });
    this.root.addChild({ model:'cube', pos:[0, 0.04, 0.40], scale:[0.045, 0.045, 0.44], color:cRGBA(82,88,98), useFog:false });
    this.root.addChild({ model:'cube', pos:[0, 0.11, -0.05], scale:[0.06, 0.06, 0.26], color:cRGBA(34,38,44), useFog:false });
  }
  kick() { this.recoilT = 0.065; }
  step(dt) {
    if (this.recoilT > 0) {
      this.recoilT = Math.max(0, this.recoilT - dt);
      const p = this.recoilT / 0.065;
      this.root.pos[0] = this.basePos[0];
      this.root.pos[1] = this.basePos[1] + 0.016 * p;
      this.root.pos[2] = this.basePos[2] - 0.06 * p;
    } else {
      this.root.pos[0] = this.basePos[0];
      this.root.pos[1] = this.basePos[1];
      this.root.pos[2] = this.basePos[2];
    }
  }
  collectDrawables(renderer, outO, outT, outA) {
    const camMat = M4.fromTRS(
      renderer.camPos[0], renderer.camPos[1], renderer.camPos[2],
      renderer.camRot[0], renderer.camRot[1], renderer.camRot[2],
      1, 1, 1
    );
    this.root.collectDrawables(camMat, renderer, outO, outT, outA);
  }
}

class GameDirector {
  constructor() {
    this.canvas = document.getElementById('glCanvas');
    this.renderer = new WebGLRenderer(this.canvas);
    this.rifle = new PlayerRifle();

    const cfg = loadUserSettings();
    this.graphicsLevel = cfg.graphics_level;
    this.difficulty = cfg.difficulty;
    this.startStage = cfg.start_stage;
    this.sfxModeIdx = cfg.sfx_mode_idx;
    AUDIO.setMuted(cfg.bgm_muted);

    CURRENT_QUALITY = this.graphicsLevel;
    this.stageNum = this.startStage;
    this.state = "TITLE"; // TITLE, MOVING, COMBAT, STAGE_CLEAR, ALL_CLEAR, GAMEOVER
    this.paused = false;
    this.selRow = 0;

    this.stage = null;
    this.encIdx = 0;
    this.pathQueue = [];
    this.moveFromPos = [0, 2.2, 0];
    this.moveToPos = [0, 2.2, 0];
    this.moveFromRot = [0, 0, 0];
    this.moveToRot = [0, 0, 0];
    this.moveT = 0;
    this.moveDur = 1.5;

    this.pendingSpawns = [];
    this.encElapsed = 0;
    this.enemies = [];
    this.projectiles = [];
    this.heals = [];
    this.locked = null;

    this.hp = 5;
    this.score = 0;
    this.stageStartScore = 0;
    this.stageScore = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.stageMaxCombo = 0;
    this.stageOk = 0;
    this.stageNg = 0;
    this.stageKills = 0;
    this.stageDmg = 0;
    this.stagePlaySec = 0;
    this.sessionOk = 0;
    this.sessionNg = 0;
    this.sessionKills = 0;

    this.dmgVignetteT = 0;
    this.toastTimer = 0;
    this.fpsAcc = 0;
    this.fpsFrames = 0;
    this.smoothDt = 1 / 60;
    this.walkPhase = 0;
    this.lastTime = performance.now();

    // DOM refs
    this.dmgBorder = document.getElementById('dmgBorder');
    this.hpTxt = document.getElementById('hpTxt');
    this.scoreTxt = document.getElementById('scoreTxt');
    this.progTxt = document.getElementById('progTxt');
    this.fpsTxt = document.getElementById('fpsTxt');
    this.toastEl = document.getElementById('toast');
    this.titleOverlay = document.getElementById('titleOverlay');
    this.pauseOverlay = document.getElementById('pauseOverlay');
    this.resultOverlay = document.getElementById('resultOverlay');
    this.startBtn = document.getElementById('startBtn');
    this.fsBtn = document.getElementById('fsBtn');

    this._buildTitleSliders();
    this._bindEvents();

    this._applyQualityRuntime(false);
    this.loadStageVisualOnly(this.startStage);
    this.showTitle();

    requestAnimationFrame((t) => this._loop(t));
  }

  _buildTitleSliders() {
    const list = document.getElementById('sliderList');
    const defs = [
      { key: "difficulty", label: "むずかしさ",     min: 1, max: 5, fmt: v => GAME_DATA.DIFFICULTY_PARAMS[v].label },
      { key: "stage",      label: "ステージ",       min: 1, max: 5, fmt: v => `STAGE ${v}` },
      { key: "graphics",   label: "かるさ・がしつ", min: 1, max: 5, fmt: v => GAME_DATA.QUALITY_PRESETS[v].label },
      { key: "sfx",        label: "うつ おと",      min: 0, max: 3, fmt: v => GAME_DATA.SFX_MODES[v][1] },
      { key: "bgm",        label: "おんがく(BGM)",  min: 0, max: 1, fmt: v => v === 1 ? "ON（あり）" : "OFF（なし）" },
    ];
    this.sliderDefs = defs;
    this.sliderEls = [];
    list.innerHTML = "";
    defs.forEach((d, idx) => {
      const row = document.createElement('div');
      row.className = 'slider-row' + (idx === 0 ? ' active' : '');
      row.innerHTML = `
        <div class="sl-label">${d.label}</div>
        <button type="button" class="sl-step-btn" data-dir="-1">◀</button>
        <div class="sl-track-wrap">
          <input type="range" class="sl-range" min="${d.min}" max="${d.max}" step="1" value="${d.min}">
        </div>
        <button type="button" class="sl-step-btn" data-dir="1">▶</button>
        <div class="sl-val"></div>
      `;
      const input = row.querySelector('.sl-range');
      const valEl = row.querySelector('.sl-val');
      const btnM = row.querySelector('[data-dir="-1"]');
      const btnP = row.querySelector('[data-dir="1"]');

      row.addEventListener('pointerenter', () => { this.selRow = idx; this._syncTitleSliders(); });
      btnM.addEventListener('click', () => {
        AUDIO.unlockAndResumeBgm();
        this.selRow = idx;
        this._setSliderSetting(d.key, parseInt(input.value, 10) - 1, false);
      });
      btnP.addEventListener('click', () => {
        AUDIO.unlockAndResumeBgm();
        this.selRow = idx;
        this._setSliderSetting(d.key, parseInt(input.value, 10) + 1, false);
      });
      input.addEventListener('input', () => {
        AUDIO.unlockAndResumeBgm();
        this.selRow = idx;
        this._setSliderSetting(d.key, parseInt(input.value, 10), d.key === "graphics");
      });
      input.addEventListener('change', () => {
        if (d.key === "graphics") {
          this._applyQualityRuntime("full");
          this._syncTitleSliders();
          this.showToast(`画質・かるさ: ${GAME_DATA.QUALITY_PRESETS[this.graphicsLevel].label}（ほぞんしたよ！）`, "#c3f5d2", 2.0);
        }
      });

      list.appendChild(row);
      this.sliderEls.push({ key: d.key, row, input, valEl, fmt: d.fmt, min: d.min, max: d.max });
    });
  }

  _bindEvents() {
    window.addEventListener('resize', () => this.renderer.resize());
    document.addEventListener('fullscreenchange', () => {
      this._syncTitleSliders();
      if (this.paused) this._refreshPauseUI();
      setTimeout(() => this.renderer.resize(), 60);
    });

    // Unlock Web Audio on first user interaction anywhere
    const unlock = () => AUDIO.unlockAndResumeBgm();
    window.addEventListener('pointerdown', unlock, { passive: true });

    this.startBtn.addEventListener('click', () => {
      AUDIO.unlockAndResumeBgm();
      this.beginStage(this.startStage, true);
    });
    this.fsBtn.addEventListener('click', () => {
      AUDIO.unlockAndResumeBgm();
      this.toggleFullscreen();
    });
    document.getElementById('hudPauseBtn').addEventListener('click', () => {
      AUDIO.unlockAndResumeBgm();
      if (this.state === "MOVING" || this.state === "COMBAT") this.togglePause();
    });

    document.querySelectorAll('#pauseOverlay .pause-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        AUDIO.unlockAndResumeBgm();
        const act = btn.dataset.act;
        if (act === "resume") this.togglePause();
        else if (act === "graphics") this.cycleGraphicsLevel();
        else if (act === "difficulty") this.cycleDifficulty();
        else if (act === "sfx") this.cycleSfxMode();
        else if (act === "bgm") { AUDIO.setMuted(!AUDIO.muted); this._saveSettings(); this._refreshPauseUI(); }
        else if (act === "fullscreen") this.toggleFullscreen();
        else if (act === "retry") { this.hp = 5; this.beginStage(this.stageNum, false); }
        else if (act === "title") { this.loadStageVisualOnly(this.startStage); this.showTitle(); }
      });
    });

    window.addEventListener('keydown', (e) => {
      AUDIO.unlockAndResumeBgm();
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      if (e.repeat && (this.state === "MOVING" || this.state === "COMBAT")) return;

      // Prevent browser scrolling / focus traps
      if (["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Tab","F11"].includes(e.code)) {
        e.preventDefault();
      }
      if (e.code === "F11") { this.toggleFullscreen(); return; }

      const activeEl = document.activeElement;
      if (activeEl && activeEl.tagName === "INPUT" && (e.code === "Space" || e.code === "Enter")) {
        activeEl.blur();
      }
      this._handleKey(e);
    });
  }

  _extractTypingChar(e) {
    // Chromebook等で誤って日本語IMEがONになっていても物理キー(e.code)から確実にA-Z / - を取得！
    if (e.code && e.code.startsWith("Key") && e.code.length === 4) {
      return e.code[3].toUpperCase();
    }
    if (e.code === "Minus" || e.key === "-") return "-";
    if (e.key && e.key.length === 1 && /^[a-zA-Z-]$/.test(e.key)) {
      return e.key.toUpperCase();
    }
    return null;
  }

  _saveSettings() {
    saveUserSettings({
      graphics_level: this.graphicsLevel,
      difficulty: this.difficulty,
      start_stage: this.startStage,
      sfx_mode_idx: this.sfxModeIdx,
      bgm_muted: AUDIO.muted,
    });
  }

  _syncTitleSliders() {
    const vals = {
      difficulty: this.difficulty,
      stage: this.startStage,
      graphics: this.graphicsLevel,
      sfx: this.sfxModeIdx,
      bgm: AUDIO.muted ? 0 : 1,
    };
    this.sliderEls.forEach((s, i) => {
      const v = vals[s.key];
      s.input.value = String(v);
      const pct = ((v - s.min) / Math.max(1, s.max - s.min)) * 100;
      s.input.style.background = `linear-gradient(90deg, #58d2f5 0%, #58d2f5 ${pct}%, #2e3a4c ${pct}%, #2e3a4c 100%)`;
      s.valEl.textContent = s.fmt(v);
      s.row.classList.toggle('active', i === this.selRow);
    });
    this.startBtn.textContent = `▶  STAGE ${this.startStage} を あそぶ！`;
    this.fsBtn.textContent = document.fullscreenElement ? "まどひょうじ [F11]" : "ぜんがめん [F11]";
  }

  _setSliderSetting(keyName, newVal, deferGfx = false) {
    if (keyName === "difficulty") {
      const nv = clamp(newVal, 1, 5);
      if (nv === this.difficulty) return;
      this.difficulty = nv;
      this._saveSettings();
      for (const e of this.enemies) if (e.alive) e.applyDifficulty(this.difficulty);
      const ht = this._healTierForDiff();
      const used = this._getActiveFirsts();
      for (const h of this.heals) {
        if (h.alive && h !== this.locked) {
          const pair = DECK.draw(ht, used);
          for (const o of tokenizeKana(pair[1])[0]) used.add(o[0]);
          h.setWord(pair);
        }
      }
      AUDIO.playSfx('heal');
    } else if (keyName === "stage") {
      const nv = clamp(newVal, 1, 5);
      if (nv === this.startStage) return;
      this.startStage = nv;
      this._saveSettings();
      AUDIO.playSfx('heal');
      if (this.state === "TITLE") this.loadStageVisualOnly(this.startStage);
    } else if (keyName === "graphics") {
      const nv = clamp(newVal, 1, 5);
      if (nv === this.graphicsLevel) return;
      this.graphicsLevel = nv;
      this._saveSettings();
      AUDIO.playSfx('heal');
      if (!deferGfx) {
        const mode = this.state === "TITLE" ? "full" : ((this.state === "MOVING" || this.state === "COMBAT") ? "inplace" : false);
        this._applyQualityRuntime(mode);
      }
    } else if (keyName === "sfx") {
      const nv = clamp(newVal, 0, GAME_DATA.SFX_MODES.length - 1);
      if (nv === this.sfxModeIdx) return;
      this.sfxModeIdx = nv;
      this._saveSettings();
      AUDIO.playSfx('type', GAME_DATA.SFX_MODES[this.sfxModeIdx][0], 0);
    } else if (keyName === "bgm") {
      const wantMute = (newVal === 0);
      if (wantMute === AUDIO.muted) return;
      AUDIO.setMuted(wantMute);
      this._saveSettings();
    }
    if (this.state === "TITLE") this._syncTitleSliders();
    else if (this.paused) this._refreshPauseUI();
  }

  showToast(msg, color = "#ffe182", dur = 2.6) {
    this.toastEl.textContent = msg;
    this.toastEl.style.color = color;
    this.toastEl.style.display = 'block';
    this.toastTimer = dur;
  }

  clearStageObjects() {
    for (const e of this.enemies) e.cleanup();
    for (const p of this.projectiles) p.cleanup();
    for (const h of this.heals) h.cleanup();
    this.enemies.length = 0;
    this.projectiles.length = 0;
    this.heals.length = 0;
    this.pendingSpawns.length = 0;
    this.locked = null;
    FX.clear(this.renderer);
    if (this.stage) { this.stage.destroy(this.renderer); this.stage = null; }
  }

  _healTierForDiff() { return this.difficulty === 1 ? "alpha1" : "heal"; }

  _syncRendererToStage() {
    if (!this.stage) return;
    const q = GAME_DATA.QUALITY_PRESETS[this.graphicsLevel];
    const r = this.renderer;
    r.skyTexKey = this.stage.skyTex;
    r.skyEnabled = q.sky_dome;
    r.fogColor = this.stage.hazeCol;
    r.useFog = q.shader || q.fixed_fog;
    r.fogNear = q.shader ? 10.0 : 14.0;
    r.fogFar = q.shader ? 58.0 : q.far * 0.85;
    const bg = GAME_DATA.STAGE_SKY_BG[this.stage.stageNum] || [120, 175, 220, 255];
    r.clearColor = [bg[0]/255, bg[1]/255, bg[2]/255];
  }

  loadStageVisualOnly(num) {
    this.clearStageObjects();
    this.stageNum = num;
    this.encIdx = 0;
    this.stage = buildLongStageCourse(num, this.graphicsLevel, this.renderer);
    this._syncRendererToStage();
    const ht = this._healTierForDiff();
    const used = new Set();
    for (const hpPos of this.stage.healPositions) {
      const pair = DECK.draw(ht, used);
      for (const o of tokenizeKana(pair[1])[0]) used.add(o[0]);
      this.heals.push(new HealBox(hpPos, pair));
    }
    const [sp, sr] = this.stage.encounters[0].path[0];
    this.renderer.camPos = sp.slice();
    this.renderer.camRot = sr.slice();
  }

  _rebuildStageBackgroundInPlace() {
    const savedPos = this.renderer.camPos.slice();
    const savedRot = this.renderer.camRot.slice();
    const savedEnc = this.encIdx;
    if (this.stage) { this.stage.destroy(this.renderer); this.stage = null; }
    this.stage = buildLongStageCourse(this.stageNum, this.graphicsLevel, this.renderer);
    this.encIdx = savedEnc;
    for (const e of this.enemies) e.doorNode = null;
    this._syncRendererToStage();
    this.renderer.camPos = savedPos;
    this.renderer.camRot = savedRot;
  }

  _applyQualityRuntime(rebuildMode = false) {
    CURRENT_QUALITY = this.graphicsLevel;
    const q = GAME_DATA.QUALITY_PRESETS[this.graphicsLevel];
    const scaleMap = { 5: 1.0, 4: 0.90, 3: 0.78, 2: 0.65, 1: 0.52 };
    this.renderer.resScale = scaleMap[this.graphicsLevel] || 0.78;
    this.renderer.clipFar = q.far;
    this.renderer.resize();
    this.renderer.applyTextureFilterQuality(q.mipmap);
    FX.smokeEnabled = q.smoke;
    FX.debrisEnabled = q.debris;
    if (!q.smoke && !q.debris) FX.clear(this.renderer);

    if (rebuildMode === "full") this.loadStageVisualOnly(this.stageNum);
    else if (rebuildMode === "inplace") this._rebuildStageBackgroundInPlace();
    else this._syncRendererToStage();
  }

  cycleGraphicsLevel() {
    this.graphicsLevel = this.graphicsLevel <= 1 ? 5 : (this.graphicsLevel - 1);
    this._saveSettings();
    const qLabel = GAME_DATA.QUALITY_PRESETS[this.graphicsLevel].label;
    AUDIO.playSfx('heal');
    const mode = this.state === "TITLE" ? "full" : ((this.state === "MOVING" || this.state === "COMBAT") ? "inplace" : false);
    this._applyQualityRuntime(mode);
    if (this.paused) this._refreshPauseUI();
    else if (this.state === "TITLE") this._syncTitleSliders();
    this.showToast(`画質・かるさ: ${qLabel}（設定保存済）`, "#c3f5d2", 2.2);
  }

  cycleDifficulty() {
    this._setSliderSetting("difficulty", (this.difficulty % 5) + 1);
    if (this.state !== "TITLE" && !this.paused) {
      this.showToast(`難易度を変更: ${GAME_DATA.DIFFICULTY_PARAMS[this.difficulty].label}`, "#ffe68c", 1.8);
    }
  }

  cycleSfxMode() {
    this._setSliderSetting("sfx", (this.sfxModeIdx + 1) % GAME_DATA.SFX_MODES.length);
    if (this.state !== "TITLE" && !this.paused) {
      this.showToast(`効果音を変更: ${GAME_DATA.SFX_MODES[this.sfxModeIdx][1]}`, "#ffe68c", 1.8);
    }
  }

  toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.().catch(() => {});
    } else {
      document.exitFullscreen?.().catch(() => {});
    }
  }

  showTitle() {
    this.state = "TITLE";
    this.paused = false;
    this.titleOverlay.classList.remove('hidden');
    this.pauseOverlay.classList.add('hidden');
    this.resultOverlay.classList.add('hidden');
    this.toastEl.style.display = 'none';
    AUDIO.playBgm("title");
    this._syncTitleSliders();
    this.updateHUD();
  }

  beginStage(num, resetSession = false) {
    if (resetSession) {
      DECK.resetAll();
      this.hp = 5;
      this.score = 0;
      this.stageStartScore = 0;
      this.combo = 0;
      this.maxCombo = 0;
      this.sessionOk = 0;
      this.sessionNg = 0;
      this.sessionKills = 0;
    } else {
      this.stageStartScore = this.score;
    }
    this.paused = false;
    this.titleOverlay.classList.add('hidden');
    this.pauseOverlay.classList.add('hidden');
    this.resultOverlay.classList.add('hidden');
    this.stageScore = 0;
    this.stageMaxCombo = 0;
    this.stageOk = 0;
    this.stageNg = 0;
    this.stageKills = 0;
    this.stageDmg = 0;
    this.stagePlaySec = 0;
    this.encIdx = 0;
    this.loadStageVisualOnly(num);
    AUDIO.playBgm(GAME_DATA.STAGE_THEMES[num].bgm);
    this.showToast(GAME_DATA.STAGE_THEMES[num].title, "#ffe88c", 3.2);
    this.updateHUD();
    this.startEncounterMove();
  }

  startEncounterMove() {
    if (this.encIdx >= this.stage.encounters.length) {
      this.showStageClear();
      return;
    }
    const enc = this.stage.encounters[this.encIdx];
    this.state = "MOVING";
    this.pathQueue = enc.path.map(([p, r]) => [p.slice(), r.slice()]);
    this._advanceNextWaypoint();
    this.updateHUD();
    if (enc.isBoss) {
      AUDIO.playSfx('boss_alert');
      AUDIO.playBgm("boss");
      this.showToast(`WARNING : ${GAME_DATA.STAGE_BOSS_DATA[this.stageNum].name} 出現！`, "#ff735f", 3.0);
    }
  }

  _advanceNextWaypoint() {
    if (!this.pathQueue.length) { this.beginCombat(); return; }
    const [tp, tr] = this.pathQueue.shift();
    this.moveFromPos = this.renderer.camPos.slice();
    this.moveToPos = tp.slice();
    this.moveFromRot = this.renderer.camRot.slice();
    this.moveToRot = tr.slice();
    const d = dist3d(this.moveFromPos[0],this.moveFromPos[1],this.moveFromPos[2], tp[0],tp[1],tp[2]);
    this.moveDur = Math.max(0.22, d / 13.5);
    this.moveT = 0;
  }

  beginCombat() {
    this.state = "COMBAT";
    this.encElapsed = 0;
    this.pendingSpawns = this.stage.encounters[this.encIdx].spawns.map(s => ({ ...s, pos: s.pos.slice(), dir: s.dir.slice() }));
  }

  _getActiveFirsts() {
    const used = new Set();
    for (const obj of [...this.enemies, ...this.projectiles, ...this.heals]) {
      if (obj.alive) for (const ch of obj.word.validFirsts()) used.add(ch);
    }
    return used;
  }

  _pickWordsForEnemy(kind) {
    const diff = this.difficulty;
    if (kind === "boss") {
      if (diff === 1) {
        const avoid = this._getActiveFirsts();
        const out = [];
        for (let i = 0; i < GAME_DATA.ENEMY_META.boss.words; i++) {
          const pair = DECK.draw("alpha1", avoid);
          for (const o of tokenizeKana(pair[1])[0]) avoid.add(o[0]);
          out.push(pair);
        }
        return out;
      }
      if (diff === 4) return GAME_DATA.STAGE_BOSS_DATA[this.stageNum].words.slice();
      return GAME_DATA.BOSS_WORDS_BY_DIFF[diff][this.stageNum].slice();
    }

    const cnt = GAME_DATA.ENEMY_META[kind].words;
    const avoid = this._getActiveFirsts();
    const chosen = [];
    const st = this.stageNum;
    const late = this.encIdx >= 6;

    for (let idx = 0; idx < cnt; idx++) {
      let tier = "t1";
      if (diff === 1) {
        tier = "alpha1";
      } else if (diff === 2) {
        tier = cnt >= 2 ? "t1" : ((st >= 4 && late) ? "t1" : "t0");
      } else if (diff === 3) {
        if (st <= 2) tier = ((cnt >= 2 && idx === 1) || (st === 2 && late)) ? "t2" : "t1";
        else if (st <= 4) tier = (cnt >= 2 && idx === 1 && st === 4) ? "t3" : "t2";
        else tier = ((cnt >= 2 && idx === 1) || late) ? "t3" : "t2";
      } else if (diff === 4) {
        if (st === 1) tier = ((cnt > 1 && idx === 1) || (late && Math.random() < 0.35)) ? "t2" : "t1";
        else if (st === 2) tier = (cnt > 1 && idx === 1) ? (late ? "t3" : "t2") : ((late || Math.random() < 0.65) ? "t2" : "t1");
        else if (st === 3) tier = ((cnt > 1 && idx === 1) || (late && Math.random() < 0.45)) ? "t3" : "t2";
        else if (st === 4) tier = (cnt > 1 && idx === 1) ? (late ? "t4" : "t3") : ((late || Math.random() < 0.60) ? "t3" : "t2");
        else tier = ((cnt > 1 && idx === 1) || (late && Math.random() < 0.40)) ? "t4" : "t3";
      } else {
        if (st <= 2) tier = ((cnt > 1 && idx === 1) || (st === 2 && late)) ? "t4" : "t3";
        else tier = ((cnt > 1 && idx === 1) || late || Math.random() < 0.55) ? "t4" : "t3";
      }
      const pair = DECK.draw(tier, avoid);
      for (const o of tokenizeKana(pair[1])[0]) avoid.add(o[0]);
      chosen.push(pair);
    }
    return chosen;
  }

  _spawnEnemy(sp) {
    const words = this._pickWordsForEnemy(sp.kind);
    const doorNode = sp.door ? this.stage.doors[sp.door] : null;
    this.enemies.push(new Enemy3D({
      kind: sp.kind,
      spawnPos: sp.pos,
      wordPairs: words,
      emergeMode: sp.emerge,
      emergeDir: sp.dir,
      doorNode,
      descendToPlayer: sp.descend,
      bossStyle: sp.bossStyle || this.stageNum,
      customName: sp.customName,
      difficulty: this.difficulty,
    }));
  }

  _autoFrameCamera(dt) {
    let focus = null;
    if (this.locked && this.locked.alive && !this.locked.isItem) {
      focus = this.locked;
    } else {
      const active = this.enemies.filter(e => e.targetable);
      if (active.length) {
        const cp = this.renderer.camPos;
        active.sort((a, b) => {
          const wa = a.state === "WINDUP" ? 1 : 0, wb = b.state === "WINDUP" ? 1 : 0;
          if (wa !== wb) return wb - wa;
          return dist2d(a.pos[0],a.pos[2], cp[0],cp[2]) - dist2d(b.pos[0],b.pos[2], cp[0],cp[2]);
        });
        focus = active[0];
      }
    }
    if (!focus) return;
    const aimY = focus.isBoss ? 5.4 : (focus.kind === "giant" ? 2.8 : (focus.isProjectile ? 0.0 : 1.5));
    const cp = this.renderer.camPos;
    const dx = focus.pos[0] - cp[0], dy = (focus.pos[1] + aimY) - cp[1], dz = focus.pos[2] - cp[2];
    const horiz = Math.hypot(dx, dz);
    if (horiz < 0.5) return;
    const wantYaw = Math.atan2(dx, dz) * 180 / Math.PI;
    const wantPitch = clamp(-Math.atan2(dy, horiz) * 180 / Math.PI, -38, 20);
    const a = 1 - Math.exp(-4.2 * dt);
    this.renderer.camRot[1] = lerpAngleDeg(this.renderer.camRot[1], wantYaw, a);
    this.renderer.camRot[0] = lerpAngleDeg(this.renderer.camRot[0], wantPitch, a);
  }

  togglePause() {
    if (this.state !== "MOVING" && this.state !== "COMBAT") return;
    this.paused = !this.paused;
    this.pauseOverlay.classList.toggle('hidden', !this.paused);
    if (this.paused) { AUDIO.pauseBgm(); this._refreshPauseUI(); }
    else AUDIO.unpauseBgm();
  }

  _refreshPauseUI() {
    document.getElementById('pGfxTxt').textContent = `軽量化・画質（${GAME_DATA.QUALITY_PRESETS[this.graphicsLevel].label}）`;
    document.getElementById('pDiffTxt').textContent = `難易度 切替（${GAME_DATA.DIFFICULTY_PARAMS[this.difficulty].label}）`;
    document.getElementById('pSfxTxt').textContent = `効果音 切替（${GAME_DATA.SFX_MODES[this.sfxModeIdx][1]}）`;
    document.getElementById('pBgmTxt').textContent = `BGM 切替（${AUDIO.muted ? "OFF" : "ON"}）`;
    document.getElementById('pFsTxt').textContent = `表示切替（${document.fullscreenElement ? "全画面" : "ウィンドウ"}）`;
    document.getElementById('pRetryTxt').textContent = `STAGE ${this.stageNum} やり直し`;
  }

  onPlayerDamaged() {
    AUDIO.playSfx('damage');
    FX.addShake(0.25, 1.1);
    this.dmgVignetteT = 0.36;
    this.hp -= 1;
    this.stageDmg += 1;
    this.combo = 0;
    this.updateHUD();
    if (this.hp <= 0) this.showGameOver();
  }

  _calcResultRank(cleared) {
    const totalTypes = this.stageOk + this.stageNg;
    const acc = (this.stageOk / Math.max(1, totalTypes)) * 100;
    const totalW = Math.max(1, this.stage ? this.stage.encounters.length : 13);
