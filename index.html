class PlayerRifle {
  constructor() {
    this.basePos = [0.46, -0.37, 0.86];
    this.recoilT = 0;
    this.flashT = 0;
    this.root = new Node3D({ pos: this.basePos.slice(), rot: [-3, -7, 0], useFog: false, castShadow: false, receiveShadow: false });
    // Main gunmetal receiver
    this.root.addChild({ model:'cube', scale:[0.105, 0.13, 0.68], tex:'metal', mat:MAT.STEEL, color:cRGBA(72,78,88), useFog:false, castShadow:false, receiveShadow:false });
    // Wooden/tactical cheek stock
    this.root.addChild({ model:'cube', pos:[0, -0.02, -0.44], scale:[0.09, 0.12, 0.34], tex:'wood', color:cRGBA(128,84,50), useFog:false, castShadow:false, receiveShadow:false });
    // Cylindrical fluted steel barrel + muzzle brake
    this.root.addChild({ model:'cylinder', pos:[0, 0.036, 0.44], rot:[90, 0, 0], scale:[0.044, 0.56, 0.044], tex:'metal', mat:MAT.STEEL, color:cRGBA(118,126,138), useFog:false, castShadow:false, receiveShadow:false });
    this.root.addChild({ model:'cylinder', pos:[0, 0.036, 0.72], rot:[90, 0, 0], scale:[0.058, 0.08, 0.058], tex:'metal', mat:MAT.STEEL, color:cRGBA(88,94,104), useFog:false, castShadow:false, receiveShadow:false });
    // Optical scope + luminous green tactical lens
    this.root.addChild({ model:'cylinder', pos:[0, 0.115, -0.04], rot:[90, 0, 0], scale:[0.062, 0.28, 0.062], tex:'metal', mat:MAT.STEEL, color:cRGBA(54,60,68), useFog:false, castShadow:false, receiveShadow:false });
    this.root.addChild({ model:'circle', pos:[0, 0.115, -0.185], scale:[0.048, 0.048, 1], mat:MAT.GLOW, color:cRGBA(95,245,185), useFog:false, castShadow:false, receiveShadow:false });
    // Subtle eye-friendly muzzle glow
    this.muzzleNode = this.root.addChild({
      model:'quad', billboard:true, additive:true, pos:[0, 0.036, 0.78],
      scale:[0.18, 0.18, 1], tex:'soft_glow', color:cRGBA(255,215,138,118),
      useFog:false, shade:false, castShadow:false, enabled:false
    });
  }
  kick(renderer) {
    this.recoilT = 0.078;
    this.flashT = 0.038;
    this.muzzleNode.enabled = true;
    const sc = 0.15 + Math.random() * 0.06;
    this.muzzleNode.scale = [sc, sc, 1];
    if (renderer) {
      const m = this.getMuzzleWorldPos(renderer);
      FX.triggerMuzzleLight(m, [0.46, 0.35, 0.20], 0.055);
      const cp = renderer.camPos, r = renderer.camRight, u = renderer.camUp, f = renderer.camFwd;
      const ejectP = [
        cp[0] + r[0]*0.46 - u[0]*0.30 + f[0]*0.92,
        cp[1] + r[1]*0.46 - u[1]*0.30 + f[1]*0.92,
        cp[2] + r[2]*0.46 - u[2]*0.30 + f[2]*0.92,
      ];
      FX.spawnShellCasing(ejectP, r, u, f);
    }
  }
  getMuzzleWorldPos(renderer) {
    const cp = renderer.camPos, r = renderer.camRight, u = renderer.camUp, f = renderer.camFwd;
    return [
      cp[0] + r[0]*0.34 - u[0]*0.26 + f[0]*1.55,
      cp[1] + r[1]*0.34 - u[1]*0.26 + f[1]*1.55,
      cp[2] + r[2]*0.34 - u[2]*0.26 + f[2]*1.55,
    ];
  }
  step(dt, nowSec = 0, isMoving = false) {
    const swayX = Math.sin(nowSec * (isMoving ? 6.2 : 1.7)) * (isMoving ? 0.022 : 0.006);
    const swayY = Math.abs(Math.cos(nowSec * (isMoving ? 6.2 : 1.7))) * (isMoving ? -0.018 : -0.004);
    if (this.recoilT > 0) {
      this.recoilT = Math.max(0, this.recoilT - dt);
      const p = this.recoilT / 0.078;
      this.root.pos[0] = this.basePos[0] + swayX;
      this.root.pos[1] = this.basePos[1] + swayY + 0.018 * p;
      this.root.pos[2] = this.basePos[2] - 0.068 * p;
      this.root.rot[0] = -3 - 5.5 * p;
      this.root.rot[2] = -2.2 * p;
    } else {
      this.root.pos[0] = this.basePos[0] + swayX;
      this.root.pos[1] = this.basePos[1] + swayY;
      this.root.pos[2] = this.basePos[2];
      this.root.rot[0] = -3 + (isMoving ? -1.8 : 0);
      this.root.rot[2] = swayX * -45;
    }
    if (this.flashT > 0) {
      this.flashT = Math.max(0, this.flashT - dt);
      if (this.flashT <= 0) this.muzzleNode.enabled = false;
    }
  }
  collectDrawables(renderer, outO, outT, outA) {
    const camMat = M4.fromTRS(
      renderer.camPos[0], renderer.camPos[1], renderer.camPos[2],
      renderer.camRot[0], renderer.camRot[1], renderer.camRot[2],
      1, 1, 1
    );
    this.root.collectDrawables(camMat, renderer, outO, outT, outA);
  }
}

class GameDirector {
  constructor() {
    this.canvas = document.getElementById('glCanvas');
    this.renderer = new WebGLRenderer(this.canvas);
    this.rifle = new PlayerRifle();

    const cfg = loadUserSettings();
    this.graphicsLevel = cfg.graphics_level;
    this.difficulty = cfg.difficulty;
    this.startStage = cfg.start_stage;
    this.sfxModeIdx = cfg.sfx_mode_idx;
    AUDIO.setMuted(cfg.bgm_muted);

    CURRENT_QUALITY = this.graphicsLevel;
    this.stageNum = this.startStage;
    this.state = "TITLE"; // TITLE, MOVING, COMBAT, STAGE_CLEAR, ALL_CLEAR, GAMEOVER
    this.paused = false;
    this.selRow = 0;

    this.stage = null;
    this.encIdx = 0;
    this.pathQueue = [];
    this.moveFromPos = [0, 2.2, 0];
    this.moveToPos = [0, 2.2, 0];
    this.moveFromRot = [0, 0, 0];
    this.moveToRot = [0, 0, 0];
    this.moveT = 0;
    this.moveDur = 1.5;

    this.pendingSpawns = [];
    this.encElapsed = 0;
    this.enemies = [];
    this.projectiles = [];
    this.heals = [];
    this.locked = null;

    this.hp = 5;
    this.score = 0;
    this.stageStartScore = 0;
    this.stageScore = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.stageMaxCombo = 0;
    this.stageOk = 0;
    this.stageNg = 0;
    this.stageKills = 0;
    this.stageDmg = 0;
    this.stagePlaySec = 0;
    this.sessionOk = 0;
    this.sessionNg = 0;
    this.sessionKills = 0;

    this.dmgVignetteT = 0;
    this.toastTimer = 0;
    this.fpsAcc = 0;
    this.fpsFrames = 0;
    this.smoothDt = 1 / 60;
    this.walkPhase = 0;
    this.lastTime = performance.now();

    // DOM refs
    this.dmgBorder = document.getElementById('dmgBorder');
    this.hpTxt = document.getElementById('hpTxt');
    this.scoreTxt = document.getElementById('scoreTxt');
    this.progTxt = document.getElementById('progTxt');
    this.fpsTxt = document.getElementById('fpsTxt');
    this.toastEl = document.getElementById('toast');
    this.titleOverlay = document.getElementById('titleOverlay');
    this.pauseOverlay = document.getElementById('pauseOverlay');
    this.resultOverlay = document.getElementById('resultOverlay');
    this.startBtn = document.getElementById('startBtn');
    this.fsBtn = document.getElementById('fsBtn');

    this._buildTitleSliders();
    this._bindEvents();

    this._applyQualityRuntime(false);
    this.loadStageVisualOnly(this.startStage);
    this.showTitle();

    requestAnimationFrame((t) => this._loop(t));
  }

  _buildTitleSliders() {
    const list = document.getElementById('sliderList');
    const defs = [
      { key: "difficulty", label: "むずかしさ",     min: 1, max: 5, fmt: v => GAME_DATA.DIFFICULTY_PARAMS[v].label },
      { key: "stage",      label: "ステージ",       min: 1, max: 5, fmt: v => `STAGE ${v}` },
      { key: "graphics",   label: "かるさ・がしつ", min: 1, max: 5, fmt: v => GAME_DATA.QUALITY_PRESETS[v].label },
      { key: "sfx",        label: "うつ おと",      min: 0, max: 3, fmt: v => GAME_DATA.SFX_MODES[v][1] },
      { key: "bgm",        label: "おんがく(BGM)",  min: 0, max: 1, fmt: v => v === 1 ? "ON（あり）" : "OFF（なし）" },
    ];
    this.sliderDefs = defs;
    this.sliderEls = [];
    list.innerHTML = "";
    defs.forEach((d, idx) => {
      const row = document.createElement('div');
      row.className = 'slider-row' + (idx === 0 ? ' active' : '');
      row.innerHTML = `
        <div class="sl-label">${d.label}</div>
        <button type="button" class="sl-step-btn" data-dir="-1">◀</button>
        <div class="sl-track-wrap">
          <input type="range" class="sl-range" min="${d.min}" max="${d.max}" step="1" value="${d.min}">
        </div>
        <button type="button" class="sl-step-btn" data-dir="1">▶</button>
        <div class="sl-val"></div>
      `;
      const input = row.querySelector('.sl-range');
      const valEl = row.querySelector('.sl-val');
      const btnM = row.querySelector('[data-dir="-1"]');
      const btnP = row.querySelector('[data-dir="1"]');

      row.addEventListener('pointerenter', () => { this.selRow = idx; this._syncTitleSliders(); });
      btnM.addEventListener('click', () => {
        AUDIO.unlockAndResumeBgm();
        this.selRow = idx;
        this._setSliderSetting(d.key, parseInt(input.value, 10) - 1, false);
      });
      btnP.addEventListener('click', () => {
        AUDIO.unlockAndResumeBgm();
        this.selRow = idx;
        this._setSliderSetting(d.key, parseInt(input.value, 10) + 1, false);
      });
      input.addEventListener('input', () => {
        AUDIO.unlockAndResumeBgm();
        this.selRow = idx;
        this._setSliderSetting(d.key, parseInt(input.value, 10), d.key === "graphics");
      });
      input.addEventListener('change', () => {
        if (d.key === "graphics") {
          this._applyQualityRuntime("full");
          this._syncTitleSliders();
          this.showToast(`画質・かるさ: ${GAME_DATA.QUALITY_PRESETS[this.graphicsLevel].label}（ほぞんしたよ！）`, "#c3f5d2", 2.0);
        }
      });

      list.appendChild(row);
      this.sliderEls.push({ key: d.key, row, input, valEl, fmt: d.fmt, min: d.min, max: d.max });
    });
  }

  _bindEvents() {
    window.addEventListener('resize', () => this.renderer.resize());
    document.addEventListener('fullscreenchange', () => {
      this._syncTitleSliders();
      if (this.paused) this._refreshPauseUI();
      setTimeout(() => this.renderer.resize(), 60);
    });

    // Unlock Web Audio on first user interaction anywhere
    const unlock = () => AUDIO.unlockAndResumeBgm();
    window.addEventListener('pointerdown', unlock, { passive: true });

    this.startBtn.addEventListener('click', () => {
      AUDIO.unlockAndResumeBgm();
      this.beginStage(this.startStage, true);
    });
    this.fsBtn.addEventListener('click', () => {
      AUDIO.unlockAndResumeBgm();
      this.toggleFullscreen();
    });
    document.getElementById('hudPauseBtn').addEventListener('click', () => {
      AUDIO.unlockAndResumeBgm();
      if (this.state === "MOVING" || this.state === "COMBAT") this.togglePause();
    });

    document.querySelectorAll('#pauseOverlay .pause-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        AUDIO.unlockAndResumeBgm();
        const act = btn.dataset.act;
        if (act === "resume") this.togglePause();
        else if (act === "graphics") this.cycleGraphicsLevel();
        else if (act === "difficulty") this.cycleDifficulty();
        else if (act === "sfx") this.cycleSfxMode();
        else if (act === "bgm") { AUDIO.setMuted(!AUDIO.muted); this._saveSettings(); this._refreshPauseUI(); }
        else if (act === "fullscreen") this.toggleFullscreen();
        else if (act === "retry") { this.hp = 5; this.beginStage(this.stageNum, false); }
        else if (act === "title") { this.loadStageVisualOnly(this.startStage); this.showTitle(); }
      });
    });

    window.addEventListener('keydown', (e) => {
      AUDIO.unlockAndResumeBgm();
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      if (e.repeat && (this.state === "MOVING" || this.state === "COMBAT")) return;

      // Prevent browser scrolling / focus traps
      if (["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Tab","F11"].includes(e.code)) {
        e.preventDefault();
      }
      if (e.code === "F11") { this.toggleFullscreen(); return; }

      const activeEl = document.activeElement;
      if (activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "BUTTON") && (e.code === "Space" || e.code === "Enter")) {
        activeEl.blur();
        e.preventDefault();
      }
      this._handleKey(e);
    });
  }

  _extractTypingChar(e) {
    // Chromebook等で誤って日本語IMEがONになっていても物理キー(e.code)から確実にA-Z / - を取得！
    if (e.code && e.code.startsWith("Key") && e.code.length === 4) {
      return e.code[3].toUpperCase();
    }
    if (e.code === "Minus" || e.key === "-") return "-";
    if (e.key && e.key.length === 1 && /^[a-zA-Z-]$/.test(e.key)) {
      return e.key.toUpperCase();
    }
    return null;
  }

  _saveSettings() {
    saveUserSettings({
      graphics_level: this.graphicsLevel,
      difficulty: this.difficulty,
      start_stage: this.startStage,
      sfx_mode_idx: this.sfxModeIdx,
      bgm_muted: AUDIO.muted,
    });
  }

  _syncTitleSliders() {
    const vals = {
      difficulty: this.difficulty,
      stage: this.startStage,
      graphics: this.graphicsLevel,
      sfx: this.sfxModeIdx,
      bgm: AUDIO.muted ? 0 : 1,
    };
    this.sliderEls.forEach((s, i) => {
      const v = vals[s.key];
      s.input.value = String(v);
      const pct = ((v - s.min) / Math.max(1, s.max - s.min)) * 100;
      s.input.style.background = `linear-gradient(90deg, #58d2f5 0%, #58d2f5 ${pct}%, #2e3a4c ${pct}%, #2e3a4c 100%)`;
      s.valEl.textContent = s.fmt(v);
      s.row.classList.toggle('active', i === this.selRow);
    });
    this.startBtn.textContent = `▶  STAGE ${this.startStage} を あそぶ！`;
    this.fsBtn.textContent = document.fullscreenElement ? "まどひょうじ [F11]" : "ぜんがめん [F11]";
  }

  _setSliderSetting(keyName, newVal, deferGfx = false) {
    if (keyName === "difficulty") {
      const nv = clamp(newVal, 1, 5);
      if (nv === this.difficulty) return;
      this.difficulty = nv;
      this._saveSettings();
      for (const e of this.enemies) if (e.alive) e.applyDifficulty(this.difficulty);
      const ht = this._healTierForDiff();
      const used = this._getActiveFirsts();
      for (const h of this.heals) {
        if (h.alive && h !== this.locked) {
          const pair = DECK.draw(ht, used);
          for (const o of tokenizeKana(pair[1])[0]) used.add(o[0]);
          h.setWord(pair);
        }
      }
      AUDIO.playSfx('heal');
    } else if (keyName === "stage") {
      const nv = clamp(newVal, 1, 5);
      if (nv === this.startStage) return;
      this.startStage = nv;
      this._saveSettings();
      AUDIO.playSfx('heal');
      if (this.state === "TITLE") this.loadStageVisualOnly(this.startStage);
    } else if (keyName === "graphics") {
      const nv = clamp(newVal, 1, 5);
      if (nv === this.graphicsLevel) return;
      this.graphicsLevel = nv;
      this._saveSettings();
      AUDIO.playSfx('heal');
      if (!deferGfx) {
        const mode = this.state === "TITLE" ? "full" : ((this.state === "MOVING" || this.state === "COMBAT") ? "inplace" : false);
        this._applyQualityRuntime(mode);
      }
    } else if (keyName === "sfx") {
      const nv = clamp(newVal, 0, GAME_DATA.SFX_MODES.length - 1);
      if (nv === this.sfxModeIdx) return;
      this.sfxModeIdx = nv;
      this._saveSettings();
      AUDIO.playSfx('type', GAME_DATA.SFX_MODES[this.sfxModeIdx][0], 0);
    } else if (keyName === "bgm") {
      const wantMute = (newVal === 0);
      if (wantMute === AUDIO.muted) return;
      AUDIO.setMuted(wantMute);
      this._saveSettings();
    }
    if (this.state === "TITLE") this._syncTitleSliders();
    else if (this.paused) this._refreshPauseUI();
  }

  showToast(msg, color = "#ffe182", dur = 2.6) {
    this.toastEl.textContent = msg;
    this.toastEl.style.color = color;
    this.toastEl.style.display = 'block';
    this.toastTimer = dur;
  }

  clearStageObjects() {
    for (const e of this.enemies) e.cleanup();
    for (const p of this.projectiles) p.cleanup();
    for (const h of this.heals) h.cleanup();
    this.enemies.length = 0;
    this.projectiles.length = 0;
    this.heals.length = 0;
    this.pendingSpawns.length = 0;
    this.locked = null;
    FX.clear(this.renderer);
    if (this.stage) { this.stage.destroy(this.renderer); this.stage = null; }
  }

  _healTierForDiff() { return this.difficulty === 1 ? "alpha1" : (this.difficulty === 2 ? "kana1" : "heal"); }

  _syncRendererToStage() {
    if (!this.stage) return;
    const q = GAME_DATA.QUALITY_PRESETS[this.graphicsLevel];
    const r = this.renderer;
    r.setStageLighting(this.stage.stageNum);
    r.skyTexKey = this.stage.skyTex;
    r.skyEnabled = q.sky_dome;
    r.fogColor = this.stage.hazeCol;
    r.useFog = q.shader || q.fixed_fog;
    r.fogNear = q.shader ? 12.0 : 14.0;
    r.fogFar = q.shader ? 66.0 : q.far * 0.85;
    r.useNormalMaps = (this.graphicsLevel >= 3);
    r.useShadows = (this.graphicsLevel >= 4);
    const bg = GAME_DATA.STAGE_SKY_BG[this.stage.stageNum] || [120, 175, 220, 255];
    r.clearColor = [bg[0]/255, bg[1]/255, bg[2]/255];
  }

  loadStageVisualOnly(num) {
    this.clearStageObjects();
    this.stageNum = num;
    this.encIdx = 0;
    this.stage = buildLongStageCourse(num, this.graphicsLevel, this.renderer);
    this._syncRendererToStage();
    const ht = this._healTierForDiff();
    const used = new Set();
    for (const hpPos of this.stage.healPositions) {
      const pair = DECK.draw(ht, used);
      for (const o of tokenizeKana(pair[1])[0]) used.add(o[0]);
      this.heals.push(new HealBox(hpPos, pair));
    }
    const [sp, sr] = this.stage.encounters[0].path[0];
    this.renderer.camPos = sp.slice();
    this.renderer.camRot = sr.slice();
  }

  _rebuildStageBackgroundInPlace() {
    const savedPos = this.renderer.camPos.slice();
    const savedRot = this.renderer.camRot.slice();
    const savedEnc = this.encIdx;
    if (this.stage) { this.stage.destroy(this.renderer); this.stage = null; }
    this.stage = buildLongStageCourse(this.stageNum, this.graphicsLevel, this.renderer);
    this.encIdx = savedEnc;
    for (const e of this.enemies) e.doorNode = null;
    this._syncRendererToStage();
    this.renderer.camPos = savedPos;
    this.renderer.camRot = savedRot;
  }

  _applyQualityRuntime(rebuildMode = false) {
    CURRENT_QUALITY = this.graphicsLevel;
    const q = GAME_DATA.QUALITY_PRESETS[this.graphicsLevel];
    const scaleMap = { 5: 1.0, 4: 0.90, 3: 0.78, 2: 0.65, 1: 0.52 };
    this.renderer.resScale = scaleMap[this.graphicsLevel] || 0.78;
    this.renderer.clipFar = q.far;
    this.renderer.resize();
    this.renderer.applyTextureFilterQuality(q.mipmap);
    FX.smokeEnabled = q.smoke;
    FX.debrisEnabled = q.debris;
    if (!q.smoke && !q.debris) FX.clear(this.renderer);

    if (rebuildMode === "full") this.loadStageVisualOnly(this.stageNum);
    else if (rebuildMode === "inplace") this._rebuildStageBackgroundInPlace();
    else this._syncRendererToStage();
  }

  cycleGraphicsLevel() {
    this.graphicsLevel = this.graphicsLevel <= 1 ? 5 : (this.graphicsLevel - 1);
    this._saveSettings();
    const qLabel = GAME_DATA.QUALITY_PRESETS[this.graphicsLevel].label;
    AUDIO.playSfx('heal');
    const mode = this.state === "TITLE" ? "full" : ((this.state === "MOVING" || this.state === "COMBAT") ? "inplace" : false);
    this._applyQualityRuntime(mode);
    if (this.paused) this._refreshPauseUI();
    else if (this.state === "TITLE") this._syncTitleSliders();
    this.showToast(`画質・かるさ: ${qLabel}（設定保存済）`, "#c3f5d2", 2.2);
  }

  cycleDifficulty() {
    this._setSliderSetting("difficulty", (this.difficulty % 5) + 1);
    if (this.state !== "TITLE" && !this.paused) {
      this.showToast(`難易度を変更: ${GAME_DATA.DIFFICULTY_PARAMS[this.difficulty].label}`, "#ffe68c", 1.8);
    }
  }

  cycleSfxMode() {
    this._setSliderSetting("sfx", (this.sfxModeIdx + 1) % GAME_DATA.SFX_MODES.length);
    if (this.state !== "TITLE" && !this.paused) {
      this.showToast(`効果音を変更: ${GAME_DATA.SFX_MODES[this.sfxModeIdx][1]}`, "#ffe68c", 1.8);
    }
  }

  toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.().catch(() => {});
    } else {
      document.exitFullscreen?.().catch(() => {});
    }
  }

  showTitle() {
    this.state = "TITLE";
    this.paused = false;
    this.titleOverlay.classList.remove('hidden');
    this.pauseOverlay.classList.add('hidden');
    this.resultOverlay.classList.add('hidden');
    this.toastEl.style.display = 'none';
    AUDIO.playBgm("title");
    this._syncTitleSliders();
    this.updateHUD();
  }

  beginStage(num, resetSession = false) {
    if (resetSession) {
      DECK.resetAll();
      this.hp = 5;
      this.score = 0;
      this.stageStartScore = 0;
      this.combo = 0;
      this.maxCombo = 0;
      this.sessionOk = 0;
      this.sessionNg = 0;
      this.sessionKills = 0;
    } else {
      this.stageStartScore = this.score;
    }
    this.paused = false;
    this.titleOverlay.classList.add('hidden');
    this.pauseOverlay.classList.add('hidden');
    this.resultOverlay.classList.add('hidden');
    this.stageScore = 0;
    this.stageMaxCombo = 0;
    this.stageOk = 0;
    this.stageNg = 0;
    this.stageKills = 0;
    this.stageDmg = 0;
    this.stagePlaySec = 0;
    this.encIdx = 0;
    this.loadStageVisualOnly(num);
    AUDIO.playBgm(GAME_DATA.STAGE_THEMES[num].bgm);
    this.showToast(GAME_DATA.STAGE_THEMES[num].title, "#ffe88c", 3.2);
    this.updateHUD();
    this.startEncounterMove();
  }

  startEncounterMove() {
    if (this.encIdx >= this.stage.encounters.length) {
      this.showStageClear();
      return;
    }
    const enc = this.stage.encounters[this.encIdx];
    this.state = "MOVING";
    this.pathQueue = enc.path.map(([p, r]) => [p.slice(), r.slice()]);
    this._advanceNextWaypoint();
    this.updateHUD();
    if (enc.isBoss) {
      AUDIO.playSfx('boss_alert');
      AUDIO.playBgm("boss");
      this.showToast(`WARNING : ${GAME_DATA.STAGE_BOSS_DATA[this.stageNum].name} 出現！`, "#ff735f", 3.0);
    }
  }

  _advanceNextWaypoint() {
    if (!this.pathQueue.length) { this.beginCombat(); return; }
    const [tp, tr] = this.pathQueue.shift();
    this.moveFromPos = this.renderer.camPos.slice();
    this.moveToPos = tp.slice();
    this.moveFromRot = this.renderer.camRot.slice();
    this.moveToRot = tr.slice();
    const d = dist3d(this.moveFromPos[0],this.moveFromPos[1],this.moveFromPos[2], tp[0],tp[1],tp[2]);
    this.moveDur = Math.max(0.22, d / 13.5);
    this.moveT = 0;
  }

  beginCombat() {
    this.state = "COMBAT";
    this.encElapsed = 0;
    this.pendingSpawns = this.stage.encounters[this.encIdx].spawns.map(s => ({ ...s, pos: s.pos.slice(), dir: s.dir.slice() }));
  }

  _getActiveFirsts() {
    const used = new Set();
    for (const obj of [...this.enemies, ...this.projectiles, ...this.heals]) {
      if (obj.alive) for (const ch of obj.word.validFirsts()) used.add(ch);
    }
    return used;
  }

  _pickWordsForEnemy(kind) {
    const diff = this.difficulty;
    if (kind === "boss") {
      if (diff === 1) {
        const avoid = this._getActiveFirsts();
        const out = [];
        for (let i = 0; i < GAME_DATA.ENEMY_META.boss.words; i++) {
          const pair = DECK.draw("alpha1", avoid);
          for (const o of tokenizeKana(pair[1])[0]) avoid.add(o[0]);
          out.push(pair);
        }
        return out;
      }
      if (diff === 4 && this.stageNum >= 4) return GAME_DATA.STAGE_BOSS_DATA[this.stageNum].words.slice();
      return GAME_DATA.BOSS_WORDS_BY_DIFF[diff][this.stageNum].slice();
    }

    const cnt = GAME_DATA.ENEMY_META[kind].words;
    const avoid = this._getActiveFirsts();
    const chosen = [];
    const st = this.stageNum;
    const late = this.encIdx >= 6;

    for (let idx = 0; idx < cnt; idx++) {
      let tier = "t1";
      if (diff === 1) {
        // Lv.1: アルファベット1文字
        tier = "alpha1";
      } else if (diff === 2) {
        // Lv.2: ひらがな1文字（ga, fu, ka, sa, ba, pa 等）
        tier = "kana1";
      } else if (diff === 3) {
        // Lv.3: 2〜3文字の身近な単語（fune, inu, neko, ringo, suika 等）
        if (st <= 2) tier = (cnt >= 2 && idx === 1) ? "t0" : "t0_mini";
        else if (st <= 4) tier = (cnt >= 2 && idx === 1 && late) ? "t1" : "t0";
        else tier = ((cnt >= 2 && idx === 1) || late) ? "t1" : "t0";
      } else if (diff === 4) {
        // Lv.4: 単語〜短いフレーズ（青い空、朝の光、白い鳥が空を飛ぶ 等）
        if (st === 1) tier = ((cnt > 1 && idx === 1) || (late && Math.random() < 0.35)) ? "t2" : "t1";
        else if (st === 2) tier = (cnt > 1 && idx === 1) ? (late ? "t3" : "t2") : ((late || Math.random() < 0.65) ? "t2" : "t1");
        else if (st === 3) tier = ((cnt > 1 && idx === 1) || (late && Math.random() < 0.45)) ? "t3" : "t2";
        else tier = ((cnt > 1 && idx === 1) || late) ? "t3" : "t2";
      } else {
        // Lv.5: 中〜長文フレーズ
        if (st <= 2) tier = ((cnt > 1 && idx === 1) || (st === 2 && late)) ? "t4" : "t3";
        else tier = ((cnt > 1 && idx === 1) || late || Math.random() < 0.55) ? "t4" : "t3";
      }
      const pair = DECK.draw(tier, avoid);
      for (const o of tokenizeKana(pair[1])[0]) avoid.add(o[0]);
      chosen.push(pair);
    }
    return chosen;
  }

  _spawnEnemy(sp) {
    const words = this._pickWordsForEnemy(sp.kind);
    const doorNode = sp.door ? this.stage.doors[sp.door] : null;
    this.enemies.push(new Enemy3D({
      kind: sp.kind,
      spawnPos: sp.pos,
      wordPairs: words,
      emergeMode: sp.emerge,
      emergeDir: sp.dir,
      doorNode,
      descendToPlayer: sp.descend,
      bossStyle: sp.bossStyle || this.stageNum,
      customName: sp.customName,
      difficulty: this.difficulty,
    }));
  }

  _autoFrameCamera(dt) {
    let focus = null;
    if (this.locked && this.locked.alive && !this.locked.isItem) {
      focus = this.locked;
    } else {
      const active = this.enemies.filter(e => e.targetable);
      if (active.length) {
        const cp = this.renderer.camPos;
        active.sort((a, b) => {
          const wa = a.state === "WINDUP" ? 1 : 0, wb = b.state === "WINDUP" ? 1 : 0;
          if (wa !== wb) return wb - wa;
          return dist2d(a.pos[0],a.pos[2], cp[0],cp[2]) - dist2d(b.pos[0],b.pos[2], cp[0],cp[2]);
        });
        focus = active[0];
      }
    }
    if (!focus) return;
    const aimY = focus.isBoss ? 5.4 : (focus.kind === "giant" ? 2.8 : (focus.isProjectile ? 0.0 : 1.5));
    const cp = this.renderer.camPos;
    const dx = focus.pos[0] - cp[0], dy = (focus.pos[1] + aimY) - cp[1], dz = focus.pos[2] - cp[2];
    const horiz = Math.hypot(dx, dz);
    if (horiz < 0.5) return;
    const wantYaw = Math.atan2(dx, dz) * 180 / Math.PI;
    const wantPitch = clamp(-Math.atan2(dy, horiz) * 180 / Math.PI, -38, 20);
    const a = 1 - Math.exp(-4.2 * dt);
    this.renderer.camRot[1] = lerpAngleDeg(this.renderer.camRot[1], wantYaw, a);
    this.renderer.camRot[0] = lerpAngleDeg(this.renderer.camRot[0], wantPitch, a);
  }

  togglePause() {
    if (this.state !== "MOVING" && this.state !== "COMBAT") return;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    this.paused = !this.paused;
    this.pauseOverlay.classList.toggle('hidden', !this.paused);
    if (this.paused) { AUDIO.pauseBgm(); this._refreshPauseUI(); }
    else AUDIO.unpauseBgm();
  }

  _refreshPauseUI() {
    document.getElementById('pGfxTxt').textContent = `軽量化・画質（${GAME_DATA.QUALITY_PRESETS[this.graphicsLevel].label}）`;
    document.getElementById('pDiffTxt').textContent = `難易度 切替（${GAME_DATA.DIFFICULTY_PARAMS[this.difficulty].label}）`;
    document.getElementById('pSfxTxt').textContent = `効果音 切替（${GAME_DATA.SFX_MODES[this.sfxModeIdx][1]}）`;
    document.getElementById('pBgmTxt').textContent = `BGM 切替（${AUDIO.muted ? "OFF" : "ON"}）`;
    document.getElementById('pFsTxt').textContent = `表示切替（${document.fullscreenElement ? "全画面" : "ウィンドウ"}）`;
    document.getElementById('pRetryTxt').textContent = `STAGE ${this.stageNum} やり直し`;
  }

  onPlayerDamaged() {
    AUDIO.playSfx('damage');
    FX.addShake(0.25, 1.1);
    this.dmgVignetteT = 0.36;
    this.hp -= 1;
    this.stageDmg += 1;
    this.combo = 0;
    this.updateHUD();
    if (this.hp <= 0) this.showGameOver();
  }

  _calcResultRank(cleared) {
    const totalTypes = this.stageOk + this.stageNg;
    const acc = (this.stageOk / Math.max(1, totalTypes)) * 100;
    const totalW = Math.max(1, this.stage ? this.stage.encounters.length : 13);
    const prog = cleared ? 1.0 : (this.encIdx / totalW);
    if (cleared) {
      if ((acc >= 94 && this.stageDmg === 0) || (acc >= 97 && this.stageDmg <= 1)) return ["S", "PERFECT MASTER!", "#ffdc4b"];
      if (acc >= 85 && this.stageDmg <= 2) return ["A", "EXCELLENT!", "#69ebff"];
      if (acc >= 70) return ["B", "GOOD JOB!", "#7deb91"];
      return ["C", "STAGE CLEAR!", "#fab95f"];
    } else {
      if (prog >= 0.65 && acc >= 82 && totalTypes >= 20) return ["B", "SO CLOSE!", "#7deb91"];
      if ((prog >= 0.30 && acc >= 70) || totalTypes >= 30) return ["C", "NICE FIGHT!", "#fab95f"];
      return ["D", "TRY AGAIN!", "#e17d78"];
    }
  }

  _populateResultUI(cleared, bonusPts) {
    const elapsed = Math.max(1, this.stagePlaySec);
    const mins = Math.floor(elapsed / 60), secs = Math.floor(elapsed % 60);
    const totalTypes = this.stageOk + this.stageNg;
    const acc = (this.stageOk / Math.max(1, totalTypes)) * 100;
    const kps = this.stageOk / elapsed;
    const totalW = this.stage ? this.stage.encounters.length : 13;
    const curW = Math.min(this.encIdx + 1, totalW);
    const reachStr = cleared ? "ALL WAVE CLEAR" : `WAVE ${curW}/${totalW}`;
    const [rank, rankMsg, rankCol] = this._calcResultRank(cleared);
    const bonusStr = bonusPts > 0 ? ` (+${bonusPts.toLocaleString()} ノーダメ)` : "";
    const diffLabel = GAME_DATA.DIFFICULTY_PARAMS[this.difficulty].label;

    document.getElementById('resultCard').classList.toggle('gameover', !cleared);
    document.getElementById('resSub').textContent = `${GAME_DATA.STAGE_THEMES[this.stageNum].title}   |   ${diffLabel}`;
    document.getElementById('resStats').textContent =
      `得点（SCORE） :  ${this.stageScore.toLocaleString()} pts${bonusStr}\n` +
      `総タイプ数    :  ${totalTypes.toLocaleString()} 回  (正打 ${this.stageOk.toLocaleString()} / ミス ${this.stageNg.toLocaleString()})\n` +
      `正確率 / 速度 :  ${acc.toFixed(1)}%   (${kps.toFixed(1)} 打/秒)\n` +
      `最大コンボ    :  ${this.stageMaxCombo} COMBO   |   撃破数: ${this.stageKills} 体\n` +
      `タイム / 到達 :  ${mins}分${String(secs).padStart(2,'0')}秒   |   ${reachStr}`;
    const rEl = document.getElementById('resRank');
    const rmEl = document.getElementById('resRankMsg');
    rEl.textContent = rank; rEl.style.color = rankCol;
    rmEl.textContent = rankMsg; rmEl.style.color = rankCol;
    const sessTypes = this.sessionOk + this.sessionNg;
    document.getElementById('resFooter').textContent =
      `累計スコア: ${this.score.toLocaleString()} pts   |   累計総タイプ数: ${sessTypes.toLocaleString()} 回   |   累計撃破: ${this.sessionKills} 体`;
  }

  showStageClear() {
    const bonus = this.stageDmg === 0 ? 1000 : 0;
    if (bonus > 0) this._addScore(bonus);
    AUDIO.playSfx('clear_fanfare');
    this.toastEl.style.display = 'none';
    this.titleOverlay.classList.add('hidden');
    this.resultOverlay.classList.remove('hidden');
    this._populateResultUI(true, bonus);

    const actions = document.getElementById('resActions');
    actions.innerHTML = "";
    const mkBtn = (label, primary, fn) => {
      const b = document.createElement('button');
      b.className = 'res-btn' + (primary ? ' primary' : '');
      b.textContent = label;
      b.addEventListener('click', () => { AUDIO.unlockAndResumeBgm(); fn(); });
      actions.appendChild(b);
    };

    const tEl = document.getElementById('resTitle');
    if (this.stageNum >= 5) {
      this.state = "ALL_CLEAR";
      AUDIO.playBgm("title");
      tEl.textContent = "ALL 5 STAGES CLEARED!  - RESULT -";
      tEl.style.color = "#ffe15f";
      mkBtn("タイトルへ戻る [SPACE]", true, () => { this.loadStageVisualOnly(this.startStage); this.showTitle(); });
    } else {
      this.state = "STAGE_CLEAR";
      AUDIO.playBgm("title");
      tEl.textContent = `STAGE ${this.stageNum} CLEAR!  - RESULT -`;
      tEl.style.color = "#ffe478";
      mkBtn(`次の STAGE ${this.stageNum + 1} へ進む [SPACE]`, true, () => this.beginStage(this.stageNum + 1, false));
      mkBtn("リトライ [R]", false, () => { this.hp = 5; this.score = this.stageStartScore; this.beginStage(this.stageNum, false); });
      mkBtn("タイトルへ [T]", false, () => { this.loadStageVisualOnly(this.startStage); this.showTitle(); });
    }
    this.updateHUD();
  }

  showGameOver() {
    this.state = "GAMEOVER";
    this.toastEl.style.display = 'none';
    this.titleOverlay.classList.add('hidden');
    this.resultOverlay.classList.remove('hidden');
    AUDIO.playSfx('gameover_sting');
    AUDIO.playBgm("title");
    this._populateResultUI(false, 0);
    const tEl = document.getElementById('resTitle');
    tEl.textContent = "GAME OVER  - RESULT -";
    tEl.style.color = "#f5625c";

    const actions = document.getElementById('resActions');
    actions.innerHTML = "";
    const mkBtn = (label, primary, fn) => {
      const b = document.createElement('button');
      b.className = 'res-btn' + (primary ? ' primary' : '');
      b.textContent = label;
      b.addEventListener('click', () => { AUDIO.unlockAndResumeBgm(); fn(); });
      actions.appendChild(b);
    };
    mkBtn("リトライ [SPACE / R]", true, () => { this.hp = 5; this.score = this.stageStartScore; this.beginStage(this.stageNum, false); });
    mkBtn("タイトルへ [T]", false, () => { this.loadStageVisualOnly(this.startStage); this.showTitle(); });
    this.updateHUD();
  }

  updateHUD() {
    this.hpTxt.textContent = "LIFE: " + "● ".repeat(Math.max(0, this.hp)) + "○ ".repeat(Math.max(0, 5 - this.hp));
    this.scoreTxt.textContent = `SCORE: ${String(this.score).padStart(6, '0')}   COMBO: ${this.combo}`;
    const totalW = this.stage ? this.stage.encounters.length : 13;
    const curW = Math.min(this.encIdx + 1, totalW);
    this.progTxt.textContent = `ST.${this.stageNum} [${curW === totalW ? "BOSS" : `${curW}/${totalW}`}]`;
  }

  _handleKey(e) {
    const code = e.code;
    if (code === "Escape" && (this.state === "MOVING" || this.state === "COMBAT")) {
      this.togglePause();
      return;
    }

    if (this.paused) {
      if (code === "KeyG") this.cycleGraphicsLevel();
      else if (code === "KeyD") this.cycleDifficulty();
      else if (code === "KeyF") this.toggleFullscreen();
      else if (code === "KeyM") { AUDIO.setMuted(!AUDIO.muted); this._saveSettings(); this._refreshPauseUI(); }
      else if (code === "KeyS") this.cycleSfxMode();
      else if (code === "KeyR") { this.hp = 5; this.beginStage(this.stageNum, false); }
      else if (code === "KeyT") { this.loadStageVisualOnly(this.startStage); this.showTitle(); }
      return;
    }

    if (this.state === "TITLE") {
      if (code === "ArrowUp") { this.selRow = (this.selRow - 1 + this.sliderEls.length) % this.sliderEls.length; this._syncTitleSliders(); return; }
      if (code === "ArrowDown") { this.selRow = (this.selRow + 1) % this.sliderEls.length; this._syncTitleSliders(); return; }
      if (code === "ArrowLeft" || code === "ArrowRight") {
        const s = this.sliderEls[this.selRow];
        this._setSliderSetting(s.key, parseInt(s.input.value, 10) + (code === "ArrowLeft" ? -1 : 1), false);
        return;
      }
      if (code === "KeyG") { this.cycleGraphicsLevel(); return; }
      if (code === "KeyD") { this.cycleDifficulty(); return; }
      if (code === "KeyM") { AUDIO.setMuted(!AUDIO.muted); this._saveSettings(); this._syncTitleSliders(); return; }
      if (code === "KeyS") { this.cycleSfxMode(); return; }
      if (["Digit1","Digit2","Digit3","Digit4","Digit5"].includes(code)) { this._setSliderSetting("stage", parseInt(code[5], 10)); return; }
      if (code === "Space" || code === "Enter") { this.beginStage(this.startStage, true); return; }
      return;
    }

    if (this.state === "ALL_CLEAR" || this.state === "GAMEOVER") {
      if (code === "KeyG") { this.cycleGraphicsLevel(); return; }
      if (code === "KeyD") { this.cycleDifficulty(); return; }
      if (code === "KeyM") { AUDIO.setMuted(!AUDIO.muted); this._saveSettings(); return; }
      if (code === "KeyS") { this.cycleSfxMode(); return; }
      if (code === "KeyT") { this.loadStageVisualOnly(this.startStage); this.showTitle(); return; }
      if (code === "KeyR" && this.state === "GAMEOVER") { this.hp = 5; this.score = this.stageStartScore; this.beginStage(this.stageNum, false); return; }
      if (["Digit1","Digit2","Digit3","Digit4","Digit5"].includes(code)) { this.beginStage(parseInt(code[5], 10), true); return; }
      if (code === "Space" || code === "Enter") {
        if (this.state === "GAMEOVER") { this.hp = 5; this.score = this.stageStartScore; this.beginStage(this.stageNum, false); }
        else { this.loadStageVisualOnly(this.startStage); this.showTitle(); }
      }
      return;
    }

    if (this.state === "STAGE_CLEAR") {
      if (code === "KeyG") this.cycleGraphicsLevel();
      else if (code === "KeyD") this.cycleDifficulty();
      else if (code === "KeyS") this.cycleSfxMode();
      else if (code === "KeyM") { AUDIO.setMuted(!AUDIO.muted); this._saveSettings(); }
      else if (code === "KeyR") { this.hp = 5; this.score = this.stageStartScore; this.beginStage(this.stageNum, false); }
      else if (code === "KeyT") { this.loadStageVisualOnly(this.startStage); this.showTitle(); }
      else if (["Digit1","Digit2","Digit3","Digit4","Digit5"].includes(code)) this.beginStage(parseInt(code[5], 10), true);
      else if (code === "Space" || code === "Enter") this.beginStage(this.stageNum + 1, false);
      return;
    }

    if (this.state !== "MOVING" && this.state !== "COMBAT") return;

    const ch = this._extractTypingChar(e);
    if (!ch) return;

    const visibleHeals = this.heals.filter(h => h.alive && h.uiVisible);
    const cp = this.renderer.camPos;

    if (this.state === "MOVING") {
      if (this.locked && this.locked.isItem && this.locked.alive && this.locked.uiVisible) {
        if (this.locked.word.feed(ch)) { this._onHit(this.locked); return; }
        const others = visibleHeals.filter(h => h !== this.locked && h.word.validFirsts().has(ch));
        if (others.length) {
          others.sort((a, b) => dist2d(a.pos[0],a.pos[2],cp[0],cp[2]) - dist2d(b.pos[0],b.pos[2],cp[0],cp[2]));
          this.locked.refreshUI(false);
          this.locked = others[0];
          this.locked.word.feed(ch);
          this._onHit(this.locked);
        } else {
          this._onMiss();
        }
      } else if (visibleHeals.length) {
        const cands = visibleHeals.filter(h => h.word.validFirsts().has(ch));
        if (cands.length) {
          cands.sort((a, b) => dist2d(a.pos[0],a.pos[2],cp[0],cp[2]) - dist2d(b.pos[0],b.pos[2],cp[0],cp[2]));
          this.locked = cands[0];
          this.locked.word.feed(ch);
          this._onHit(this.locked);
        }
      }
      return;
    }

    // COMBAT: タイプのみで全ターゲット攻撃＆自動切替（Tab不要・v8完全準拠）
    const hasLocked = this.locked && this.locked.alive && (this.locked.targetable === undefined || this.locked.targetable);
    if (hasLocked && this.locked.word.feed(ch)) {
      this._onHit(this.locked);
      return;
    }

    const allTargets = [
      ...this.projectiles.filter(p => p.alive),
      ...this.enemies.filter(en => en.targetable),
      ...visibleHeals
    ];
    const cands = allTargets.filter(t => t !== this.locked && t.word.validFirsts().has(ch));
    if (cands.length) {
      const prio = (obj) => {
        if (obj.isProjectile) return [3, obj.t];
        if (obj.isItem) return [0, -dist2d(obj.pos[0],obj.pos[2],cp[0],cp[2])];
        return [obj.state === "WINDUP" ? 2 : 1, -dist2d(obj.pos[0],obj.pos[2],cp[0],cp[2])];
      };
      cands.sort((a, b) => {
        const pa = prio(a), pb = prio(b);
        return pa[0] !== pb[0] ? (pb[0] - pa[0]) : (pb[1] - pa[1]);
      });
      if (hasLocked) this.locked.refreshUI(false);
      this.locked = cands[0];
      this.locked.word.feed(ch);
      this._onHit(this.locked);
    } else {
      this._onMiss();
    }
  }

  _addScore(pts) { this.score += pts; this.stageScore += pts; }

  _onHit(target) {
    const vIdx = Math.min(3, Math.floor(this.combo / 8));
    AUDIO.playSfx('type', GAME_DATA.SFX_MODES[this.sfxModeIdx][0], vIdx);
    this.rifle.kick(this.renderer);
    if (target.pos) {
      const mPos = this.rifle.getMuzzleWorldPos(this.renderer);
      const tPos = target.getHitPos ? target.getHitPos() : [target.pos[0], target.pos[1] + 0.6, target.pos[2]];
      FX.spawnTracer(mPos, tPos);
    }
    this.stageOk += 1;
    this.sessionOk += 1;
    this.combo += 1;
    this.maxCombo = Math.max(this.maxCombo, this.combo);
    this.stageMaxCombo = Math.max(this.stageMaxCombo, this.combo);
    this._addScore(20 * (1 + Math.floor(this.combo / 10)));
    target.onHitChar();

    if (target.word.completed()) {
      if (target.isProjectile) {
        AUDIO.playSfx('stagger');
        this._addScore(120);
        target.cleanup();
        this.locked = null;
      } else if (target.isItem) {
        AUDIO.playSfx('heal');
        this.hp = Math.min(5, this.hp + 1);
        this._addScore(150);
        target.cleanup();
        this.locked = null;
      } else {
        const killed = target.onWordCompleted();
        if (killed) {
          this.stageKills += 1;
          this.sessionKills += 1;
          this._addScore(target.isBoss ? 2000 : 300);
          this.locked = null;
        }
      }
    } else {
      target.refreshUI(true);
    }
    this.updateHUD();
  }

  _onMiss() {
    AUDIO.playSfx('miss');
    this.stageNg += 1;
    this.sessionNg += 1;
    this.combo = 0;
    this.updateHUD();
  }

  _updateLogic(rawDt, nowSec) {
    this.fpsAcc += rawDt;
    this.fpsFrames += 1;
    if (this.fpsAcc >= 0.5) {
      const fps = Math.round(this.fpsFrames / Math.max(0.001, this.fpsAcc));
      this.fpsTxt.textContent = fps + "fps";
      this.fpsTxt.style.color = fps >= 45 ? "#9bebaf" : (fps >= 25 ? "#fad773" : "#f5695f");
      this.fpsAcc = 0; this.fpsFrames = 0;
    }

    if (this.paused) {
      if (this.toastTimer > 0) {
        this.toastTimer -= Math.min(0.25, rawDt);
        if (this.toastTimer <= 0) this.toastEl.style.display = 'none';
      }
      return;
    }

    const clampedDt = clamp(rawDt, 0.001, 0.18);
    this.smoothDt = this.smoothDt * 0.55 + clampedDt * 0.45;
    const dt = this.smoothDt;

    FX.update(dt, this.renderer);
    this.rifle.step(dt, nowSec, this.state === "MOVING");

    if (this.state === "MOVING" || this.state === "COMBAT") this.stagePlaySec += clampedDt;
    if (this.toastTimer > 0) {
      this.toastTimer -= clampedDt;
      if (this.toastTimer <= 0) this.toastEl.style.display = 'none';
    }
    if (this.dmgVignetteT > 0) {
      this.dmgVignetteT = Math.max(0, this.dmgVignetteT - dt);
      const a = (this.dmgVignetteT / 0.36);
      this.dmgBorder.style.background = `rgba(185,28,28,${(0.32 * a).toFixed(3)})`;
      this.dmgBorder.style.boxShadow = `inset 0 0 90px 28px rgba(215,25,25,${(0.75 * a).toFixed(3)})`;
    }

    if (this.state === "MOVING") {
      let remDt = dt, guard = 0;
      while (this.state === "MOVING" && remDt > 0 && guard < 4) {
        guard++;
        const stepT = remDt / Math.max(0.05, this.moveDur);
        if (this.moveT + stepT >= 1.0) {
          const used = (1.0 - this.moveT) * Math.max(0.05, this.moveDur);
          remDt = Math.max(0, remDt - used);
          this.renderer.camPos = this.moveToPos.slice();
          this.renderer.camRot = this.moveToRot.slice();
          this._advanceNextWaypoint();
        } else {
          this.moveT += stepT;
          remDt = 0;
          const s = this.pathQueue.length ? this.moveT : (1 - Math.pow(1 - this.moveT, 2.2));
          const bobFade = this.pathQueue.length ? 1.0 : Math.max(0, 1 - this.moveT);
          const px = lerp(this.moveFromPos[0], this.moveToPos[0], s);
          let py = lerp(this.moveFromPos[1], this.moveToPos[1], s);
          const pz = lerp(this.moveFromPos[2], this.moveToPos[2], s);
          this.walkPhase += dt * 7.2;
          if (dist3d(this.moveFromPos[0],this.moveFromPos[1],this.moveFromPos[2], this.moveToPos[0],this.moveToPos[1],this.moveToPos[2]) > 1.0) {
            py += Math.sin(this.walkPhase) * 0.028 * bobFade;
          }
          this.renderer.camPos = [px, py, pz];
          this.renderer.camRot[0] = lerpAngleDeg(this.moveFromRot[0], this.moveToRot[0], s);
          this.renderer.camRot[1] = lerpAngleDeg(this.moveFromRot[1], this.moveToRot[1], s);
        }
      }
      for (let i = this.enemies.length - 1; i >= 0; i--) {
        const e = this.enemies[i];
        if (e.alive && e.state === "DYING") e.step(this.renderer.camPos, dt, false, 0, this.renderer, nowSec);
        if (!e.alive) this.enemies.splice(i, 1);
      }
    } else if (this.state === "COMBAT") {
      this.encElapsed += dt;
      for (let i = this.pendingSpawns.length - 1; i >= 0; i--) {
        if (this.encElapsed >= (this.pendingSpawns[i].delay || 0)) {
          this._spawnEnemy(this.pendingSpawns[i]);
          this.pendingSpawns.splice(i, 1);
        }
      }
      this._autoFrameCamera(dt);
      this.renderer.updateCameraMatrices();

      const activeTargets = this.enemies.filter(e => e.targetable);
      for (let i = this.enemies.length - 1; i >= 0; i--) {
        const e = this.enemies[i];
        const aIdx = activeTargets.indexOf(e);
        const offY = e.targetable ? (aIdx - (activeTargets.length - 1) * 0.5) * 0.055 : 0;
        const res = e.step(this.renderer.camPos, dt, e === this.locked, offY, this.renderer, nowSec);
        if (!e.alive) { this.enemies.splice(i, 1); continue; }
        if (res) {
          const [evType, arg1, arg2] = res;
          if (evType === "STRIKE_PLAYER") {
            this.onPlayerDamaged();
            if (this.state === "GAMEOVER") return;
          } else if (evType === "SPAWN_PROJ") {
            const pTier = this.difficulty === 1 ? "alpha1" : (this.difficulty === 2 ? "kana1" : "proj");
            const pw = DECK.draw(pTier, this._getActiveFirsts());
            const pSec = GAME_DATA.DIFFICULTY_PARAMS[this.difficulty].proj_sec;
            const cp = this.renderer.camPos;
            this.projectiles.push(new TypingProjectile(arg2, [cp[0], cp[1] - 0.25, cp[2]], arg1, pw, pSec));
          }
        }
      }

      for (let i = this.projectiles.length - 1; i >= 0; i--) {
        const p = this.projectiles[i];
        const res = p.step(dt, p === this.locked, this.renderer);
        if (!p.alive) this.projectiles.splice(i, 1);
        if (res === "HIT_PLAYER") {
          if (this.locked === p) this.locked = null;
          this.onPlayerDamaged();
          if (this.state === "GAMEOVER") return;
        }
      }

      const stillFalling = this.enemies.some(e => e.state === "DYING" && e.dyingT < 0.60);
      if (!this.pendingSpawns.length && !this.enemies.some(e => e.targetable) && !stillFalling && !this.projectiles.length) {
        this.locked = null;
        this.encIdx += 1;
        this.startEncounterMove();
      }
    }

    // Update camera-relative floating light motes & heal boxes after camera finalized
    this.renderer.updateCameraMatrices();
    if (this.stage && GAME_DATA.QUALITY_PRESETS[this.graphicsLevel].fx_glow) {
      const cp = this.renderer.camPos, f = this.renderer.camFwd, r = this.renderer.camRight;
      for (const [m, off, ph] of this.stage.motes) {
        const bob = Math.sin(nowSec * 1.4 + ph) * 0.45;
        const rx = off[0] + Math.cos(nowSec * 0.8 + ph) * 0.5;
        m.pos[0] = cp[0] + f[0]*off[2] + r[0]*rx;
        m.pos[1] = cp[1] + f[1]*off[2] + r[1]*rx + (off[1] - 2.0 + bob);
        m.pos[2] = cp[2] + f[2]*off[2] + r[2]*rx;
      }
    }
    for (const h of this.heals) {
      if (h.alive) h.step(dt, h === this.locked, this.renderer);
    }
    if (this.locked && this.locked.isItem && (!this.locked.alive || !this.locked.uiVisible)) {
      this.locked = null;
    }
  }

  _renderScene(dt, nowSec) {
    const r = this.renderer;
    r.updateCameraMatrices();
    if (!this.stage) { r.beginFrame(dt); return; }

    const q = GAME_DATA.QUALITY_PRESETS[this.graphicsLevel];
    const ahead = q.vis_ahead;
    const cur = this.encIdx;

    // 1. Gather visible static batches & dynamic drawables first (shared by Shadow Pass + Main Pass)
    const visibleBatches = [];
    if (this.stage.globalBgBatch) visibleBatches.push(this.stage.globalBgBatch);
    const outO = [], outT = [], outA = [];
    const lightCands = [];
    const cp = r.camPos;

    if (q.fx_glow) {
      for (const n of this.stage.globalFxNodes) n.collectDrawables(null, r, outO, outT, outA);
    }
    for (let i = 0; i < this.stage.segBatches.length; i++) {
      if (i >= cur - 1 && i <= cur + ahead) {
        visibleBatches.push(this.stage.segBatches[i]);
        for (const d of this.stage.segDoors[i]) d.collectDrawables(null, r, outO, outT, outA);
        if (q.fx_glow) {
          for (const f of this.stage.segFxLists[i]) f.collectDrawables(null, r, outO, outT, outA);
        }
        if (this.graphicsLevel >= 2 && this.stage.segLights[i]) {
          for (const L of this.stage.segLights[i]) {
            const dd = dist2d(L.pos[0], L.pos[2], cp[0], cp[2]);
            if (dd < 34.0) lightCands.push({ L, dd });
          }
        }
      }
    }
    for (const h of this.heals) if (h.alive) h.root.collectDrawables(null, r, outO, outT, outA);
    for (const e of this.enemies) if (e.alive) e.root.collectDrawables(null, r, outO, outT, outA);
    for (const p of this.projectiles) if (p.alive) p.root.collectDrawables(null, r, outO, outT, outA);
    FX.collectDrawables(r, outO, outT, outA);
    if (this.state === "MOVING" || this.state === "COMBAT") {
      this.rifle.collectDrawables(r, outO, outT, outA);
    }

    // 2. Select up to 3 active dynamic point lights (Muzzle Flash + nearest flickering torches/crystals)
    const activeLights = [];
    const maxPts = this.graphicsLevel >= 4 ? 3 : (this.graphicsLevel === 3 ? 2 : (this.graphicsLevel === 2 ? 1 : 0));
    if (maxPts > 0 && FX.flashTimer > 0) {
      const f = clamp(FX.flashTimer / 0.055, 0, 1);
      activeLights.push({
        pos: FX.flashPos,
        col: [FX.flashCol[0]*f, FX.flashCol[1]*f, FX.flashCol[2]*f],
        radius: 6.5
      });
    }
    if (activeLights.length < maxPts && lightCands.length) {
      lightCands.sort((a, b) => a.dd - b.dd);
      for (const { L } of lightCands) {
        if (activeLights.length >= maxPts) break;
        const fl = L.flicker > 0 ? (1.0 + Math.sin(nowSec * 11.5 + L.ph) * L.flicker * 0.65 + Math.sin(nowSec * 23.0 + L.ph * 2.1) * L.flicker * 0.35) : 1.0;
        activeLights.push({
          pos: L.pos,
          col: [L.col[0]*fl, L.col[1]*fl, L.col[2]*fl],
          radius: L.radius
        });
      }
    }
    r.setPointLights(activeLights);

    // 3. Real-Time Shadow Map Pass (Lv.4-5)
    r.renderShadowPass(visibleBatches, outO);

    // 4. Main PBR Lit Render Pass
    r.beginFrame(dt);
    r.drawStaticBatches(visibleBatches);
    r.drawDynamicList(outO, outT, outA);
  }

  _loop(nowMs) {
    const rawDt = Math.max(0.001, (nowMs - this.lastTime) / 1000);
    this.lastTime = nowMs;
    this._updateLogic(rawDt, nowMs / 1000);
    this._renderScene(this.paused ? 0 : Math.min(0.1, rawDt), nowMs / 1000);
    requestAnimationFrame((t) => this._loop(t));
  }
}

window.addEventListener('DOMContentLoaded', () => {
  try {
    window.director = new GameDirector();
  } catch (err) {
    document.body.innerHTML = `<div style="padding:32px;color:#fff;font-size:18px;">起動エラー: ${err.message}</div>`;
    console.error(err);
  }
});
</script>
</body>
