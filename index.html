  applyDifficulty(diff) {
    this.difficulty = diff;
    const dp = GAME_DATA.DIFFICULTY_PARAMS[diff];
    this.speed = this.rawSpeed * dp.spd_mult;
    this.baseWindup = this.rawWindup * dp.wind_mult;
    this.backoffDist = dp.backoff;
    this._syncWindupToWord();
  }

  _syncWindupToWord() {
    const dp = GAME_DATA.DIFFICULTY_PARAMS[this.difficulty];
    const [, rem] = this.word.getParts();
    this.windupSec = Math.max(this.rawWindup, rem.length * 0.065 + 0.55) * dp.wind_mult;
  }

  refreshUI(locked) {
    if (!this.alive) return;
    const [done, rem] = this.word.getParts();
    this.el.classList.toggle('locked', !!locked);
    this.nameEl.textContent = this.offscreenTag + this.displayName;
    this.phaseEl.textContent = this.totalPhases > 1 ? `${this.phase}/${this.totalPhases}` : "";
    this.jpEl.textContent = this.word.displayJp;
    this.romaEl.innerHTML = `<span class="done">${escapeHtml(done)}</span><span class="rem">${escapeHtml(rem)}</span>`;
  }

  step(playerPos, dt, isLocked, uiYOff, renderer, nowSec) {
    if (!this.alive) return null;

    // 1. Ragdoll-style spinning collapse on death
    if (this.state === "DYING") {
      this.dyingT += dt / 0.70;
      if (this.dyingT >= 1.0) { this.cleanup(); return null; }
      const fallP = Math.min(1, this.dyingT * 1.50);
      let bx = this.pos[0] - playerPos[0], bz = this.pos[2] - playerPos[2];
      const bl = Math.hypot(bx, bz) || 1;
      bx /= bl; bz /= bl;
      this.pos[0] += bx * (5.2 * (1 - this.dyingT)) * dt;
      this.pos[2] += bz * (5.2 * (1 - this.dyingT)) * dt;
      this.root.pos = this.pos.slice();
      this.rig.rot[0] = lerp(0, 92, fallP * fallP);
      this.rig.rot[1] = lerp(0, this.deathSpinDir * 48, fallP);
      this.rig.pos[1] = lerp(0, 0.22, fallP);
      this.lArm.rot[0] = lerp(this.lArm.rot[0], -145, Math.min(1, dt * 10));
      this.rArm.rot[0] = lerp(this.rArm.rot[0], -145, Math.min(1, dt * 10));
      this.lArm.rot[2] = lerp(this.lArm.rot[2], -38, Math.min(1, dt * 8));
      this.rArm.rot[2] = lerp(this.rArm.rot[2],  38, Math.min(1, dt * 8));
      return null;
    }

    const dxP = playerPos[0] - this.pos[0], dzP = playerPos[2] - this.pos[2];
    if (Math.hypot(dxP, dzP) > 0.05) {
      this.rotY = Math.atan2(dxP, dzP) * 180 / Math.PI + 180;
    }
    this.root.rot[1] = this.rotY;

    // 2. Directional Hit Flinch (alternating shoulder snap & head jolt on every typed char!)
    let flinchX = 0, flinchY = 0;
    if (this.recoilT > 0) {
      this.recoilT = Math.max(0, this.recoilT - dt);
      const fp = this.recoilT / 0.14;
      flinchX = -18 * fp;
      flinchY = this.hitSide * 22 * fp;
      this.head.rot[0] = -24 * fp;
      this.head.rot[1] = -this.hitSide * 18 * fp;
    } else {
      this.head.rot[0] = lerp(this.head.rot[0], Math.sin(nowSec * 2.1 + this.animT) * 4, Math.min(1, dt * 7));
      this.head.rot[1] = lerp(this.head.rot[1], Math.sin(nowSec * 1.4 + this.animT) * 6, Math.min(1, dt * 7));
    }

    // 3. Ambient Multi-Joint Wing / Tail / Cape / Hover Motion
    const wingSpd = this.kind === "wasp" ? 28.0 : 9.5;
    for (const [wp, s] of this.wings) {
      wp.rot[2] = s * (12 + Math.sin(nowSec * wingSpd + this.animT) * (this.kind === "wasp" ? 38 : 34));
    }
    for (const [wt, s] of this.wingTips) {
      // Phase-lagged outer wingtip fold for organic bird/dragon flight!
      wt.rot[2] = s * (8 + Math.sin(nowSec * wingSpd + this.animT - 0.85) * 28);
    }
    if (this.tailNode) {
      this.tailNode.rot[0] = Math.sin(nowSec * 4.5 + this.animT) * 14;
      this.tailNode.rot[1] = Math.cos(nowSec * 3.2 + this.animT) * 16;
    }
    if (this.capeNode) {
      const windAmp = this.state === "APPROACH" ? 24 : 9;
      this.capeNode.rot[0] = 10 + Math.sin(nowSec * 6.5 + this.animT) * windAmp;
    }
    if (this.magicRing) {
      this.magicRing.rot[2] += 115 * dt;
      if (this.magicRing2) this.magicRing2.rot[1] -= 145 * dt;
      this.rig.pos[1] = 0.45 + Math.sin(nowSec * 3.5 + this.animT) * 0.24;
    } else if (this.ghostParts.length) {
      this.rig.pos[1] = 0.35 + Math.sin(nowSec * 2.8 + this.animT) * 0.32;
      const a = (105 + 75 * (0.5 + 0.5 * Math.sin(nowSec * 4.2 + this.animT))) / 255;
      for (const gp of this.ghostParts) gp.color[3] = a;
    } else if (this.kind === "wasp") {
      this.rig.pos[1] = Math.sin(nowSec * 7.5 + this.animT) * 0.34;
    } else if (!this.spiderLegs.length && this.state !== "APPROACH") {
      // Living breathing rise/fall when standing
      this.rig.pos[1] = Math.sin(nowSec * 2.8 + this.animT) * 0.045;
    }

    // 4. EMERGE State (including Boss/Giant intimidating entrance roar!)
    if (this.state === "EMERGE") {
      this.emergeT += dt / 0.85;
      if (this.doorNode) this.doorNode.rot[1] = lerp(this.doorNode.rot[1], 105, Math.min(1, dt * 7));
      if (this.emergeT >= 1.0) {
        this.pos = this.emergeEnd.slice();
        this.startDist = Math.max(this.stopDist + 1.0, dist2d(this.pos[0], this.pos[2], playerPos[0], playerPos[2]));
        this.state = this.isRanged ? "WINDUP" : "APPROACH";
      } else {
        const s = this.emergeT * this.emergeT * (3 - 2 * this.emergeT);
        this.pos[0] = lerp(this.emergeStart[0], this.emergeEnd[0], s);
        this.pos[1] = lerp(this.emergeStart[1], this.emergeEnd[1], s);
        this.pos[2] = lerp(this.emergeStart[2], this.emergeEnd[2], s);
        if (this.isBoss || this.kind === "giant") {
          const rp = Math.sin(this.emergeT * Math.PI);
          this.spine.rot[0] = -22 * rp;
          this.head.rot[0] = -28 * rp;
          this.lArm.rot[0] = -125 * rp; this.rArm.rot[0] = -125 * rp;
        }
      }
      this.root.pos = this.pos.slice();
      this._update2DUI(isLocked, uiYOff, dt, renderer);
      return null;
    }

    // 5. STAGGER State (dramatic kneeling reel-back & recovery roar!)
    if (this.state === "STAGGER") {
      this.staggerT -= dt;
      const sp = clamp(this.staggerT / 0.85, 0, 1);
      const wv = Math.sin(sp * Math.PI);
      this.rig.pos[1] = -0.32 * wv;
      this.spine.rot[0] = -36 * wv;
      this.spine.rot[1] = Math.sin(sp * Math.PI * 2) * 18;
      this.lLeg.rot[0] = -28 * wv; this.lShin.rot[0] = 52 * wv;
      this.rLeg.rot[0] = -28 * wv; this.rShin.rot[0] = 52 * wv;
      this.lArm.rot[0] = -60 * wv; this.lArm.rot[2] = -32 * wv;
      this.rArm.rot[0] = -60 * wv; this.rArm.rot[2] =  32 * wv;
      if (this.staggerT <= 0) {
        this.rig.pos[1] = 0; this.spine.rot = [0,0,0];
        this.lArm.rot[2] = 0; this.rArm.rot[2] = 0;
        this.lShin.rot[0] = 0; this.rShin.rot[0] = 0;
        this.state = this.isRanged ? "WINDUP" : "APPROACH";
      }
      this.root.pos = this.pos.slice();
      this._update2DUI(isLocked, uiYOff, dt, renderer);
      return null;
    }

    let evOut = null;

    // 6. APPROACH State (rich per-archetype movement: evasive dashes, pounce leaps, aerial banking, heavy stomps!)
    if (this.state === "APPROACH") {
      const d = dist2d(this.pos[0], this.pos[2], playerPos[0], playerPos[2]);
      if (d > this.stopDist) {
        let dirX = (playerPos[0] - this.pos[0]) / d, dirZ = (playerPos[2] - this.pos[2]) / d;
        const sideX = -dirZ, sideZ = dirX;
        let bankRoll = 0;
        let hopY = 0;

        // Trigger special kinetic combat moves when mid-range!
        this.actionCd -= dt;
        if (this.actionCd <= 0 && d > this.stopDist + 2.8 && d < 17.0) {
          if (["runner","assassin","ghost"].includes(this.kind)) {
            this.dashT = 0.48;
            this.dashDir = Math.random() < 0.5 ? 1 : -1;
            this.actionCd = 2.4 + Math.random() * 1.8;
          } else if (["spider","crawler"].includes(this.kind)) {
            this.hopT = 0.52;
            this.actionCd = 2.2 + Math.random() * 1.8;
          } else {
            this.actionCd = 3.0;
          }
        }

        let spdNow = this.speed;
        if (this.dashT > 0) {
          this.dashT = Math.max(0, this.dashT - dt);
          const dp = Math.sin((this.dashT / 0.48) * Math.PI);
          const lat = this.dashDir * (this.kind === "ghost" ? 1.85 : 1.35) * dp;
          let mx = dirX * 0.75 + sideX * lat, mz = dirZ * 0.75 + sideZ * lat;
          const ml = Math.hypot(mx, mz) || 1;
          dirX = mx / ml; dirZ = mz / ml;
          spdNow *= (this.kind === "ghost" ? 1.85 : 1.55);
          bankRoll = -this.dashDir * 24 * dp;
        } else if (["runner","assassin","wasp","ghost","gargoyle"].includes(this.kind) || (this.isBoss && this.bossStyle === 3)) {
          const att = clamp((d - this.stopDist) / 7.5, 0, 1);
          const freq = this.kind === "wasp" ? 5.6 : (this.kind === "ghost" ? 3.2 : (this.kind === "gargoyle" ? 2.4 : 4.2));
          const amp = (this.kind === "wasp" || this.kind === "ghost") ? 0.65 : 0.44;
          const sw = Math.sin(nowSec * freq + this.animT) * amp * att;
          let mx = dirX + sideX * sw, mz = dirZ + sideZ * sw;
          const ml = Math.hypot(mx, mz) || 1;
          dirX = mx / ml; dirZ = mz / ml;
          bankRoll = -sw * 34;
        }

        if (this.hopT > 0) {
          this.hopT = Math.max(0, this.hopT - dt);
          const hp = 1.0 - (this.hopT / 0.52);
          hopY = Math.sin(hp * Math.PI) * 1.75;
          spdNow *= 1.55;
        }

        this.pos[0] += dirX * spdNow * dt;
        this.pos[2] += dirZ * spdNow * dt;

        if (this.kind === "gargoyle" || this.kind === "wasp" || (this.isBoss && this.bossStyle === 3)) {
          const diveTarget = playerPos[1] - 0.4 + Math.sin(nowSec * 2.5 + this.animT) * 0.55;
          this.pos[1] = lerp(this.pos[1], diveTarget, Math.min(1, dt * 1.8));
          this.rig.rot[2] = lerp(this.rig.rot[2], bankRoll, Math.min(1, dt * 6));
          this.rig.rot[0] = lerp(this.rig.rot[0], 14, Math.min(1, dt * 5));
        } else if (this.descendToPlayer) {
          const prog = clamp(1 - (d - this.stopDist) / Math.max(1, this.startDist - this.stopDist), 0, 1);
          this.pos[1] = lerp(this.startY, playerPos[1] - 2.2, prog) + hopY;
        } else {
          this.pos[1] = lerp(this.pos[1], this.startY, Math.min(1, dt * 5)) + hopY;
        }

        // Articulated limb gait cycles
        if (this.spiderLegs.length) {
          for (const [piv, knee, s, idx] of this.spiderLegs) {
            const ph = nowSec * 18 + idx * 1.45 + (s === 1 ? 0 : 3.14);
            piv.rot[1] = Math.sin(ph) * 26;
            piv.rot[2] = s * (Math.cos(ph) * 16 + (this.hopT > 0 ? 18 : 0));
            knee.rot[2] = s * (-Math.max(0, Math.sin(ph)) * 22);
          }
          this.spine.rot[0] = (this.hopT > 0 ? -18 : 0) + flinchX;
        } else if (!this.wings.length && !this.ghostParts.length) {
          const isFast = (this.kind === "runner" || this.kind === "assassin");
          const isHeavy = (this.kind === "giant" || this.kind === "boss" || this.kind === "shield");
          const rate = isFast ? 9.6 : (isHeavy ? 4.2 : 6.2);
          const wt = nowSec * rate + this.animT;
          const swL = Math.sin(wt), swR = -swL;

          // Hip + Knee articulation (bends knee naturally during leg swing!)
          this.lLeg.rot[0] = swL * (isFast ? 46 : 34);
          this.rLeg.rot[0] = swR * (isFast ? 46 : 34);
          this.lShin.rot[0] = Math.max(0, -swL) * (isFast ? 52 : 34);
          this.rShin.rot[0] = Math.max(0, -swR) * (isFast ? 52 : 34);

          // Spine counter-twist + sprint forward lean + flinch
          this.spine.rot[0] = (isFast ? 22 : (this.kind === "walker" ? 12 : 7)) + flinchX;
          this.spine.rot[1] = swL * (isHeavy ? 14 : 10) + flinchY;
          this.spine.rot[2] = bankRoll + Math.cos(wt) * (isHeavy ? 6 : 3.5);

          // Shoulder + Elbow articulation
          if (this.kind === "shield" || (this.isBoss && this.bossStyle === 1)) {
            this.lArm.rot[0] = -42 + swL * 6; this.lForearm.rot[0] = -32;
            this.rArm.rot[0] = -18 + swR * 18; this.rForearm.rot[0] = -28;
          } else {
            this.lArm.rot[0] = -22 + swR * (isFast ? 42 : 24);
            this.rArm.rot[0] = -28 + swL * (isFast ? 42 : 24);
            this.lForearm.rot[0] = isFast ? -58 : -32;
            this.rForearm.rot[0] = isFast ? -52 : -36;
          }
          if (!this.magicRing) this.rig.pos[1] = Math.abs(Math.sin(wt)) * (isHeavy ? 0.16 : 0.11);
          if (this.kind === "giant" || this.isBoss) {
            this.stepShakeCd -= dt;
            if (this.stepShakeCd <= 0 && Math.abs(Math.sin(wt)) < 0.14) {
              this.stepShakeCd = 0.72;
              FX.addShake(0.14, this.isBoss ? 0.42 : 0.30);
            }
          }
        } else {
          this.spine.rot[0] = flinchX;
          this.spine.rot[1] = flinchY;
          this.rig.rot[2] = lerp(this.rig.rot[2], bankRoll, Math.min(1, dt * 6));
        }
      } else {
        this.state = "WINDUP";
        this.windupT = 0;
        this.lastBeat = -1;
        this.slashSpawned = false;
      }
    } else if (this.state === "WINDUP") {
      // 7. Coiling Telegraph Windup (full spine twist + weapon raised high + breathing anticipation)
      this.windupT += dt / this.windupSec;
      const wp = clamp(this.windupT, 0, 1);
      const coil = Math.sin(wp * Math.PI * 0.5);
      this.rig.rot[2] = lerp(this.rig.rot[2], 0, Math.min(1, dt * 6));
      this.lLeg.rot[0] = lerp(this.lLeg.rot[0], -16 * coil, Math.min(1, dt * 5));
      this.rLeg.rot[0] = lerp(this.rLeg.rot[0],  18 * coil, Math.min(1, dt * 5));
      this.lShin.rot[0] = lerp(this.lShin.rot[0], 18 * coil, Math.min(1, dt * 5));
      this.rShin.rot[0] = lerp(this.rShin.rot[0], 12 * coil, Math.min(1, dt * 5));

      if (!this.isRanged) {
        this.spine.rot[0] = lerp(this.spine.rot[0], -18 * coil + flinchX, Math.min(1, dt * 7));
        this.spine.rot[1] = lerp(this.spine.rot[1], -38 * coil + flinchY, Math.min(1, dt * 7));
        this.rArm.rot[0] = lerp(this.rArm.rot[0], -152 * coil, Math.min(1, dt * 5));
        this.rForearm.rot[0] = lerp(this.rForearm.rot[0], -36 * coil, Math.min(1, dt * 5));
        this.lArm.rot[0] = lerp(this.lArm.rot[0], -52 * coil, Math.min(1, dt * 5));
      } else {
        this.spine.rot[0] = lerp(this.spine.rot[0], -6 * coil + flinchX, Math.min(1, dt * 6));
        this.spine.rot[1] = lerp(this.spine.rot[1], flinchY, Math.min(1, dt * 6));
        this.rArm.rot[0] = lerp(this.rArm.rot[0], -92 - Math.sin(nowSec * 14) * 5 * wp, Math.min(1, dt * 6));
      }

      if (this.windupT > 0.45) {
        const iv = this.windupT < 0.78 ? 0.85 : 0.45;
        const bIdx = Math.floor(this.windupT * this.windupSec / iv);
        if (bIdx !== this.lastBeat) {
          this.lastBeat = bIdx;
          AUDIO.playSfx('warn');
        }
      }
      if (this.windupT >= 1.0) {
        this.windupT = 0;
        const throwProj = this.kind === "bomber" || this.kind === "necromancer"
          || (this.kind === "giant" && Math.random() < 0.5)
          || (this.kind === "spider" && Math.random() < 0.45)
          || (this.kind === "boss" && Math.random() < 0.55);
        if (throwProj) {
          this.rArm.rot[0] = 28;
          this.spine.rot[1] = 24;
          this.state = this.isRanged ? "WINDUP" : "APPROACH";
          const pk = this.kind === "bomber" ? "axe" : (this.kind === "giant" ? "rock" : (this.kind === "spider" ? "venom" : "orb"));
          const ey = this.isBoss ? 4.6 : (this.kind === "giant" ? 2.6 : 1.5);
          evOut = ["SPAWN_PROJ", pk, [this.pos[0], this.pos[1] + ey, this.pos[2]]];
        } else {
          this.state = "STRIKE";
          this.strikeT = 0;
          this.slashSpawned = false;
          evOut = ["STRIKE_PLAYER", null, null];
        }
      }
    } else if (this.state === "STRIKE") {
      // 8. Explosive Lunging Strike + 3D Glowing Slash Arc!
      this.strikeT += dt / 0.28;
      const stP = Math.min(1, this.strikeT * 2.1);
      this.spine.rot[0] = lerp(-18, 28, stP);
      this.spine.rot[1] = lerp(-38, 48, stP);
      this.rArm.rot[0] = lerp(-152, 42, stP);
      this.rForearm.rot[0] = lerp(-36, 12, stP);
      if (!this.slashSpawned && this.strikeT >= 0.22) {
        this.slashSpawned = true;
        const scMul = this.isBoss ? 2.2 : (this.kind === "giant" ? 1.55 : 1.0);
        const h = this.isBoss ? 3.2 : (this.kind === "giant" ? 2.2 : 1.45);
        const fx = (playerPos[0] + this.pos[0]) * 0.5, fz = (playerPos[2] + this.pos[2]) * 0.5;
        FX.spawnSlashArc([fx, this.pos[1] + h, fz], this.rotY, [this.eyeColor[0], this.eyeColor[1], this.eyeColor[2], 0.85], scMul);
      }
      if (this.strikeT >= 1.0) {
        this.state = this.isRanged ? "WINDUP" : "APPROACH";
        this.spine.rot = [0, 0, 0];
        if (!this.isRanged) {
          let bx = this.pos[0] - playerPos[0], bz = this.pos[2] - playerPos[2];
          const bl = Math.hypot(bx, bz) || 1;
          this.pos[0] += (bx / bl) * this.backoffDist;
          this.pos[2] += (bz / bl) * this.backoffDist;
        }
      }
    }

    this.root.pos = this.pos.slice();
    this._update2DUI(isLocked, uiYOff, dt, renderer);
    return evOut;
  }

  _update2DUI(isLocked, uiYOff, dt, renderer) {
    if (!this.targetable) {
      this.el.style.display = 'none';
      this.warnEl.style.display = 'none';
      return;
    }
    const hOff = this.isBoss ? 6.4 : (this.kind === "giant" ? 4.2 : ((this.kind === "crawler" || this.kind === "spider") ? 1.5 : 2.45));
    const sp = renderer.projectWorldToScreen(this.pos[0], this.pos[1] + hOff, this.pos[2]);
    let tx, ty, tag = "";
    if (sp.inFront) {
      tx = clamp(sp.x, 0.14, 0.86);
      ty = clamp(sp.y + uiYOff, 0.16, 0.84);
      if (sp.x < 0.08) tag = "◀ ";
      else if (sp.x > 0.92) tag = "▶ ";
    } else {
      tx = sp.side > 0 ? 0.85 : 0.15;
      ty = clamp(0.45 + uiYOff, 0.20, 0.78);
      tag = sp.side > 0 ? "▶ " : "◀ ";
    }
    if (tag !== this.offscreenTag) {
      this.offscreenTag = tag;
      this.nameEl.textContent = tag + this.displayName;
    }
    if (!this.uiInit) {
      this.uiX = tx; this.uiY = ty; this.uiInit = true;
      this.el.style.display = 'block';
    } else {
      const a = 1 - Math.exp(-18 * dt);
      this.uiX = lerp(this.uiX, tx, a);
      this.uiY = lerp(this.uiY, ty, a);
    }
    this.el.style.left = (this.uiX * 100).toFixed(2) + '%';
    this.el.style.top = (this.uiY * 100).toFixed(2) + '%';
    this.el.style.zIndex = isLocked ? '14' : '8';

    if (this.state === "WINDUP") {
      const cp = renderer.projectWorldToScreen(this.pos[0], this.pos[1] + hOff * 0.55, this.pos[2]);
      const wx = cp.inFront ? clamp(cp.x, 0.15, 0.85) : this.uiX;
      const wy = cp.inFront ? clamp(cp.y, 0.16, 0.84) : Math.min(0.86, this.uiY + 0.12);
      this.warnEl.style.display = 'block';
      this.warnEl.style.left = (wx * 100).toFixed(2) + '%';
      this.warnEl.style.top = (wy * 100).toFixed(2) + '%';
      const boxPx = Math.round(lerp(130, 32, this.windupT));
      this.warnBox.style.width = boxPx + 'px';
      this.warnBox.style.height = boxPx + 'px';
      const remS = Math.max(0, (1 - this.windupT) * this.windupSec);
      this.warnTxt.textContent = `こうげき ${remS.toFixed(1)}s`;
    } else {
      this.warnEl.style.display = 'none';
    }
  }

  getHitPos() {
    const h = this.isBoss ? 3.6 : (this.kind === "giant" ? 2.4 : 1.5);
    return [this.pos[0] + (Math.random()*2-1)*0.25, this.pos[1] + h, this.pos[2] + (Math.random()*2-1)*0.2];
  }

  onHitChar() {
    if (!this.alive) return;
    this.recoilT = 0.14;
    this.hitSide = -this.hitSide;
    if (this.state === "WINDUP") this.windupT = Math.max(0, this.windupT - 0.10);
    FX.spawnHitSmoke(this.getHitPos());
  }

  onWordCompleted() {
    if (this.wordQueue.length) {
      AUDIO.playSfx('stagger');
      if (this.shieldNode) {
        const m = this.shieldNode.worldMat;
        FX.spawnDebris([m[12], m[13], m[14]], [0.82,1.28,0.14], cRGBA(145,155,168), [-5.5,3.6,2.4], [320,420,210], 0.55);
        this.shieldNode.enabled = false;
        this.shieldNode = null;
      }
      this.word = this.wordQueue.shift();
      this._syncWindupToWord();
      this.phase += 1;
      this.state = "STAGGER";
      this.staggerT = 0.85;
      this.windupT = 0;
      this.refreshUI(true);
      return false;
    } else {
      AUDIO.playSfx('kill');
      this.targetable = false;
      this.el.style.display = 'none';
      this.warnEl.style.display = 'none';
      if (this.kind === "skeleton") {
        const cp = [this.pos[0], this.pos[1] + 1.2, this.pos[2]];
        for (let i = 0; i < 8; i++) {
          FX.spawnDebris(
            cp, [0.10,0.45,0.10], cRGBA(228,224,210),
            [(Math.random()*2-1)*4.2, 1.0 + Math.random()*4.2, (Math.random()*2-1)*4.2],
            [180+Math.random()*300, 180+Math.random()*300, 180+Math.random()*300],
            0.55
          );
        }
        this.cleanup();
        return true;
      }
      this.state = "DYING";
      this.dyingT = 0;
      return true;
    }
  }

  cleanup() {
    if (!this.alive) return;
    this.alive = false;
    this.targetable = false;
    if (this.el && this.el.parentNode) this.el.parentNode.removeChild(this.el);
    if (this.warnEl && this.warnEl.parentNode) this.warnEl.parentNode.removeChild(this.warnEl);
  }
}

// =====================================================================
// 6. 5ステージ×13区間 リアル3Dコースビルダー（円柱・装飾・動的ポイントライト登録）
// =====================================================================
function buildLongStageCourse(stageNum, qualityLevel, renderer) {
  const q = GAME_DATA.QUALITY_PRESETS[qualityLevel];
  const th = GAME_DATA.STAGE_THEMES[stageNum];
  const rng = makeRng(stageNum * 997 + 13);
  const randRange = (a, b) => a + rng() * (b - a);
  const choice = (arr) => arr[Math.floor(rng() * arr.length)];

  const hazeColors = {
    1: [0.78, 0.89, 0.94],
    2: [0.76, 0.73, 0.70],
    3: [0.72, 0.87, 0.97],
    4: [0.14, 0.25, 0.39],
    5: [0.92, 0.66, 0.47],
  };
  const hazeCol = hazeColors[stageNum] || hazeColors[1];
  const groundTint = cRGBA(...th.ground_tint);
  const pathTint = cRGBA(...th.path_tint);
  const sunCol = cRGBA(...th.sun_color);
  const moteCol = cRGBA(...th.mote_color);

  const globalBgItems = [];
  const globalFxNodes = [];
  const segBatches = [];
  const segFxLists = [];
  const segDoors = [];
  const segLights = [];
  const doors = {};
  const healPositions = [];
  const encounters = [];
  const motes = [];

  const pushStatic = (list, parentMat, opts) => {
    const pos = opts.pos || [0,0,0];
    const rot = opts.rot || [0,0,0];
    const sc = typeof opts.scale === 'number' ? [opts.scale, opts.scale, opts.scale] : (opts.scale || [1,1,1]);
    const lm = M4.fromTRS(pos[0], pos[1], pos[2], rot[0], rot[1], rot[2], sc[0], sc[1], sc[2]);
    const wm = parentMat ? M4.mul(parentMat, lm) : lm;
    list.push({
      model: opts.model,
      worldMat: wm,
      tex: opts.tex || 'white',
      color: opts.color || [1,1,1,1],
      uvScale: opts.uvScale || [1,1],
    });
  };

  // =========================================================================
  // PASS 1: Precompute ALL 13 Segment Centerlines + Boss Arena Bounding Box
  //         so EVERY mountain, house, pillar, tower & tree is mathematically
  //         guaranteed NEVER to clip the camera rail or Boss Arena!
  // =========================================================================
  const rooms = th.rooms;
  const segLen = 28.0;
  const segPlans = [];
  {
    let cp = [0, 0, 0], cy = 0;
    for (let idx = 0; idx < 13; idx++) {
      const isBossWave = (idx === 12);
      const rm = rooms[idx];
      const nextYaw = cy + GAME_DATA.TURN_PATTERNS[stageNum - 1][idx];
      const nextY = GAME_DATA.ELEV_PATTERNS[stageNum - 1][idx];
      const rad = nextYaw * Math.PI / 180;
      const fwd = [Math.sin(rad), 0, Math.cos(rad)];
      const right = [Math.cos(rad), 0, -Math.sin(rad)];
      const segStart = cp.slice();
      const segEnd = [cp[0] + fwd[0]*segLen, nextY, cp[2] + fwd[2]*segLen];
      const pathW = isBossWave ? 18.0 : ((rm === "dining" || rm === "library") ? 14.5 : ((rm === "hall" || rm === "crystal") ? 10.4 : 9.4));
      segPlans.push({ idx, isBossWave, rm, segStart, segEnd, nextYaw, prevYaw: cy, fwd, right, pathW });
      cp = segEnd;
      cy = nextYaw;
    }
  }
  const bossPlan = segPlans[12];
  const bossArenaCenter = [
    bossPlan.segStart[0] + bossPlan.fwd[0] * 22.0,
    bossPlan.segStart[1],
    bossPlan.segStart[2] + bossPlan.fwd[2] * 22.0
  ];

  // Exact 2D distance from point (px, pz) to any road centerline or Boss Arena
  const ptSegDist2D = (px, pz, ax, az, bx, bz) => {
    const dx = bx - ax, dz = bz - az;
    const l2 = dx*dx + dz*dz;
    const t = l2 > 1e-6 ? clamp(((px - ax)*dx + (pz - az)*dz) / l2, 0, 1) : 0;
    return Math.hypot(px - (ax + dx*t), pz - (az + dz*t));
  };
  const minDistToCourse = (px, pz, skipSegIdx = -1) => {
    let best = dist2d(px, pz, bossArenaCenter[0], bossArenaCenter[2]) - 15.0; // keep clear of 32x32 boss arena
    for (let i = 0; i < segPlans.length; i++) {
      if (i === skipSegIdx) continue;
      const s = segPlans[i];
      const d = ptSegDist2D(px, pz, s.segStart[0], s.segStart[2], s.segEnd[0], s.segEnd[2]) - (s.pathW * 0.5);
      if (d < best) best = d;
    }
    return best;
  };
  const isClearOfAllRoads = (px, pz, objRadius) => minDistToCourse(px, pz, -1) > objRadius;

  // Compute exact course bounding center & radius for safe horizon mountain placement!
  let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
  for (const s of segPlans) {
    for (const pt of [s.segStart, s.segEnd]) {
      if (pt[0] < minX) minX = pt[0]; if (pt[0] > maxX) maxX = pt[0];
      if (pt[2] < minZ) minZ = pt[2]; if (pt[2] > maxZ) maxZ = pt[2];
    }
  }
  const courseCx = (minX + maxX) * 0.5;
  const courseCz = (minZ + maxZ) * 0.5;
  const courseRad = Math.hypot((maxX - minX) * 0.5, (maxZ - minZ) * 0.5) + 45.0;

  const hasOutdoor = rooms.some(r => r === "forest" || r === "village" || r === "bridge");

  if (hasOutdoor) {
    if (q.fx_glow) {
      const sunPos = stageNum !== 5 ? [courseCx + 140, 110, maxZ + 180] : [courseCx, 46, maxZ + 220];
      globalFxNodes.push(new Node3D({ model:lodModel('sphere'), pos:sunPos, scale:18, color:sunCol, useFog:false, shade:false, castShadow:false }));
      globalFxNodes.push(new Node3D({ model:'quad', billboard:true, additive:true, pos:sunPos, scale:[78,78,1], tex:'soft_glow', color:cRGBA(255,248,225,180), useFog:false, shade:false, castShadow:false }));
    }
    const mtnCnt = q.mountains;
    if (mtnCnt > 0) {
      const mtnCol = (stageNum === 1 || stageNum === 3) ? cRGBA(118,152,168) : (stageNum === 5 ? cRGBA(126,94,96) : cRGBA(98,112,134));
      const mtnFar = (stageNum === 1 || stageNum === 3) ? cRGBA(142,174,192) : (stageNum === 5 ? cRGBA(158,112,92) : cRGBA(118,128,148));
      const step = Math.max(15, Math.floor(360 / mtnCnt));
      for (let ang = 0; ang < 360; ang += step) {
        const ar = ang * Math.PI / 180;
        const mw = randRange(54, 92);
        const mh = randRange(48, 96);
        // Place well outside the ENTIRE stage bounding circle + check exact clearance from every segment & boss arena!
        const dr = courseRad + randRange(75, 115);
        const mx = courseCx + Math.cos(ar) * dr;
        const mz = courseCz + Math.sin(ar) * dr;
        if (minDistToCourse(mx, mz, -1) > mw * 0.72 + 48.0) {
          pushStatic(globalBgItems, null, { model:'cone', pos:[mx, mh*0.42 - 14, mz], scale:[mw, mh, mw], tex:'rock', color:(ang % (step*2) === 0) ? mtnCol : mtnFar });
        }
      }
    }
  }

  for (let i = 0; i < q.motes; i++) {
    const m = new Node3D({
      model:'quad', billboard:true, additive:true, tex:'soft_glow',
      scale: randRange(0.16, 0.30), color:[moteCol[0], moteCol[1], moteCol[2], 0.52],
      useFog:false, shade:false, castShadow:false
    });
    globalFxNodes.push(m);
    motes.push([m, [randRange(-9, 9), randRange(0.6, 5.2), randRange(4, 22)], randRange(0, 6.28)]);
  }

  // Grounded sculpted trees with deep root anchor
  const addTree = (list, pos, hSc) => {
    if (!isClearOfAllRoads(pos[0], pos[2], 2.2 * hSc)) return;
    const tm = M4.fromTRS(pos[0], pos[1], pos[2], 0, 0, 0, 1, 1, 1);
    const h = 6.0 * hSc;
    const botY = -2.8;
    const trunkH = h - botY, trunkY = (h + botY) * 0.5, w = 0.88 * hSc;
    const mode = q.tree_mode;
    const leaves = stageNum !== 5 ? [cRGBA(54,118,46), cRGBA(72,142,58), cRGBA(40,94,36)] : [cRGBA(192,98,46), cRGBA(222,138,54), cRGBA(154,68,38)];
    pushStatic(list, tm, { model: mode === "min" ? 'cube' : 'taper', pos:[0,trunkY,0], scale:[w,trunkH,w], tex:'bark', uvScale:[2,3], color:cRGBA(210,192,175) });
    if (mode === "full") {
      for (const [ox,oy,oz,rad] of [[0,h,0,3.1],[-1.4,h-0.8,0.9,2.4],[1.4,h-0.6,-0.9,2.5],[0.3,h+1.1,0.2,2.2],[-0.8,h-1.5,-1.0,2.0]]) {
        pushStatic(list, tm, { model:'sphere', pos:[ox*hSc,oy,oz*hSc], scale:[rad*hSc,rad*0.72*hSc,rad*hSc], tex:'grass', color:choice(leaves) });
      }
      pushStatic(list, tm, { model:'sphere', pos:[0.8,-0.15,0.5], scale:[1.6,0.95,1.4], tex:'grass', color:leaves[2] });
    } else if (mode === "mid") {
      for (const [ox,oy,oz,rad] of [[0,h+0.2,0,3.3],[-1.3,h-0.8,0.8,2.4],[1.3,h-0.6,-0.8,2.4]]) {
        pushStatic(list, tm, { model:'sphere', pos:[ox*hSc,oy,oz*hSc], scale:[rad*hSc,rad*0.74*hSc,rad*hSc], tex:'grass', color:choice(leaves) });
      }
    } else if (mode === "low") {
      pushStatic(list, tm, { model:'sphere', pos:[0,h+0.2,0], scale:[3.4*hSc,2.5*hSc,3.4*hSc], tex:'grass', color:leaves[0] });
      pushStatic(list, tm, { model:'sphere', pos:[0.9*hSc,h-0.9,-0.6*hSc], scale:[2.3*hSc,1.8*hSc,2.3*hSc], tex:'grass', color:leaves[1] });
    } else if (mode === "box") {
      pushStatic(list, tm, { model:'cube', pos:[0,h,0], rot:[0,20,0], scale:[3.2*hSc,2.1*hSc,3.2*hSc], color:leaves[0] });
      pushStatic(list, tm, { model:'cube', pos:[0,h+1.2*hSc,0], rot:[0,55,0], scale:[2.2*hSc,1.5*hSc,2.2*hSc], color:leaves[1] });
    } else {
      pushStatic(list, tm, { model:'cube', pos:[0,h,0], rot:[0,25,0], scale:[3.1*hSc,2.3*hSc,3.1*hSc], color:leaves[0] });
    }
  };

  // Roadside rustic wooden fence for outdoor visual richness
  const addRoadFence = (list, pos, yawDeg, len = 5.4) => {
    if (q.props === "min") return;
    const fm = M4.fromTRS(pos[0], pos[1], pos[2], 0, yawDeg, 0, 1, 1, 1);
    for (const pz of [-len*0.42, 0, len*0.42]) {
      pushStatic(list, fm, { model:'cube', pos:[0, 0.45, pz], scale:[0.16, 1.35, 0.16], tex:'wood', color:cRGBA(136,102,72) });
    }
    pushStatic(list, fm, { model:'cube', pos:[0, 0.82, 0], scale:[0.09, 0.12, len], tex:'wood', color:cRGBA(148,112,78) });
    pushStatic(list, fm, { model:'cube', pos:[0, 0.44, 0], scale:[0.09, 0.12, len], tex:'wood', color:cRGBA(142,106,74) });
  };

  const addSunbeam = (fxList, orig, flr, yawDeg, tint, beamW = 2.8, alpha = 0.34) => {
    const cnt = q.sunbeams;
    if (cnt <= 0) return;
    const mid = [(orig[0]+flr[0])*0.5, (orig[1]+flr[1])*0.5, (orig[2]+flr[2])*0.5];
    const len = dist3d(orig[0],orig[1],orig[2], flr[0],flr[1],flr[2]);
    const az = (orig[0] - flr[0]) >= 0 ? 24 : -24;
    fxList.push(new Node3D({
      model:'quad', additive:true, pos:mid, rot:[0, yawDeg, az], scale:[beamW, len, 1],
      tex:'soft_beam', color:[tint[0], tint[1], tint[2], alpha], useFog:false, shade:false, castShadow:false
    }));
    fxList.push(new Node3D({
      model:'quad', additive:true, pos:[flr[0], flr[1]+0.06, flr[2]], rot:[90, 0, 0],
      scale:[beamW*1.4, beamW*1.1, 1], tex:'soft_glow',
      color:[tint[0], tint[1], tint[2], alpha * 0.72], useFog:false, shade:false, castShadow:false
    }));
  };

  const addLamp = (list, fxList, lightList, pos, yawDeg) => {
    if (q.props === "min") return;
    const lm = M4.fromTRS(pos[0], pos[1], pos[2], 0, yawDeg, 0, 1, 1, 1);
    pushStatic(list, lm, { model:'cube', pos:[0,-0.45,0], scale:[0.62,1.5,0.62], tex:'stone', color:cRGBA(145,142,136) });
    pushStatic(list, lm, { model:'cylinder', pos:[0,1.95,0], scale:[0.16,3.7,0.16], tex:'metal', color:cRGBA(54,60,68) });
    pushStatic(list, lm, { model:'cube', pos:[0,3.95,0], scale:[0.42,0.52,0.42], tex:'lantern', color:cRGBA(255,238,185) });
    pushStatic(list, lm, { model:'cone', pos:[0,4.35,0], scale:[0.62,0.34,0.62], tex:'metal', color:cRGBA(46,50,58) });
    if (q.fx_glow && q.props === "full") {
      fxList.push(new Node3D({ model:'quad', billboard:true, additive:true, pos:[pos[0],pos[1]+3.95,pos[2]], scale:[2.2,2.2,1], tex:'soft_glow', color:cRGBA(255,222,145,125), useFog:false, shade:false, castShadow:false }));
    }
    lightList.push({ pos:[pos[0], pos[1]+3.8, pos[2]], col:[1.45, 1.15, 0.65], radius:15.0, flicker:0.06, ph:rng()*6.28 });
  };

  // Flush Indoor Castle Side-Doorway (embedded right in hallway wall — NEVER puts a cottage inside a mansion!)
  const addIndoorDoorway = (list, doorNodeList, pos, yawDeg, doorId) => {
    const dm = M4.fromTRS(pos[0], pos[1], pos[2], 0, yawDeg, 0, 1, 1, 1);
    // Stone doorframe surround
    pushStatic(list, dm, { model:'cube', pos:[-1.18, 1.65, 0], scale:[0.42, 3.3, 0.45], tex:'stone', color:cRGBA(158,152,146) });
    pushStatic(list, dm, { model:'cube', pos:[ 1.18, 1.65, 0], scale:[0.42, 3.3, 0.45], tex:'stone', color:cRGBA(158,152,146) });
    pushStatic(list, dm, { model:'cube', pos:[0, 3.38, 0], scale:[2.80, 0.45, 0.50], tex:'stone', color:cRGBA(168,162,154) });
    // Dark recessed doorway interior
    pushStatic(list, dm, { model:'quad', pos:[0, 1.55, -0.02], scale:[1.95, 3.1, 1], color:cRGBA(10,12,16) });
    // Hinged heavy oak & iron door that swings open when enemy bursts out!
    const doorRoot = new Node3D({ pos, rot:[0, yawDeg, 0] });
    const hinge = doorRoot.addChild({ pos:[-0.96, 1.55, -0.08] });
    hinge.addChild({ model:'cube', pos:[0.96, 0, 0], scale:[1.92, 3.05, 0.14], tex:'wood', color:cRGBA(118,86,58) });
    hinge.addChild({ model:'cube', pos:[0.96, 0.72, -0.08], scale:[1.84, 0.14, 0.04], tex:'metal', mat:MAT.STEEL, color:cRGBA(72,78,86) });
    hinge.addChild({ model:'cube', pos:[0.96, -0.68, -0.08], scale:[1.84, 0.14, 0.04], tex:'metal', mat:MAT.STEEL, color:cRGBA(72,78,86) });
    doors[doorId] = hinge;
    doorNodeList.push(doorRoot);
  };

  // 4 Distinct Grounded European/Fantasy Village House Styles
  let houseSeq = 0;
  const houseStyles = [
    { wallTex:'plaster', wallCol:cRGBA(232,224,210), roofCol:cRGBA(198,118,88),  trimCol:cRGBA(158,154,146), w:6.8, h:5.0, d:5.6, chimSide: 1, winCount:2 },
    { wallTex:'stone',   wallCol:cRGBA(195,192,184), roofCol:cRGBA(116,124,136), trimCol:cRGBA(148,144,136), w:7.4, h:5.4, d:6.0, chimSide:-1, winCount:2 },
    { wallTex:'wood',    wallCol:cRGBA(196,174,148), roofCol:cRGBA(110,126,96),  trimCol:cRGBA(152,148,138), w:6.2, h:4.6, d:5.2, chimSide: 0, winCount:1 },
    { wallTex:'brick',   wallCol:cRGBA(206,178,162), roofCol:cRGBA(136,102,88),  trimCol:cRGBA(168,162,152), w:7.2, h:5.8, d:5.8, chimSide: 1, winCount:2 },
  ];

  const addHouse = (list, doorNodeList, pos, yawDeg, doorId = null, forceBuild = false) => {
    const st = houseStyles[houseSeq % houseStyles.length];
    const vSeed = houseSeq++;
    const w = st.w, h = st.h, d = st.d;
    // Never allow a scenic house to overlap ANY curved road segment!
    if (!forceBuild && !isClearOfAllRoads(pos[0], pos[2], Math.max(w, d) * 0.56)) return;
    const hm = M4.fromTRS(pos[0], pos[1], pos[2], 0, yawDeg, 0, 1, 1, 1);

    pushStatic(list, hm, { model:'cube', pos:[0, -1.1, 0], scale:[w + 0.35, 3.0, d + 0.35], tex:'stone', uvScale:[3,2], color:st.trimCol });
    pushStatic(list, hm, { model:'cube', pos:[0, h*0.5, 0], scale:[w, h, d], tex:st.wallTex, uvScale:[2,2], color:st.wallCol });

    const gableH = w * 0.29;
    pushStatic(list, hm, { model:'gable', pos:[0, h, 0], scale:[w, gableH, d], tex:st.wallTex, uvScale:[2,1], color:st.wallCol });

    const roofAngle = Math.atan2(gableH, w * 0.5) * 180 / Math.PI;
    const slopeLen = Math.hypot(w * 0.5 + 0.45, gableH + 0.25);
    const roofMidY = h + gableH * 0.5 + 0.08;
    pushStatic(list, hm, { model:'cube', pos:[-(w*0.25 + 0.14), roofMidY, 0], rot:[0,0,roofAngle],  scale:[slopeLen, 0.30, d + 0.85], tex:'roof', uvScale:[2,3], color:st.roofCol });
    pushStatic(list, hm, { model:'cube', pos:[ (w*0.25 + 0.14), roofMidY, 0], rot:[0,0,-roofAngle], scale:[slopeLen, 0.30, d + 0.85], tex:'roof', uvScale:[2,3], color:st.roofCol });
    pushStatic(list, hm, { model:'cube', pos:[0, h + gableH + 0.12, 0], scale:[0.38, 0.32, d + 0.92], tex:'wood', color:cRGBA(98,74,56) });

    if (q.props !== "min") {
      if (st.chimSide !== 0) {
        pushStatic(list, hm, { model:'cube', pos:[st.chimSide * (w*0.28), h + gableH*0.85 + 0.8, d*0.20], scale:[0.92, 2.4, 0.92], tex:'brick', color:cRGBA(168,148,138) });
      }
      if (vSeed % 3 === 0) {
        pushStatic(list, hm, { model:'cube', pos:[-(w*0.36), 0.46, -(d*0.5 + 0.52)], rot:[0,12,0], scale:[0.92,0.92,0.92], tex:'crate' });
      } else if (vSeed % 3 === 1) {
        pushStatic(list, hm, { model:'cylinder', pos:[(w*0.35), 0.50, -(d*0.5 + 0.48)], scale:[0.72,1.0,0.72], tex:'wood', color:cRGBA(142,98,64) });
      }
    }

    const frontZ = -(d * 0.5 + 0.04);
    const winTexA = (vSeed % 2 === 0) ? 'window_warm' : 'window_dark';
    const winTexB = (vSeed % 3 === 0) ? 'window_dark' : 'window_warm';
    if (doorId) {
      pushStatic(list, hm, { model:'quad', pos:[w*0.31, 2.55, frontZ], scale:[1.15, 1.25, 1], tex:winTexA });
      if (st.winCount >= 2) {
        pushStatic(list, hm, { model:'quad', pos:[-w*0.31, 2.55, frontZ], scale:[1.15, 1.25, 1], tex:winTexB });
      }
      pushStatic(list, hm, { model:'quad', pos:[0, 1.5, frontZ], scale:[1.9, 3.0, 1], color:cRGBA(14,14,18) });
      const houseRoot = new Node3D({ pos, rot:[0, yawDeg, 0] });
      const hinge = houseRoot.addChild({ pos:[-0.95, 1.5, frontZ - 0.05] });
      hinge.addChild({ model:'cube', pos:[0.95, 0, 0], scale:[1.9, 3.0, 0.14], tex:'wood', color:cRGBA(158,124,90) });
      doors[doorId] = hinge;
      doorNodeList.push(houseRoot);
    } else {
      pushStatic(list, hm, { model:'quad', pos:[w*0.26, h*0.54, frontZ], scale:[1.2, 1.3, 1], tex:winTexA });
      if (st.winCount >= 2) {
        pushStatic(list, hm, { model:'quad', pos:[-w*0.26, h*0.54, frontZ], scale:[1.2, 1.3, 1], tex:winTexB });
      }
      if (h >= 5.4) {
        pushStatic(list, hm, { model:'quad', pos:[0, h + gableH*0.42, frontZ], scale:[0.95, 0.95, 1], tex:winTexB });
      }
      pushStatic(list, hm, { model:'cube', pos:[0, 1.35, frontZ + 0.02], scale:[1.45, 2.7, 0.12], tex:'wood', color:cRGBA(118,86,58) });
    }
  };

  const addArch = (list, pos, yawDeg, width, height = 7.4, col = cRGBA(198,192,182)) => {
    const am = M4.fromTRS(pos[0], pos[1], pos[2], 0, yawDeg, 0, 1, 1, 1);
    const hw = width * 0.5 + 0.45;
    for (const s of [-1, 1]) {
      pushStatic(list, am, { model: q.props === "min" ? 'cube' : 'cylinder', pos:[s*hw, (height - 1.6)*0.5, 0], scale:[1.35, height + 1.6, 1.35], tex:'brick', uvScale:[2,3], color:col });
      if (q.props !== "min") {
        pushStatic(list, am, { model:'cube', pos:[s*hw, -0.35, 0], scale:[1.72, 1.8, 1.72], tex:'stone', color:col });
        pushStatic(list, am, { model:'cube', pos:[s*hw, height-0.25, 0], scale:[1.72, 0.55, 1.72], tex:'stone', color:col });
      }
    }
    pushStatic(list, am, { model:'cube', pos:[0, height+0.5, 0], scale:[width+2.7, 1.3, 1.55], tex:'stone', uvScale:[4,1], color:col });
    if (q.props !== "min") {
      pushStatic(list, am, { model:'cube', pos:[0, height+0.5, -0.80], scale:[1.25, 1.65, 0.28], tex:'stone', color:cRGBA(228,218,198) });
    }
  };

  const addDining = (list, fxList, lightList, pos, yawDeg) => {
    const dm = M4.fromTRS(pos[0], pos[1], pos[2], 0, yawDeg, 0, 1, 1, 1);
    pushStatic(list, dm, { model:'cube', pos:[0,0.88,0], scale:[2.2,0.12,4.8], tex:'wood', color:cRGBA(145,95,62) });
    pushStatic(list, dm, { model:'cube', pos:[0,0.96,0], scale:[1.2,0.04,4.4], tex:'carpet', color:cRGBA(185,55,58) });
    for (const lx of [-0.85,0.85]) for (const lz of [-2.0,2.0]) {
      pushStatic(list, dm, { model:'cylinder', pos:[lx,0.44,lz], scale:[0.14,0.88,0.14], tex:'wood', color:cRGBA(95,62,40) });
    }
    if (q.props === "min") return;
    const ry = yawDeg * Math.PI / 180;
    const czs = q.props === "full" ? [-1.5, 0.0, 1.5] : [0.0];
    for (const cz of czs) {
      pushStatic(list, dm, { model:'cylinder', pos:[0,1.08,cz], scale:[0.07,0.24,0.07], color:cRGBA(245,238,215) });
      if (q.fx_glow) {
        fxList.push(new Node3D({ model:'quad', billboard:true, additive:true, pos:[pos[0]+Math.sin(ry)*cz, pos[1]+1.28, pos[2]+Math.cos(ry)*cz], scale:[0.95,0.95,1], tex:'soft_glow', color:cRGBA(255,205,105,130), useFog:false, shade:false, castShadow:false }));
      }
      for (const sx of [-1.45, 1.45]) {
        pushStatic(list, dm, { model:'cube', pos:[sx,0.48,cz], scale:[0.55,0.10,0.55], tex:'wood', color:cRGBA(125,78,52) });
        pushStatic(list, dm, { model:'cube', pos:[sx + (sx>0?0.24:-0.24),0.92,cz], scale:[0.10,0.95,0.55], tex:'wood', color:cRGBA(115,70,46) });
      }
    }
    lightList.push({ pos:[pos[0], pos[1]+1.5, pos[2]], col:[1.6, 1.12, 0.52], radius:14.0, flicker:0.14, ph:rng()*6.28 });
  };

  const addCrystalOrTorch = (list, fxList, lightList, pos, isCrystal) => {
    if (isCrystal) {
      const specs = q.props !== "min" ? [[0,0,2.5,10],[0.45,0.3,1.6,-18],[-0.4,0.2,1.3,22]] : [[0,0,2.4,10]];
      for (const [ox,oz,sh,rz] of specs) {
        pushStatic(list, null, { model:lodModel('cone'), pos:[pos[0]+ox, pos[1]+sh*0.46, pos[2]+oz], rot:[8,20,rz], scale:[0.55,sh,0.55], tex:'crystal', color:cRGBA(135,238,255,248) });
      }
      if (q.fx_glow) {
        fxList.push(new Node3D({ model:'quad', billboard:true, additive:true, pos:[pos[0],pos[1]+1.6,pos[2]], scale:[3.4,3.4,1], tex:'soft_glow', color:cRGBA(110,230,255,140), useFog:false, shade:false, castShadow:false }));
      }
      lightList.push({ pos:[pos[0], pos[1]+1.8, pos[2]], col:[0.62, 1.75, 2.25], radius:18.0, flicker:0.10, ph:rng()*6.28 });
    } else {
      pushStatic(list, null, { model:'cylinder', pos:[pos[0],pos[1]+1.4,pos[2]], scale:[0.16,2.8,0.16], tex:'metal', color:cRGBA(72,66,60) });
      pushStatic(list, null, { model:lodModel('sphere'), pos:[pos[0],pos[1]+2.92,pos[2]], scale:0.28, color:cRGBA(255,205,85) });
      if (q.fx_glow) {
        fxList.push(new Node3D({ model:'quad', billboard:true, additive:true, pos:[pos[0],pos[1]+2.98,pos[2]], scale:[2.8,2.8,1], tex:'soft_glow', color:cRGBA(255,172,68,155), useFog:false, shade:false, castShadow:false }));
      }
      lightList.push({ pos:[pos[0], pos[1]+3.1, pos[2]], col:[2.1, 1.22, 0.50], radius:17.0, flicker:0.20, ph:rng()*6.28 });
    }
  };

  // =========================================================================
  // PASS 2: Build Each of the 13 Segments with Guaranteed Clearance & Smooth Corners
  // =========================================================================
  let doorCounter = 0;

  for (let idx = 0; idx < 13; idx++) {
    const plan = segPlans[idx];
    const { isBossWave, rm, segStart, segEnd, nextYaw, prevYaw, fwd, right, pathW } = plan;
    const isIndoor = ["hall","dining","library","dungeon","barn","cave","crystal"].includes(rm);

    const staticItems = [];
    const fxList = [];
    const doorNodes = [];
    const lightList = [];

    const segMid = [(segStart[0]+segEnd[0])*0.5, (segStart[1]+segEnd[1])*0.5, (segStart[2]+segEnd[2])*0.5];
    const dy = segEnd[1] - segStart[1];
    const segLen3d = Math.hypot(segLen, dy);
    const slopePitch = -Math.atan2(dy, segLen) * 180 / Math.PI;

    const floorTex = rm === "hall" ? 'carpet' : ((rm === "dining" || rm === "library" || rm === "barn") ? 'wood' : 'stone');
    const floorCol = rm === "dungeon" ? cRGBA(135,140,152) : (rm === "cave" ? cRGBA(150,145,140) : (rm === "crystal" ? cRGBA(185,205,228) : pathTint));
    const wallTex = rm === "cave" ? 'rock' : (rm === "barn" ? 'wood' : 'brick');
    const wallCol = rm === "dungeon" ? cRGBA(115,120,132) : (rm === "cave" ? cRGBA(145,138,132) : (rm === "crystal" ? cRGBA(145,168,200) : cRGBA(218,208,198)));

    // 1. Roadbed & spacious junction hub (so sharp turns never expose gaps or clip walls)
    pushStatic(staticItems, null, {
      model:'cube', pos:[segMid[0], segMid[1]-0.36, segMid[2]], rot:[slopePitch, nextYaw, 0],
      scale:[pathW, 0.72, segLen3d + 0.5], tex:floorTex,
      uvScale:[Math.max(1, Math.floor(pathW/4)), Math.max(2, Math.floor(segLen3d/5))], color:floorCol
    });
    const hubW = pathW * 1.15;
    pushStatic(staticItems, null, { model:'cube', pos:[segStart[0], segStart[1]-0.39, segStart[2]], rot:[0,nextYaw,0], scale:[hubW,0.70,hubW], tex:'stone', uvScale:[2,2], color:floorCol });
    if (q.props !== "min") {
      pushStatic(staticItems, null, { model:'cube', pos:[segStart[0], segStart[1]-0.40, segStart[2]], rot:[0,nextYaw+45,0], scale:[hubW,0.70,hubW], tex:'stone', uvScale:[2,2], color:floorCol });
    }
    if (idx > 0 && (isIndoor || rm === "village" || rm === "bridge" || isBossWave)) {
      // Place arch cleanly 2.6m into the new segment (past the turning hub so camera never clips its pillars!)
      addArch(staticItems, [segStart[0]+fwd[0]*2.6, segStart[1] + dy*(2.6/segLen), segStart[2]+fwd[2]*2.6], nextYaw, pathW + 0.4, isIndoor ? 7.6 : 6.4, wallCol);
    }

    const lerpSeg = (f) => [lerp(segStart[0],segEnd[0],f), lerp(segStart[1],segEnd[1],f), lerp(segStart[2],segEnd[2],f)];

    if (isIndoor) {
      const wallH = 9.2 + Math.abs(dy);
      // Trim wall ends slightly at sharp corners so turning corridors NEVER poke a wall slab into the junction!
      const trimStart = Math.abs(nextYaw - prevYaw) > 10 ? 3.2 : 0.0;
      const trimEnd = (idx + 1 < 13 && Math.abs(segPlans[idx + 1].nextYaw - nextYaw) > 10) ? 3.2 : 0.0;
      const wallLen = Math.max(14.0, segLen - trimStart - trimEnd + 0.8);
      const wallCenterU = (trimStart + (segLen - trimEnd)) * 0.5 / segLen;
      const wallMid = lerpSeg(wallCenterU);

      for (const s of [-1, 1]) {
        const wOff = s * (pathW * 0.5 + 0.45);
        pushStatic(staticItems, null, {
          model:'cube', pos:[wallMid[0]+right[0]*wOff, wallMid[1]+4.4, wallMid[2]+right[2]*wOff], rot:[0,nextYaw,0],
          scale:[0.9, wallH, wallLen], tex:wallTex, uvScale:[6,2], color:wallCol
        });
        if (q.props !== "min") {
          const bOff = s * (pathW * 0.5 - 0.05);
          pushStatic(staticItems, null, {
            model:'cube', pos:[wallMid[0]+right[0]*bOff, wallMid[1]+0.55, wallMid[2]+right[2]*bOff], rot:[slopePitch,nextYaw,0],
            scale:[0.28, 1.1, wallLen], tex:'stone', color:rm !== "dungeon" ? cRGBA(74,62,54) : cRGBA(78,82,92)
          });
        }
      }
      const ceilC = (rm === "dungeon" || rm === "cave") ? cRGBA(32,34,44) : ((rm === "dining" || rm === "library" || rm === "barn") ? cRGBA(72,58,52) : cRGBA(58,54,66));
      pushStatic(staticItems, null, { model:'cube', pos:[segMid[0],segMid[1]+8.9,segMid[2]], rot:[slopePitch,nextYaw,0], scale:[pathW+2.8,0.4,segLen3d+3.5], tex:wallTex, color:ceilC });

      const fracs = (q.props === "full" || q.props === "mid") ? [0.22, 0.50, 0.78] : [0.50];
      for (const frac of fracs) {
        const p = lerpSeg(frac);
        if (q.props !== "min") {
          pushStatic(staticItems, null, { model:'cube', pos:[p[0],p[1]+8.3,p[2]], rot:[0,nextYaw,0], scale:[pathW+0.6,0.65,0.65], tex:'wood', color:rm!=="dungeon"?cRGBA(66,52,42):cRGBA(68,72,82) });
        }
        for (const s of [-1, 1]) {
          pushStatic(staticItems, null, { model: q.props === "min" ? 'cube' : 'cylinder', pos:[p[0]+right[0]*s*(pathW*0.48), p[1]+4.3, p[2]+right[2]*s*(pathW*0.48)], rot:[0,nextYaw,0], scale:[0.90,8.6,0.90], tex:'stone', uvScale:[2,4], color:rm==="dungeon"?cRGBA(88,92,102):cRGBA(175,162,148) });
          if (rm === "library" && (frac !== 0.50 || q.props === "min")) {
            pushStatic(staticItems, null, { model:'cube', pos:[p[0]+right[0]*s*(pathW*0.43), p[1]+2.8, p[2]+right[2]*s*(pathW*0.43)], rot:[0,nextYaw,0], scale:[1.1,5.6,4.6], tex:'bookshelf', uvScale:[2,2] });
          } else if (rm === "dungeon" && (frac !== 0.50 || q.props === "min")) {
            pushStatic(staticItems, null, { model:'quad', pos:[p[0]+right[0]*s*(pathW*0.42), p[1]+2.2, p[2]+right[2]*s*(pathW*0.42)], rot:[0,nextYaw+(s===1?90:-90),0], scale:[4.8,4.4,1], tex:'bars' });
            if (frac === 0.22) addCrystalOrTorch(staticItems, fxList, lightList, [p[0]+right[0]*s*(pathW*0.34), p[1], p[2]+right[2]*s*(pathW*0.34)], false);
          } else if (rm === "hall" && frac !== 0.50) {
            pushStatic(staticItems, null, { model:'quad', pos:[p[0]+right[0]*s*(pathW*0.49), p[1]+4.2, p[2]+right[2]*s*(pathW*0.49)], rot:[0,nextYaw+(s===1?90:-90),0], scale:[2.0,3.8,1], tex:'tapestry' });
          } else if (rm === "barn" && frac === 0.22) {
            pushStatic(staticItems, null, { model:'cube', pos:[p[0]+right[0]*s*(pathW*0.36), p[1]+0.65, p[2]+right[2]*s*(pathW*0.36)], rot:[0,nextYaw+15,0], scale:1.3, tex:'crate' });
          } else if (rm === "cave") {
            pushStatic(staticItems, null, { model:lodModel('cone'), pos:[p[0]+right[0]*s*3.0, p[1]+7.6, p[2]+right[2]*s*3.0], rot:[180,0,0], scale:[1.0,2.4,1.0], tex:'rock', color:cRGBA(120,114,110) });
            if (frac === 0.50 && s === -1) addCrystalOrTorch(staticItems, fxList, lightList, [p[0]-right[0]*3.8, p[1], p[2]-right[2]*3.8], false);
          } else if (rm === "crystal" && frac === 0.50) {
            addCrystalOrTorch(staticItems, fxList, lightList, [p[0]+right[0]*s*3.8, p[1], p[2]+right[2]*s*3.8], true);
          }
        }
        if (frac === 0.50) {
          if (rm === "hall" || rm === "dining") {
            const winP = [p[0]+right[0]*(pathW*0.49), p[1]+4.9, p[2]+right[2]*(pathW*0.49)];
            pushStatic(staticItems, null, { model:'quad', pos:winP, rot:[0,nextYaw+90,0], scale:[3.2,4.8,1], tex:'stained' });
            addSunbeam(fxList, winP, [p[0]+right[0]*0.6, p[1], p[2]+right[2]*0.6], nextYaw, cRGBA(255,240,200), 3.0, 0.34);
            lightList.push({ pos:[p[0]+right[0]*(pathW*0.25), p[1]+4.2, p[2]+right[2]*(pathW*0.25)], col:[1.30, 1.20, 0.90], radius:16.0, flicker:0.0, ph:0 });
          } else if (rm === "barn") {
            const winP = [p[0]+right[0]*(pathW*0.48), p[1]+4.6, p[2]+right[2]*(pathW*0.48)];
            pushStatic(staticItems, null, { model:'quad', pos:winP, rot:[0,nextYaw+90,0], scale:[2.2,1.8,1], tex:'barn_window', color:cRGBA(255,250,235) });
            addSunbeam(fxList, winP, [p[0]+right[0]*0.4, p[1], p[2]+right[2]*0.4], nextYaw, cRGBA(255,246,215), 2.5, 0.28);
          }
          if (rm === "dining") {
            addDining(staticItems, fxList, lightList, [p[0]-right[0]*4.5, p[1], p[2]-right[2]*4.5], nextYaw);
            addDining(staticItems, fxList, lightList, [p[0]+right[0]*4.5, p[1], p[2]+right[2]*4.5], nextYaw);
            pushStatic(staticItems, null, { model:'cylinder', pos:[p[0],p[1]+7.85,p[2]], scale:[0.09,2.4,0.09], tex:'metal', color:cRGBA(185,155,75) });
            pushStatic(staticItems, null, { model:lodModel('torus'), pos:[p[0],p[1]+6.65,p[2]], rot:[90,0,0], scale:[2.6,2.6,1.2], tex:'metal', color:cRGBA(235,195,88) });
            if (q.fx_glow) {
              fxList.push(new Node3D({ model:'quad', billboard:true, additive:true, pos:[p[0],p[1]+6.7,p[2]], scale:[5.0,5.0,1], tex:'soft_glow', color:cRGBA(255,220,145,125), useFog:false, shade:false, castShadow:false }));
            }
          }
        }
      }
    } else {
      if (stageNum !== 3) {
        pushStatic(staticItems, null, {
          model:'quad', pos:[segMid[0], segMid[1] - 0.56, segMid[2]], rot:[90 + slopePitch, nextYaw, 0],
          scale:[128, segLen3d + 22, 1], tex:th.ground_tex, uvScale:[12,5], color:groundTint
        });
      } else {
        pushStatic(staticItems, null, { model:'quad', pos:[segMid[0], segMid[1] - 24, segMid[2]], rot:[90,nextYaw,0], scale:[140,segLen+24,1], color:cRGBA(210,232,248,235) });
      }
      for (const s of [-1, 1]) {
        const eo = s * (pathW*0.5 + 0.18);
        pushStatic(staticItems, null, { model:'cube', pos:[segMid[0]+right[0]*eo, segMid[1]+0.18, segMid[2]+right[2]*eo], rot:[slopePitch,nextYaw,0], scale:[0.45,0.48,segLen3d+0.4], tex:'brick', uvScale:[1,8], color:cRGBA(198,192,184) });
      }
      const fracs = (q.props === "full" || q.props === "mid") ? [0.18, 0.46, 0.76] : [0.46];
      for (const frac of fracs) {
        const p = lerpSeg(frac);
        for (const s of [-1, 1]) {
          if (rm === "bridge") {
            pushStatic(staticItems, null, { model:'cube', pos:[p[0]+right[0]*s*4.7, p[1]+0.85, p[2]+right[2]*s*4.7], rot:[0,nextYaw,0], scale:[0.65,1.7,3.8], tex:'brick', color:cRGBA(222,218,210) });
            if (frac === 0.46 && q.props !== "min") {
              const cliffPos = [p[0]+right[0]*s*24, p[1]-4, p[2]+right[2]*s*24];
              if (isClearOfAllRoads(cliffPos[0], cliffPos[2], 9.0)) {
                pushStatic(staticItems, null, { model:'cube', pos:cliffPos, rot:[0,nextYaw,0], scale:[14,38,16], tex:'rock', uvScale:[2,4], color:cRGBA(192,182,168) });
              }
              const bm = M4.fromTRS(p[0]+right[0]*s*4.7, p[1], p[2]+right[2]*s*4.7, 0, nextYaw, 0, 1, 1, 1);
              pushStatic(staticItems, bm, { model:'cylinder', pos:[0, 2.75, 0], scale:[0.11, 4.4, 0.11], tex:'metal', color:cRGBA(64,68,76) });
              pushStatic(staticItems, bm, { model:'sphere',   pos:[0, 5.02, 0], scale:0.24, tex:'metal', color:cRGBA(225,186,82) });
              pushStatic(staticItems, bm, { model:'cylinder', pos:[0, 4.58, 0], rot:[90, 0, 0], scale:[0.07, 1.32, 0.07], tex:'metal', color:cRGBA(185,155,75) });
              pushStatic(staticItems, bm, { model:'quad',     pos:[0, 3.48, 0], rot:[0, 90, 0], scale:[1.15, 2.15, 1], tex:'tapestry' });
            }
          } else {
            if (q.props !== "min" || (idx % 2 === 0)) {
              const td = randRange(10.8, 17.8);
              addTree(staticItems, [p[0]+right[0]*s*td, p[1] - 0.55, p[2]+right[2]*s*td], randRange(1.0, 1.55));
            }
            if (frac === 0.18 && s === -1) addLamp(staticItems, fxList, lightList, [p[0]-right[0]*5.4, p[1], p[2]-right[2]*5.4], nextYaw);
            if (rm === "village" && frac === 0.46) {
              addHouse(staticItems, doorNodes, [p[0]+right[0]*s*10.8, p[1] - 0.35, p[2]+right[2]*s*10.8], nextYaw+(s===1?90:-90));
            } else if (rm === "forest" && frac === 0.46 && (q.props === "full" || q.props === "mid")) {
              const rkPos = [p[0]+right[0]*s*7.2, p[1] - 0.35, p[2]+right[2]*s*7.2];
              if (isClearOfAllRoads(rkPos[0], rkPos[2], 1.4)) {
                pushStatic(staticItems, null, { model:lodModel('icosphere'), pos:rkPos, scale:[1.4,0.85,1.25], tex:'rock', color:cRGBA(158,162,152) });
              }
              if (s === -1) addRoadFence(staticItems, [p[0]-right[0]*5.25, p[1], p[2]-right[2]*5.25], nextYaw, 5.6);
            }
            if (frac === 0.76 && s === 1 && (q.props === "full" || q.props === "mid")) {
              const crPos = [p[0]+right[0]*5.5, p[1]+0.42, p[2]+right[2]*5.5];
              if (isClearOfAllRoads(crPos[0], crPos[2], 1.0)) {
                pushStatic(staticItems, null, { model:'cube', pos:crPos, rot:[0,nextYaw+22,0], scale:1.05, tex:'crate' });
              }
            }
          }
        }
        if (rm === "forest" && frac === 0.46 && q.sunbeams > 0) {
          fxList.push(new Node3D({
            model:'quad', additive:true, pos:[p[0], p[1]+0.08, p[2]], rot:[90 + slopePitch, nextYaw, 0],
            scale:[5.2, 5.2, 1], tex:'soft_glow', color:cRGBA(255,246,210,72), useFog:false, shade:false, castShadow:false
          }));
        }
      }
    }

    // Smooth non-clipping rail path: pass through exact centerline junction before turning onto new segment!
    const camStop = [segStart[0]+fwd[0]*4.5, segStart[1]+2.25, segStart[2]+fwd[2]*4.5];
    const initPitch = isBossWave ? -15.0 : clamp(slopePitch, -14, 14);
    const camRot = [initPitch, nextYaw, 0];
    const pathWaypoints = [];
    if (idx === 0) {
      pathWaypoints.push([[segStart[0]+fwd[0]*1.5, segStart[1]+2.25, segStart[2]+fwd[2]*1.5], camRot]);
      pathWaypoints.push([camStop, camRot]);
    } else {
      const prevPlan = segPlans[idx - 1];
      const prevApproach = [segStart[0] - prevPlan.fwd[0]*2.6, segStart[1]+2.25, segStart[2] - prevPlan.fwd[2]*2.6];
      const midYaw = lerpAngleDeg(prevYaw, nextYaw, 0.5);
      const hubCenter = [segStart[0], segStart[1]+2.25, segStart[2]];
      if (Math.abs(nextYaw - prevYaw) > 8) {
        pathWaypoints.push([prevApproach, [0, prevYaw, 0]]);
        pathWaypoints.push([hubCenter, [initPitch * 0.5, midYaw, 0]]);
      } else {
        pathWaypoints.push([hubCenter, camRot]);
      }
      pathWaypoints.push([camStop, camRot]);
    }

    if (idx === 2 || idx === 6 || idx === 9 || idx === 11) {
      const hpB = lerpSeg(0.46);
      const hs = (idx % 2) ? 3.1 : -3.1;
      healPositions.push([hpB[0]+right[0]*hs, hpB[1]+0.05, hpB[2]+right[2]*hs]);
    }

    const spawns = [];
    if (!isBossWave) {
      for (const [kind, emerge, rawSideOff, yOff, distAhead, delay] of th.waves[idx]) {
        const u = clamp(distAhead / segLen, 0.25, 0.90);
        const bp = lerpSeg(u);
        let sideOff = rawSideOff;
        let doorId = null;
        let emDir = [-fwd[0], 0, -fwd[2]];

        // 1. High sniper/bomber watchtower: ALWAYS outside road edge (never clips camera rail!)
        let spPos = [bp[0]+right[0]*sideOff, bp[1]+yOff, bp[2]+right[2]*sideOff];
        if (yOff >= 2.5 && kind !== "gargoyle" && kind !== "wasp") {
          const ss = sideOff >= 0 ? 1 : -1;
          const towerOff = ss * (pathW * 0.5 + 1.85);
          const balconyOff = ss * (pathW * 0.5 + 0.55);
          const twPos = [bp[0]+right[0]*towerOff, bp[1]+yOff, bp[2]+right[2]*towerOff];
          spPos = [bp[0]+right[0]*balconyOff, bp[1]+yOff, bp[2]+right[2]*balconyOff];
          if (!isIndoor) {
            pushStatic(staticItems, null, { model:'cube', pos:[twPos[0], twPos[1] - (yOff + 1.8)*0.5, twPos[2]], rot:[0,nextYaw,0], scale:[3.8, yOff + 1.8, 3.8], tex:'stone', uvScale:[2,2], color:cRGBA(202,196,188) });
            pushStatic(staticItems, null, { model:'cube', pos:[twPos[0], twPos[1] - 0.14, twPos[2]], rot:[0,nextYaw,0], scale:[4.2, 0.28, 4.2], tex:'brick', color:cRGBA(218,212,202) });
          } else {
            // Indoor sniper balcony ledge protruding cleanly from upper wall
            pushStatic(staticItems, null, { model:'cube', pos:[bp[0]+right[0]*ss*(pathW*0.44), bp[1]+yOff-0.2, bp[2]+right[2]*ss*(pathW*0.44)], rot:[0,nextYaw,0], scale:[2.0, 0.36, 4.2], tex:'stone', color:cRGBA(175,168,160) });
          }
        }

        // 2. Door emerge: NEVER put a house across the middle of the road or inside a mansion!
        if (emerge === "door") {
          doorCounter++;
          doorId = `s${stageNum}_d${doorCounter}`;
          const ss = sideOff === 0 ? ((idx % 2 === 0) ? -1 : 1) : (sideOff > 0 ? 1 : -1);
          emDir = [-right[0]*ss, 0, -right[2]*ss];
          if (isIndoor) {
            const wallX = ss * (pathW * 0.5 - 0.06);
            const doorPos = [bp[0]+right[0]*wallX, bp[1], bp[2]+right[2]*wallX];
            addIndoorDoorway(staticItems, doorNodes, doorPos, nextYaw + (ss > 0 ? 90 : -90), doorId);
            spPos = [bp[0]+right[0]*ss*(pathW * 0.5 - 0.35), bp[1], bp[2]+right[2]*ss*(pathW * 0.5 - 0.35)];
          } else {
            // Place roadside cottage strictly OUTSIDE the road width, facing inward!
            const houseCenterOff = ss * (pathW * 0.5 + 4.4);
            const doorFaceOff = ss * (pathW * 0.5 + 1.5);
            const housePos = [bp[0]+right[0]*houseCenterOff, bp[1] - 0.25, bp[2]+right[2]*houseCenterOff];
            addHouse(staticItems, doorNodes, housePos, nextYaw + (ss > 0 ? 90 : -90), doorId, true);
            spPos = [bp[0]+right[0]*doorFaceOff, bp[1], bp[2]+right[2]*doorFaceOff];
          }
        } else if (emerge === "peek" && yOff < 2.5) {
          const ss = sideOff >= 0 ? 1 : -1;
          emDir = [-right[0]*ss, 0, -right[2]*ss];
          const pilOff = ss * Math.max(Math.abs(sideOff) + 1.4, pathW * 0.46);
          const pilPos = [bp[0]+right[0]*pilOff, bp[1], bp[2]+right[2]*pilOff];
          pushStatic(staticItems, null, { model:'cylinder', pos:[pilPos[0], pilPos[1]+1.9, pilPos[2]], rot:[0,nextYaw,0], scale:[1.45, 5.2, 1.45], tex:'brick', uvScale:[2,2], color:cRGBA(205,198,190) });
          pushStatic(staticItems, null, { model:'cube', pos:[pilPos[0], pilPos[1]-0.45, pilPos[2]], rot:[0,nextYaw,0], scale:[1.8, 1.3, 1.8], tex:'stone', color:cRGBA(186,180,172) });
        }

        spawns.push({
          kind, pos: spPos, emerge, dir: emDir, door: doorId, delay,
          descend: (yOff > 0.5 && !GAME_DATA.ENEMY_META[kind].ranged && kind !== "gargoyle" && kind !== "wasp")
        });
      }
    } else {
      const ac = bossArenaCenter;
      pushStatic(staticItems, null, { model:'cube', pos:[ac[0],ac[1]-0.34,ac[2]], scale:[32,0.72,32], tex:'stone', uvScale:[8,8], color:pathTint });
      for (let ang = 0; ang < 360; ang += 45) {
        const ar = ang * Math.PI / 180;
        const pp = [ac[0]+Math.cos(ar)*14.0, ac[1], ac[2]+Math.sin(ar)*14.0];
        if (dist2d(pp[0], pp[2], camStop[0], camStop[2]) > 7.5) {
          pushStatic(staticItems, null, { model: q.props === "min" ? 'cube' : 'cylinder', pos:[pp[0],pp[1]+3.8,pp[2]], scale:[1.5,7.6,1.5], tex:'brick', uvScale:[2,3], color:cRGBA(215,208,198) });
          addCrystalOrTorch(staticItems, fxList, lightList, pp, stageNum === 4);
        }
      }
      spawns.push({
        kind: "boss", pos: ac, emerge: stageNum === 3 ? "swoop" : "climb",
        dir: [-fwd[0], 0, -fwd[2]], door: null, delay: 0.4, descend: false,
        bossStyle: stageNum, customName: GAME_DATA.STAGE_BOSS_DATA[stageNum].name
      });
      spawns.push({
        kind: stageNum === 3 ? "gargoyle" : "ghost",
        pos: [ac[0]-right[0]*5.2, ac[1]+(stageNum===3?3.0:0.6), ac[2]-right[2]*5.2],
        emerge: stageNum === 3 ? "swoop" : "normal", dir: right.slice(), door: null, delay: 10.0, descend: false
      });
    }

    segBatches.push(renderer.createStaticBatch(staticItems));
    segFxLists.push(fxList);
    segDoors.push(doorNodes);
    segLights.push(lightList);
    encounters.push({ path: pathWaypoints, spawns, isBoss: isBossWave });
  }

  const globalBgBatch = globalBgItems.length ? renderer.createStaticBatch(globalBgItems) : null;

  return {
    stageNum, hazeCol, skyTex: th.sky,
    globalBgBatch, globalFxNodes, segBatches, segFxLists, segDoors, segLights,
    doors, healPositions, encounters, motes,
    destroy(r) {
      r.destroyStaticBatch(this.globalBgBatch);
      for (const b of this.segBatches) r.destroyStaticBatch(b);
    }
  };
}

// 7. 一人称ライフル ＆ ゲームディレクター（v8完全準拠）
