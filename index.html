<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUNLIT RUINS 3D : ARCADE RAIL TYPING</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #0b1018;
  font-family: "BIZ UDPGothic", "Meiryo", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  color: #f0f5f8;
}
#gameWrap {
  position: relative; width: 100vw; height: 100vh; overflow: hidden;
}
#glCanvas {
  display: block; width: 100%; height: 100%;
}

/* Red damage border */
#dmgBorder {
  position: absolute; inset: 0; pointer-events: none; z-index: 15;
  box-shadow: inset 0 0 90px 28px rgba(210, 32, 32, 0);
  background: rgba(185, 28, 28, 0);
}

/* Top HUD Bar */
#topBar {
  position: absolute; top: 0; left: 0; right: 0; height: 46px; z-index: 25;
  background: rgba(14, 20, 26, 0.86);
  border-bottom: 1px solid rgba(130, 170, 195, 0.28);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px; gap: 12px;
  font-weight: 700; letter-spacing: 0.03em;
}
#hpTxt { color: #f55c52; font-size: clamp(14px, 1.8vw, 21px); white-space: nowrap; }
#scoreTxt { color: #f5e29b; font-size: clamp(13px, 1.55vw, 19px); white-space: nowrap; }
#progWrap { display: flex; align-items: center; gap: 10px; }
#progTxt { color: #c3e1dc; font-size: clamp(12px, 1.3vw, 16px); white-space: nowrap; }
#hudPauseBtn {
  background: rgba(42, 62, 86, 0.9); color: #e8f4ff;
  border: 1px solid rgba(130, 185, 225, 0.55); border-radius: 6px;
  padding: 4px 10px; font-size: 13px; font-weight: 700; cursor: pointer;
}
#hudPauseBtn:hover { background: rgba(62, 92, 128, 0.98); }
#fpsTxt { color: #9bebaf; font-size: 13px; min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; }

/* Toast */
#toast {
  position: absolute; top: 58px; left: 50%; transform: translateX(-50%); z-index: 35;
  background: rgba(16, 22, 28, 0.92);
  border: 1.5px solid rgba(255, 220, 115, 0.55);
  border-radius: 8px; padding: 8px 26px;
  font-size: clamp(14px, 1.8vw, 22px); font-weight: 700; color: #ffe182;
  white-space: nowrap; pointer-events: none;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
  display: none;
}

/* 3D Projected World UI Layer */
#worldUI {
  position: absolute; inset: 0; pointer-events: none; z-index: 20; overflow: hidden;
}
.w-card {
  position: absolute; transform: translate(-50%, -50%);
  background: rgba(14, 18, 24, 0.92);
  border: 2.5px solid rgba(135, 165, 168, 0.85);
  border-radius: 7px;
  padding: 4px 12px 6px;
  min-width: 140px; max-width: 520px;
  text-align: center;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
  will-change: left, top;
}
.w-card.locked {
  background: rgba(10, 14, 22, 0.97);
  border-color: #55e1ff;
  box-shadow: 0 0 18px rgba(85, 225, 255, 0.55);
  z-index: 12;
}
.w-card.boss { border-color: #eb5f4b; }
.w-card.boss.locked { border-color: #55e1ff; }
.w-card.proj {
  background: rgba(34, 18, 12, 0.94);
  border-color: #f57d37; min-width: 105px;
}
.w-card.proj.locked { border-color: #ffd746; box-shadow: 0 0 16px rgba(255, 215, 70, 0.6); }
.w-card.heal {
  background: rgba(14, 30, 20, 0.93);
  border-color: #55d782; min-width: 115px;
}
.w-card.heal.locked { border-color: #fadc4b; box-shadow: 0 0 16px rgba(250, 220, 75, 0.6); }

.w-hdr {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  font-size: 11px; line-height: 1.2; margin-bottom: 1px;
}
.w-name { color: #b9d7d7; font-weight: 700; }
.w-phase { color: #faaa5f; font-weight: 700; }
.w-jp {
  font-size: clamp(15px, 1.65vw, 21px); font-weight: 700; color: #f8f8f2;
  line-height: 1.25; white-space: nowrap;
}
.w-card.proj .w-jp { color: #ffe8c3; font-size: clamp(14px, 1.5vw, 19px); }
.w-card.heal .w-jp { color: #b9fac8; font-size: clamp(14px, 1.45vw, 18px); }
.w-roma {
  font-family: "Consolas", "Courier New", monospace;
  font-size: clamp(15px, 1.75vw, 22px); font-weight: 700; letter-spacing: 0.06em;
  line-height: 1.2; white-space: nowrap;
}
.w-roma .done { color: #6f7c88; }
.w-roma .rem { color: #c8d3dc; }
.w-card.locked .w-roma .rem { color: #ffffff; text-shadow: 0 0 6px rgba(130, 235, 255, 0.55); }

/* Attack Warning Reticle */
.w-warn {
  position: absolute; transform: translate(-50%, -50%);
  pointer-events: none; z-index: 10;
}
.w-warn-box {
  position: relative; width: 70px; height: 70px;
}
.w-corner {
  position: absolute; width: 16px; height: 16px;
  border-color: #f04137; border-style: solid;
}
.w-corner.tl { top: 0; left: 0; border-width: 3px 0 0 3px; }
.w-corner.tr { top: 0; right: 0; border-width: 3px 3px 0 0; }
.w-corner.bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; }
.w-corner.br { bottom: 0; right: 0; border-width: 0 3px 3px 0; }
.w-warn-txt {
  position: absolute; left: 50%; top: -22px; transform: translateX(-50%);
  color: #ff6b57; font-size: 14px; font-weight: 800; white-space: nowrap;
  text-shadow: 0 1px 6px #000, 0 0 4px #000;
}

/* Modal Overlays */
.overlay-backdrop {
  position: absolute; inset: 0; z-index: 40;
  display: flex; align-items: center; justify-content: center;
  padding: 52px 16px 16px;
  background: rgba(6, 10, 16, 0.52);
}
.overlay-backdrop.hidden { display: none; }

/* Title Panel with Vertical Sliders */
#titleCard {
  width: min(860px, 94vw);
  max-height: calc(100vh - 68px);
  overflow-y: auto;
  background: rgba(13, 19, 28, 0.94);
  border: 3px solid rgba(245, 208, 98, 0.9);
  border-radius: 14px;
  padding: 20px 26px 18px;
  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.65);
}
#titleHeading {
  text-align: center; font-size: clamp(24px, 3.2vw, 38px); font-weight: 900;
  color: #ffe47a; letter-spacing: 0.06em;
  text-shadow: 0 2px 12px rgba(255, 205, 80, 0.35);
}
#titleSub {
  text-align: center; font-size: clamp(12px, 1.35vw, 15px); color: #bce0f0;
  margin: 4px 0 14px;
}
.divider {
  height: 1px; background: rgba(95, 128, 155, 0.55); margin: 10px 0 14px;
}

.slider-list {
  display: flex; flex-direction: column; gap: 8px;
}
.slider-row {
  display: grid;
  grid-template-columns: minmax(120px, 165px) 34px 1fr 34px minmax(175px, 235px);
  align-items: center; gap: 10px;
  background: rgba(24, 34, 48, 0.72);
  border: 1.5px solid rgba(80, 110, 140, 0.35);
  border-radius: 10px;
  padding: 8px 14px;
  transition: background 0.12s, border-color 0.12s;
}
.slider-row.active {
  background: rgba(34, 54, 80, 0.92);
  border-color: rgba(255, 224, 100, 0.82);
}
.sl-label {
  font-size: clamp(14px, 1.5vw, 17px); font-weight: 800; color: #e8f2f8;
}
.sl-step-btn {
  width: 34px; height: 32px; border-radius: 7px; border: 1px solid rgba(130, 175, 215, 0.45);
  background: rgba(38, 54, 76, 0.95); color: #ebf5ff; font-size: 14px; font-weight: 800;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.sl-step-btn:hover { background: rgba(62, 92, 130, 1); border-color: #ffe066; }
.sl-step-btn:active { transform: scale(0.95); }

.sl-track-wrap {
  position: relative; display: flex; align-items: center; height: 32px;
}
.sl-range {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 10px; border-radius: 99px;
  background: #2e3a4c; outline: none; cursor: pointer;
}
.sl-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 24px; height: 28px; border-radius: 7px;
  background: linear-gradient(180deg, #fffbe6 0%, #ffe060 100%);
  border: 2.5px solid #d99b18;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
  cursor: grab;
}
.sl-range:active::-webkit-slider-thumb {
  cursor: grabbing;
  background: linear-gradient(180deg, #ffffff 0%, #69f0ff 100%);
  border-color: #169ab8;
  transform: scale(1.08);
}
.sl-range::-moz-range-thumb {
  width: 24px; height: 28px; border-radius: 7px;
  background: linear-gradient(180deg, #fffbe6 0%, #ffe060 100%);
  border: 2.5px solid #d99b18;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
  cursor: grab;
}
.sl-val {
  font-size: clamp(13px, 1.35vw, 15.5px); font-weight: 800; color: #ffe88a;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.title-actions {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  margin-top: 14px; flex-wrap: wrap;
}
#startBtn {
  min-width: 310px; padding: 13px 28px;
  font-size: clamp(17px, 2vw, 22px); font-weight: 900; color: #fffff5;
  background: linear-gradient(180deg, #2ea869 0%, #207d4d 100%);
  border: 3px solid #ffe26c; border-radius: 12px;
  cursor: pointer; box-shadow: 0 6px 20px rgba(32, 140, 84, 0.45);
  transition: transform 0.1s, filter 0.12s;
}
#startBtn:hover { filter: brightness(1.12); transform: translateY(-1px); }
#startBtn:active { transform: translateY(1px); }
#fsBtn {
  padding: 11px 20px; font-size: 15px; font-weight: 800; color: #e1f2ff;
  background: rgba(30, 48, 72, 0.95); border: 2px solid rgba(135, 185, 225, 0.8);
  border-radius: 10px; cursor: pointer;
}
#fsBtn:hover { background: rgba(48, 76, 114, 1); }
#titleHint {
  text-align: center; font-size: 12px; color: #b9d4e1; margin-top: 12px;
}

/* Pause Card */
#pauseCard {
  width: min(560px, 92vw);
  background: rgba(18, 24, 32, 0.96);
  border: 2.5px solid rgba(250, 225, 130, 0.8);
  border-radius: 14px; padding: 22px 26px;
  box-shadow: 0 18px 46px rgba(0, 0, 0, 0.7);
}
#pauseCard h2 {
  text-align: center; color: #fae182; font-size: 26px; margin-bottom: 14px;
}
.pause-btn-list {
  display: flex; flex-direction: column; gap: 8px;
}
.pause-btn {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 16px; border-radius: 9px;
  background: rgba(30, 44, 62, 0.92); color: #ebf2f0;
  border: 1.5px solid rgba(115, 155, 190, 0.45);
  font-size: 15px; font-weight: 700; cursor: pointer;
}
.pause-btn:hover { background: rgba(48, 70, 98, 0.98); border-color: #ffe066; }
.pause-btn.primary { background: rgba(32, 128, 78, 0.95); border-color: #ffe26c; }
.pause-btn .ktag { color: #ffe082; font-family: monospace; font-size: 14px; }
.pause-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }

/* Result Card */
#resultCard {
  width: min(820px, 94vw);
  background: rgba(14, 19, 28, 0.96);
  border: 3px solid #f5d05c;
  border-radius: 14px; padding: 22px 28px 20px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.72);
}
#resultCard.gameover { border-color: #d74e48; }
#resTitle {
  text-align: center; font-size: clamp(22px, 3vw, 34px); font-weight: 900; color: #ffe478;
}
#resSub {
  text-align: center; font-size: 14px; color: #bcd7e6; margin-top: 4px;
}
.res-body {
  display: grid; grid-template-columns: 1fr 220px; gap: 18px; align-items: center;
  margin: 14px 0;
}
#resStats {
  font-size: clamp(14px, 1.55vw, 17px); line-height: 1.85; color: #eef4f8;
  font-weight: 700; white-space: pre-line;
}
.rank-box {
  background: rgba(22, 30, 44, 0.95);
  border: 2px solid rgba(135, 175, 210, 0.45);
  border-radius: 12px; padding: 14px 12px; text-align: center;
}
.rank-lbl { font-size: 15px; font-weight: 800; color: #b9d4e4; letter-spacing: 0.14em; }
#resRank { font-size: 72px; font-weight: 900; line-height: 1.05; margin: 4px 0; }
#resRankMsg { font-size: 14px; font-weight: 800; }
#resFooter {
  text-align: center; font-size: 14px; color: #b2d2e1; font-weight: 700; margin: 10px 0 14px;
}
.res-actions {
  display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
}
.res-btn {
  padding: 10px 22px; border-radius: 9px; font-size: 15px; font-weight: 800;
  cursor: pointer; border: 2px solid rgba(145, 185, 220, 0.65);
  background: rgba(30, 46, 68, 0.95); color: #eef6ff;
}
.res-btn.primary {
  background: linear-gradient(180deg, #2ea869 0%, #207d4d 100%);
  border-color: #ffe26c; color: #fff;
}
.res-btn:hover { filter: brightness(1.12); }

@media (max-width: 720px) {
  .slider-row { grid-template-columns: 110px 28px 1fr 28px 135px; gap: 6px; padding: 6px 8px; }
  .res-body { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="glCanvas"></canvas>
  <div id="dmgBorder"></div>

  <div id="topBar">
    <div id="hpTxt">LIFE: ● ● ● ● ●</div>
    <div id="scoreTxt">SCORE: 000000 &nbsp; COMBO: 0</div>
    <div id="progWrap">
      <div id="progTxt">ST.1 [1/13]</div>
      <button id="hudPauseBtn" type="button">ポーズ [ESC]</button>
      <div id="fpsTxt">60fps</div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="worldUI"></div>

  <!-- Title Vertical Slider Menu -->
  <div id="titleOverlay" class="overlay-backdrop">
    <div id="titleCard">
      <div id="titleHeading">SUNLIT RUINS 3D</div>
      <div id="titleSub">ツマミを うごかして せっていしよう！（つぎも おぼえているよ）</div>
      <div class="divider"></div>
      <div id="sliderList" class="slider-list"></div>
      <div class="divider"></div>
      <div class="title-actions">
        <button id="startBtn" type="button">▶ &nbsp;STAGE 1 を あそぶ！</button>
        <button id="fsBtn" type="button">ぜんがめん [F11]</button>
      </div>
      <div id="titleHint">マウスで ツマミをうごかすか、↑↓←→キーでも かえられるよ！ &nbsp; [SPACE / ENTER] で スタート &nbsp; [ESC] いちじていし</div>
    </div>
  </div>

  <!-- Pause Overlay -->
  <div id="pauseOverlay" class="overlay-backdrop hidden">
    <div id="pauseCard">
      <h2>PAUSED（一時停止）</h2>
      <div class="pause-btn-list">
        <button class="pause-btn primary" data-act="resume"><span>ゲームを再開</span><span class="ktag">[ ESC ]</span></button>
        <button class="pause-btn" data-act="graphics"><span id="pGfxTxt">軽量化・画質</span><span class="ktag">[ G ]</span></button>
        <button class="pause-btn" data-act="difficulty"><span id="pDiffTxt">難易度 切替</span><span class="ktag">[ D ]</span></button>
        <button class="pause-btn" data-act="sfx"><span id="pSfxTxt">効果音 切替</span><span class="ktag">[ S ]</span></button>
        <button class="pause-btn" data-act="bgm"><span id="pBgmTxt">BGM 切替</span><span class="ktag">[ M ]</span></button>
        <button class="pause-btn" data-act="fullscreen"><span id="pFsTxt">画面モード切替</span><span class="ktag">[ F ]</span></button>
        <div class="pause-row-2">
          <button class="pause-btn" data-act="retry"><span id="pRetryTxt">やり直す</span><span class="ktag">[ R ]</span></button>
          <button class="pause-btn" data-act="title"><span>タイトルへ</span><span class="ktag">[ T ]</span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Result Overlay -->
  <div id="resultOverlay" class="overlay-backdrop hidden">
    <div id="resultCard">
      <div id="resTitle">STAGE 1 CLEAR! - RESULT -</div>
      <div id="resSub"></div>
      <div class="divider"></div>
      <div class="res-body">
        <div id="resStats"></div>
        <div class="rank-box">
          <div class="rank-lbl">RANK</div>
          <div id="resRank">S</div>
          <div id="resRankMsg">PERFECT MASTER!</div>
        </div>
      </div>
      <div class="divider"></div>
      <div id="resFooter"></div>
      <div id="resActions" class="res-actions"></div>
    </div>
  </div>
</div>

// 1. 共通数学・乱数・設定永続化（localStorage）
// =====================================================================
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpAngleDeg(a, b, t) {
  let diff = ((b - a + 180) % 360 + 360) % 360 - 180;
  return a + diff * t;
}
function dist2d(ax, az, bx, bz) { return Math.hypot(ax - bx, az - bz); }
function dist3d(ax, ay, az, bx, by, bz) { return Math.hypot(ax - bx, ay - by, az - bz); }
function cRGBA(r, g, b, a = 255) { return [r / 255, g / 255, b / 255, a / 255]; }
function makeRng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const STORAGE_KEY = "sunlit_ruins_3d_settings_v1";
function loadUserSettings() {
  const defaults = {
    graphics_level: 3,
    difficulty: 1,
    start_stage: 1,
    sfx_mode_idx: 0,
    bgm_muted: false,
  };
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && typeof d === "object") {
        defaults.graphics_level = clamp(parseInt(d.graphics_level ?? 3, 10) || 3, 1, 5);
        defaults.difficulty = clamp(parseInt(d.difficulty ?? 1, 10) || 1, 1, 5);
        defaults.start_stage = clamp(parseInt(d.start_stage ?? 1, 10) || 1, 1, 5);
        defaults.sfx_mode_idx = ((parseInt(d.sfx_mode_idx ?? 0, 10) || 0) % 4 + 4) % 4;
        defaults.bgm_muted = !!d.bgm_muted;
      }
    }
  } catch (e) {}
  return defaults;
}
function saveUserSettings(cfg) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg)); } catch (e) {}
}

// =====================================================================
// 2. PS2世代クオリティ ステレオPCMシンセサイザー＆効果音エンジン（Web Audio API）
// =====================================================================
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.bgmGain = null;
    this.sfxGain = null;
    this.sfxBank = null;
    this.bgmCache = {};
    this.bgmSource = null;
    this.curBgmKey = null;
    this.muted = false;
    this.paused = false;
    this.noteFreqs = {};
    const names = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
    for (let oct = 1; oct <= 6; oct++) {
      for (let i = 0; i < names.length; i++) {
        const midi = (oct + 1) * 12 + i;
        this.noteFreqs[names[i] + oct] = 440.0 * Math.pow(2, (midi - 69) / 12);
      }
    }
  }

  ensureContext() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      this.ctx = new AC();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = 0.92;
      this.masterGain.connect(this.ctx.destination);

      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = 0.85;
      this.sfxGain.connect(this.masterGain);

      this.bgmGain = this.ctx.createGain();
      this.bgmGain.gain.value = this.muted ? 0.0 : 0.72;
      this.bgmGain.connect(this.masterGain);

      this._buildAllSfx();
    }
    if (this.ctx.state === "suspended") {
      this.ctx.resume().catch(() => {});
    }
    return true;
  }

  _onePoleLP(arr, cutoffHz, sr) {
    const dt = 1 / sr;
    const rc = 1 / (2 * Math.PI * cutoffHz);
    const a = dt / (rc + dt);
    let y = 0;
    for (let i = 0; i < arr.length; i++) {
      y += a * (arr[i] - y);
      arr[i] = y;
    }
  }

  _onePoleHP(arr, cutoffHz, sr) {
    const dt = 1 / sr;
    const rc = 1 / (2 * Math.PI * cutoffHz);
    const a = rc / (rc + dt);
    let y = 0, prevX = 0;
    for (let i = 0; i < arr.length; i++) {
      const x = arr[i];
      y = a * (y + x - prevX);
      prevX = x;
      arr[i] = y;
    }
  }

  _bandPass(arr, loHz, hiHz, sr) {
    if (hiHz) { this._onePoleLP(arr, hiHz, sr); this._onePoleLP(arr, hiHz, sr); }
    if (loHz) { this._onePoleHP(arr, loHz, sr); this._onePoleHP(arr, loHz, sr); }
  }

  _fade(arr, aMs, rMs, sr) {
    const n = arr.length;
    const an = Math.min(n >> 1, Math.floor(sr * aMs / 1000));
    const rn = Math.min(n >> 1, Math.floor(sr * rMs / 1000));
    for (let i = 0; i < an; i++) arr[i] *= i / an;
    for (let i = 0; i < rn; i++) arr[n - 1 - i] *= i / rn;
  }

  _toMonoBuffer(arr, peak, sr) {
    let mx = 1e-6;
    for (let i = 0; i < arr.length; i++) { const a = Math.abs(arr[i]); if (a > mx) mx = a; }
    const sc = peak / mx;
    const buf = this.ctx.createBuffer(1, arr.length, sr);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < arr.length; i++) ch[i] = clamp(arr[i] * sc, -1, 1);
    return buf;
  }

  _buildAllSfx() {
    const sr = 32000;
    const rng = makeRng(2026);
    const makeNoise = (n) => {
      const a = new Float32Array(n);
      for (let i = 0; i < n; i++) a[i] = rng() * 2 - 1;
      return a;
    };

    const makeGun = (mul) => {
      const n = Math.floor(sr * 0.115);
      const out = new Float32Array(n);
      const crack = makeNoise(n);
      this._bandPass(crack, 1400, 9000, sr);
      const tail = makeNoise(n);
      this._bandPass(tail, 600, 4200, sr);
      let ph = 0;
      for (let i = 0; i < n; i++) {
        const t = i / sr;
        const freq = (420 * mul) * Math.exp(-t * 42) + 88 * mul;
        ph += 2 * Math.PI * freq / sr;
        const punch = Math.tanh(Math.sin(ph) * 1.6) * Math.exp(-t * 36);
        out[i] = crack[i] * Math.exp(-t * 52) * 0.70 + punch * 0.80 + tail[i] * Math.exp(-t * 22) * 0.35;
      }
      this._fade(out, 0.5, 14, sr);
      return this._toMonoBuffer(out, 0.50, sr);
    };

    const makeCrisp = (mul) => {
      const n = Math.floor(sr * 0.11);
      const out = new Float32Array(n);
      const snap = makeNoise(n);
      this._bandPass(snap, 2200, 7600, sr);
      const f0 = 740 * mul;
      for (let i = 0; i < n; i++) {
        const t = i / sr;
        const tone = (Math.sin(2*Math.PI*f0*t)*0.65 + Math.sin(4*Math.PI*f0*t)*0.25 + Math.sin(6*Math.PI*f0*t)*0.10) * Math.exp(-t * 26);
        out[i] = snap[i] * Math.exp(-t * 150) * 0.45 + tone * 0.78;
      }
      this._fade(out, 0.8, 18, sr);
      return this._toMonoBuffer(out, 0.46, sr);
    };

    const makeHammer = (mul) => {
      const n = Math.floor(sr * 0.115);
      const out = new Float32Array(n);
      const tap = makeNoise(n);
      this._bandPass(tap, 900, 3200, sr);
      let ph = 0;
      for (let i = 0; i < n; i++) {
        const t = i / sr, u = t / 0.115;
        const freq = (620 + 1180 * Math.exp(-Math.pow((u - 0.28) / 0.24, 2)) + 260 * u) * mul;
        ph += 2 * Math.PI * freq / sr;
        const sq = (Math.sin(ph)*0.75 + Math.sin(2*ph)*0.28 + Math.sin(3*ph)*0.12) * Math.min(1, u / 0.08) * Math.exp(-u * 3.4);
        out[i] = sq * 0.85 + tap[i] * Math.exp(-t * 110) * 0.30;
      }
      this._fade(out, 1.0, 14, sr);
      return this._toMonoBuffer(out, 0.42, sr);
    };

    const makeCat = (mul) => {
      const dur = 0.175, n = Math.floor(sr * dur);
      const out = new Float32Array(n);
      const br = makeNoise(n);
      this._bandPass(br, 1500, 4500, sr);
      let ph = 0;
      for (let i = 0; i < n; i++) {
        const t = i / sr, u = t / dur;
        const f0 = (500 + 290 * Math.sin(Math.PI * clamp(u * 1.15, 0, 1)) - 110 * u * u) * mul;
        ph += 2 * Math.PI * f0 / sr;
        const w2 = 0.45 + 0.35 * Math.sin(Math.PI * u);
        const w3 = 0.55 * (1 - 0.4 * u);
        const w4 = 0.35 * Math.sin(Math.PI * clamp(u * 1.3, 0, 1));
        const w5 = 0.18 * (1 - u);
        const v = Math.sin(ph)*0.60 + Math.sin(2*ph)*w2 + Math.sin(3*ph)*w3 + Math.sin(4*ph)*w4 + Math.sin(5*ph)*w5;
        const env = Math.min(1, u / 0.12) * Math.exp(-Math.max(0, u - 0.35) * 4.2);
        out[i] = v * env * 0.82 + br[i] * Math.exp(-t * 65) * 0.22;
      }
      this._onePoleLP(out, 3600, sr);
      this._fade(out, 3, 22, sr);
      return this._toMonoBuffer(out, 0.44, sr);
    };

    const pitches = [1.0, 1.03, 1.06, 1.10];
    this.sfxBank = {
      type_sets: {
        gun: pitches.map(makeGun),
        crisp: pitches.map(makeCrisp),
        hammer: pitches.map(makeHammer),
        cat: pitches.map(makeCat),
      }
    };

    // kill
    {
      const n = Math.floor(sr * 0.36), out = new Float32Array(n), cr = makeNoise(n);
      this._bandPass(cr, 900, 5200, sr);
      for (let i = 0; i < n; i++) {
        const t = i / sr;
        const punch = Math.sin(2*Math.PI*(150*Math.exp(-t*9)+52)*t) * Math.exp(-t*8.5);
        const shim = (Math.sin(2*Math.PI*660*t) + 0.6*Math.sin(2*Math.PI*990*t)) * Math.exp(-t*18);
        out[i] = punch*0.75 + cr[i]*Math.exp(-t*16)*0.55 + shim*0.25;
      }
      this._fade(out, 1.5, 25, sr);
      this.sfxBank.kill = this._toMonoBuffer(out, 0.50, sr);
    }
    // stagger
    {
      const n = Math.floor(sr * 0.28), out = new Float32Array(n), bu = makeNoise(n);
      this._bandPass(bu, 600, 4500, sr);
      for (let i = 0; i < n; i++) {
        const t = i / sr;
        const cl = (Math.sin(2*Math.PI*420*t) + 0.7*Math.sin(2*Math.PI*635*t)) * Math.exp(-t*15);
        out[i] = cl*0.55 + bu[i]*Math.exp(-t*18)*0.65;
      }
      this._fade(out, 1.5, 20, sr);
      this.sfxBank.stagger = this._toMonoBuffer(out, 0.48, sr);
    }
    // miss
    {
      const n = Math.floor(sr * 0.055), out = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const t = i / sr;
        out[i] = Math.sin(2*Math.PI*155*t)*Math.exp(-t*55) + 0.4*Math.sin(2*Math.PI*112*t)*Math.exp(-t*45);
      }
      this._fade(out, 1.5, 10, sr);
      this.sfxBank.miss = this._toMonoBuffer(out, 0.34, sr);
    }
    // damage
    {
      const n = Math.floor(sr * 0.34), out = new Float32Array(n), sl = makeNoise(n);
      this._bandPass(sl, 400, 3200, sr);
      for (let i = 0; i < n; i++) {
        const t = i / sr;
        out[i] = sl[i]*Math.exp(-t*11)*0.65 + Math.sin(2*Math.PI*64*t)*Math.exp(-t*7.5)*0.85;
      }
      this._fade(out, 2, 25, sr);
      this.sfxBank.damage = this._toMonoBuffer(out, 0.52, sr);
    }
    // warn
    {
      const n = Math.floor(sr * 0.24), out = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const t = i / sr;
        const b1 = Math.sin(2*Math.PI*68*t) * Math.exp(-Math.pow(t-0.045,2)/0.00045);
        const b2 = Math.sin(2*Math.PI*56*t) * Math.exp(-Math.pow(t-0.145,2)/0.0006);
        out[i] = b1*0.85 + b2*0.6;
      }
      this._fade(out, 3, 15, sr);
      this.sfxBank.warn = this._toMonoBuffer(out, 0.42, sr);
    }
    // heal
    {
      const n = Math.floor(sr * 0.45), out = new Float32Array(n);
      const freqs = [392.0, 493.88, 587.33, 783.99];
      for (let i = 0; i < n; i++) {
        const t = i / sr;
        let v = 0;
        for (let k = 0; k < freqs.length; k++) {
          const st = k * 0.065;
          if (t >= st) v += Math.sin(2*Math.PI*freqs[k]*t) * Math.exp(-(t - st)*9.0) * 0.35;
        }
        out[i] = v;
      }
      this._onePoleLP(out, 2600, sr);
      this._fade(out, 4, 35, sr);
      this.sfxBank.heal = this._toMonoBuffer(out, 0.38, sr);
    }
    // door
    {
      const n = Math.floor(sr * 0.24), out = new Float32Array(n), ns = makeNoise(n);
      this._bandPass(ns, 200, 1400, sr);
      for (let i = 0; i < n; i++) {
        const t = i / sr;
        out[i] = Math.sin(2*Math.PI*78*t)*Math.exp(-t*11)*0.7 + ns[i]*Math.exp(-t*9)*0.5;
      }
      this._fade(out, 2, 20, sr);
      this.sfxBank.door = this._toMonoBuffer(out, 0.42, sr);
    }
    // boss_alert
    {
      const n = Math.floor(sr * 0.75), out = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const t = i / sr;
        const w = Math.sin(2*Math.PI*146.83*t) + 0.5*Math.sin(2*Math.PI*220*t) + 0.35*Math.sin(2*Math.PI*293.66*t);
        out[i] = Math.tanh(w * 1.4) * Math.exp(-t * 2.4);
      }
      this._onePoleLP(out, 1800, sr);
      this._fade(out, 15, 80, sr);
      this.sfxBank.boss_alert = this._toMonoBuffer(out, 0.46, sr);
    }
    // clear_fanfare
    {
      const n = Math.floor(sr * 1.45), out = new Float32Array(n);
      const notes = [
        [0.00, 523.25, 0.16], [0.14, 659.25, 0.16], [0.28, 783.99, 0.18],
        [0.44, 1046.50, 0.95], [0.44, 783.99, 0.95], [0.44, 659.25, 0.95], [0.44, 261.63, 0.95],
      ];
      for (const [st, f, hold] of notes) {
        const s0 = Math.floor(st * sr), s1 = Math.min(n, Math.floor((st + hold) * sr));
        for (let i = s0; i < s1; i++) {
          const lt = (i - s0) / sr;
          const vib = 1 + 0.004 * Math.sin(2*Math.PI*5.8*lt);
          const w = Math.sin(2*Math.PI*f*vib*lt)*0.55 + Math.sin(4*Math.PI*f*lt)*0.28 + Math.sin(6*Math.PI*f*lt)*0.14;
          const env = Math.min(1, lt / 0.015) * Math.exp(-lt * (hold > 0.5 ? 1.8 : 6.0));
          out[i] += Math.tanh(w * 1.2) * env * 0.30;
        }
      }
      this._bandPass(out, 80, 4800, sr);
      this._fade(out, 6, 90, sr);
      this.sfxBank.clear_fanfare = this._toMonoBuffer(out, 0.44, sr);
    }
    // gameover_sting
    {
      const n = Math.floor(sr * 1.40), out = new Float32Array(n);
      const steps = [[0.0, [293.66, 349.23, 440.0], 0.36], [0.36, [261.63, 311.13, 392.0], 0.36], [0.72, [220.0, 261.63, 329.63, 110.0], 0.68]];
      for (const [st, freqs, hold] of steps) {
        const s0 = Math.floor(st * sr), s1 = Math.min(n, Math.floor((st + hold) * sr));
        for (let i = s0; i < s1; i++) {
          const lt = (i - s0) / sr;
          let ch = 0;
          for (const f of freqs) ch += Math.sin(2*Math.PI*f*lt)*0.6 + Math.sin(4*Math.PI*f*lt)*0.25;
          ch /= freqs.length;
          const env = Math.min(1, lt / 0.025) * Math.exp(-lt * 2.4);
          out[i] += ch * env * 0.45;
        }
      }
      this._bandPass(out, 60, 2800, sr);
      this._fade(out, 10, 110, sr);
      this.sfxBank.gameover_sting = this._toMonoBuffer(out, 0.44, sr);
    }
  }

  playSfx(name, sfxKey = null, comboIdx = 0) {
    if (!this.ensureContext() || !this.sfxBank) return;
    let buf = null;
    if (name === "type") {
      const set = this.sfxBank.type_sets[sfxKey || "gun"];
      buf = set[clamp(comboIdx, 0, set.length - 1)];
    } else {
      buf = this.sfxBank[name];
    }
    if (!buf) return;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.connect(this.sfxGain);
    src.start(0);
  }

  _synthPs2Bgm(trackKey) {
    const sr = 24000;
    const cfg = GAME_DATA.BGM_PRESETS[trackKey] || GAME_DATA.BGM_PRESETS.stage1;
    const style = cfg.style;
    const numBars = 8;
    const bar = (60.0 / cfg.bpm) * 4.0;
    const beat = bar * 0.25;
    const step16 = beat * 0.25;
    const step8 = beat * 0.5;
    const dur = bar * numBars;
    const n = Math.floor(sr * dur);
    const N = this.noteFreqs;
    const twoPi = 2 * Math.PI;

    const dryL = new Float32Array(n), dryR = new Float32Array(n);
    const wetL = new Float32Array(n), wetR = new Float32Array(n);

    const addStereo = (bL, bR, s0, sig, gL, gR) => {
      const len = sig.length;
      for (let i = 0; i < len; i++) {
        const idx = (s0 + i) % n;
        if (gL) bL[idx] += sig[i] * gL;
        if (gR) bR[idx] += sig[i] * gR;
      }
    };
    const panG = (pan) => {
      const a = (pan + 1) * Math.PI * 0.25;
      return [Math.cos(a), Math.sin(a)];
    };

    // 1. Stereo Orchestral Strings + Cello
    const barN = Math.floor(bar * sr);
    const strL = new Float32Array(n), strR = new Float32Array(n);
    for (let bIdx = 0; bIdx < cfg.chords.length; bIdx++) {
      const [bfKey, chKeys] = cfg.chords[bIdx];
      const s0 = Math.floor(bIdx * bar * sr);
      const segL = new Float32Array(barN), segR = new Float32Array(barN);
      const fCello = N[bfKey] * 2.0;
      for (let i = 0; i < barN; i++) {
        const t = i / sr;
        const pc = twoPi * fCello * t;
        const cVal = (Math.sin(pc)*0.65 + Math.sin(2*pc)*0.25 + Math.sin(3*pc)*0.12) * 0.35;
        segL[i] += cVal; segR[i] += cVal;
      }
      for (let ci = 0; ci < chKeys.length; ci++) {
        const f = N[chKeys[ci]] * ((ci === 0 && (style === "orch_piano" || style === "crystal_synth")) ? 2.0 : 1.0);
        const [gL, gR] = panG(-0.48 + 0.32 * (ci % 3));
        for (let i = 0; i < barN; i++) {
          const t = i / sr;
          const pb = twoPi * f * t;
          const phL = pb * 0.9965 + f * 0.0004 * Math.sin(twoPi * 5.2 * t);
          const phR = pb * 1.0035 + f * 0.0004 * Math.cos(twoPi * 5.2 * t);
          const vL = Math.sin(phL)*0.55 + Math.sin(2*phL)*0.28 + Math.sin(3*phL)*0.16 + Math.sin(4*phL)*0.09;
          const vR = Math.sin(phR)*0.55 + Math.sin(2*phR)*0.28 + Math.sin(3*phR)*0.16 + Math.sin(4*phR)*0.09;
          segL[i] += (vL*0.72 + vR*0.28) * gL;
          segR[i] += (vR*0.72 + vL*0.28) * gR;
        }
      }
      const invC = 0.24 / chKeys.length;
      const barSec = barN / sr;
      for (let i = 0; i < barN; i++) {
        const t = i / sr;
        const env = Math.min(1, t / 0.14) * Math.min(1, (barSec - t) / 0.10) * invC;
        const idx = (s0 + i) % n;
        strL[idx] += segL[i] * env;
        strR[idx] += segR[i] * env;
      }
    }
    this._bandPass(strL, 120, style === "crystal_synth" ? 4600 : 3200, sr);
    this._bandPass(strR, 120, style === "crystal_synth" ? 4600 : 3200, sr);
    for (let i = 0; i < n; i++) { wetL[i] += strL[i]; wetR[i] += strR[i]; }

    // 2. Electric Bass + Overdrive Rock Guitar + FM Rhodes Piano + Stereo Crystal Arpeggio
    const bassPat = (cfg.groove === "funk" || cfg.groove === "boss")
      ? [1,0,1,2,0,1,0,1,1,0,2,1,0,1,2,1]
      : [1,0,0,1,2,0,1,0,1,0,0,1,2,0,1,2];
    const isRock = (style === "adventure_rock" || style === "gothic_rock" || style === "epic_rock" || style === "boss_metal");
    const gtrL = isRock ? new Float32Array(n) : null;
    const gtrR = isRock ? new Float32Array(n) : null;

    for (let bIdx = 0; bIdx < cfg.chords.length; bIdx++) {
      const [bfKey, chKeys] = cfg.chords[bIdx];
      const bf = N[bfKey];
      const chFreqs = chKeys.map(ck => N[ck]);

      for (let s16 = 0; s16 < 16; s16++) {
        const bp = bassPat[s16];
        if (!bp) continue;
        const s0 = Math.floor((bIdx * 16 + s16) * step16 * sr);
        const bn = Math.floor(step16 * ((s16 === 0 || s16 === 8) ? 1.75 : 0.95) * sr);
        const fB = bf * (bp === 2 ? 2.0 : 1.0);
        const bSec = bn / sr;
        for (let i = 0; i < bn; i++) {
          const t = i / sr;
          const wb = twoPi * fB * t;
          const sub = Math.sin(wb) * Math.exp(-t * 4.2);
          const mid = (Math.sin(2*wb)*0.55 + Math.sin(3*wb)*0.25) * Math.exp(-t * 13.5);
          const env = Math.min(1, t / 0.004) * Math.min(1, (bSec - t) / 0.012);
          const v = Math.tanh((sub + mid) * 1.45) * env * 0.30;
          const idx = (s0 + i) % n;
          dryL[idx] += v; dryR[idx] += v;
        }
      }

      if (isRock) {
        const gSteps = style === "boss_metal" ? [0,2,3,6,8,10,11,14] : [0,3,6,8,11,14];
        const drive = style === "boss_metal" ? 3.3 : 2.6;
        const fRoot = bf * 2.0, f5 = fRoot * 1.4983;
        for (const s16 of gSteps) {
          const s0 = Math.floor((bIdx * 16 + s16) * step16 * sr);
          const isOpen = (s16 === 0 || s16 === 8);
          const gn = Math.floor(step16 * (isOpen ? 2.4 : 0.95) * sr);
          const gSec = gn / sr, dec = isOpen ? 3.2 : 14.0;
          for (let i = 0; i < gn; i++) {
            const t = i / sr;
            const wr = twoPi * fRoot * t, w5 = twoPi * f5 * t;
            const env = Math.min(1, t / 0.004) * Math.exp(-t * dec) * Math.min(1, (gSec - t) / 0.01) * 0.15;
            const gl = Math.tanh((Math.sin(wr) + 0.8*Math.sin(w5) + 0.5*Math.sin(2*wr) + 0.35*Math.sin(3*wr)) * drive) * env;
            const gr = Math.tanh((Math.sin(wr*1.004) + 0.8*Math.sin(w5*0.996) + 0.5*Math.sin(2*wr*1.003) + 0.35*Math.sin(3*wr*0.997)) * drive) * env;
            const idx = (s0 + i) % n;
            gtrL[idx] += gl*0.88 + gr*0.22;
            gtrR[idx] += gl*0.22 + gr*0.88;
          }
        }
      }

      const epSteps = (style === "orch_piano" || style === "sky_fusion" || style === "crystal_synth") ? [0,3,6,8,12,14] : [2,6,10,14];
      const [epL, epR] = panG(style === "crystal_synth" ? 0.30 : -0.35);
      const gainP = (style === "orch_piano" || style === "sky_fusion" || style === "crystal_synth") ? 0.22 : 0.14;
      const epNotes = chFreqs.slice(0, 3);
      for (const s16 of epSteps) {
        const s0 = Math.floor((bIdx * 16 + s16) * step16 * sr);
        const pn = Math.floor(step16 * (style === "orch_piano" ? 2.6 : 1.5) * sr);
        const pSec = pn / sr;
        for (let i = 0; i < pn; i++) {
          const t = i / sr;
          let pSum = 0;
          for (let c = 0; c < epNotes.length; c++) {
            const wc = twoPi * epNotes[c] * t;
            const tine = Math.sin(7 * wc) * Math.exp(-t * 24) * 0.45;
            pSum += Math.sin(wc + tine) * Math.exp(-t * 3.6) + 0.25 * Math.sin(2*wc) * Math.exp(-t * 8.5);
          }
          const env = (gainP / epNotes.length) * Math.min(1, t / 0.003) * Math.min(1, (pSec - t) / 0.015);
          const v = pSum * env;
          const idx = (s0 + i) % n;
          wetL[idx] += v * epL; wetR[idx] += v * epR;
        }
      }

      if (style === "crystal_synth" || style === "orch_piano" || style === "sky_fusion" || style === "gothic_rock") {
        const fmGain = style === "crystal_synth" ? 1.1 : 0.45;
        for (let s8 = 0; s8 < 8; s8++) {
          const s0 = Math.floor((bIdx * 8 + s8) * step8 * sr);
          const an = Math.floor(step8 * 1.45 * sr);
          const af = chFreqs[s8 % chFreqs.length] * ((s8 % 2) ? 2.0 : 1.0);
          const [aL, aR] = panG((s8 % 2 === 0) ? -0.55 : 0.55);
          for (let i = 0; i < an; i++) {
            const t = i / sr;
            const wa = twoPi * af * t;
            const mod = Math.sin(3 * wa) * Math.exp(-t * 18) * fmGain;
            const v = Math.sin(wa + mod) * Math.min(1, t / 0.003) * Math.exp(-t * 6.2) * 0.11;
            const idx = (s0 + i) % n;
            wetL[idx] += v * aL; wetR[idx] += v * aR;
          }
        }
      }
    }

    if (isRock) {
      this._bandPass(gtrL, 180, 3400, sr);
      this._bandPass(gtrR, 180, 3400, sr);
      for (let i = 0; i < n; i++) {
        dryL[i] += gtrL[i] * 0.65; dryR[i] += gtrR[i] * 0.65;
        wetL[i] += gtrL[i] * 0.35; wetR[i] += gtrR[i] * 0.35;
      }
    }

    // 3. Expressive PS2 Stereo Lead + Ping-Pong Delay
    const leadL = new Float32Array(n), leadR = new Float32Array(n);
    const mel = cfg.melody;
    for (let idx = 0; idx < mel.length; idx++) {
      const nm = mel[idx];
      if (!nm) continue;
      const s0 = Math.floor(idx * step8 * sr);
      const hold = (idx + 1 < mel.length && mel[idx + 1] === null) ? 1.85 : 0.96;
      const ln = Math.floor(hold * step8 * sr);
      const lSec = ln / sr;
      const fRaw = N[nm];
      const f = fRaw > 1050 ? fRaw * 0.5 : fRaw;
      for (let i = 0; i < ln; i++) {
        const t = i / sr;
        const vibPh = f * 0.0012 * Math.min(1, t / 0.14) * Math.sin(twoPi * 5.8 * t);
        const p1 = twoPi * f * 0.9978 * t + vibPh;
        const p2 = twoPi * f * 1.0022 * t + vibPh;
        const pSub = twoPi * (f * 0.5) * t + vibPh * 0.5;
        let vL, vR, env;
        if (style === "orch_piano") {
          const br = Math.exp(-t * 4.5);
          vL = Math.sin(p1)*0.52 + Math.sin(2*p1)*(0.28+0.14*br) + Math.sin(3*p1)*0.15 + Math.sin(pSub)*0.24;
          vR = Math.sin(p2)*0.52 + Math.sin(2*p2)*(0.28+0.14*br) + Math.sin(3*p2)*0.15 + Math.sin(pSub)*0.24;
          env = Math.min(1, t/0.025) * Math.exp(-t*1.55) * Math.min(1, (lSec - t)/0.03);
        } else if (style === "adventure_rock" || style === "epic_rock" || style === "boss_metal") {
          const br = 0.35 + 0.65 * Math.exp(-t * 4.8);
          vL = Math.tanh((Math.sin(p1)*0.50 + Math.sin(2*p1)*0.34 + Math.sin(3*p1)*0.22*br + Math.sin(4*p1)*0.14*br + Math.sin(pSub)*0.32) * 1.32);
          vR = Math.tanh((Math.sin(p2)*0.50 + Math.sin(2*p2)*0.34 + Math.sin(3*p2)*0.22*br + Math.sin(4*p2)*0.14*br + Math.sin(pSub)*0.32) * 1.32);
          env = Math.min(1, t/0.032) * Math.exp(-t*1.85) * Math.min(1, (lSec - t)/0.025);
        } else if (style === "crystal_synth") {
          const fm = Math.sin(2*twoPi*f*t) * (1.1*Math.exp(-t*6) + 0.28);
          vL = Math.sin(p1 + fm)*0.60 + Math.sin(2*p1)*0.20 + Math.sin(pSub)*0.26;
          vR = Math.sin(p2 + fm)*0.60 + Math.sin(2*p2)*0.20 + Math.sin(pSub)*0.26;
          env = Math.min(1, t/0.015) * Math.exp(-t*1.9) * Math.min(1, (lSec - t)/0.03);
        } else {

function tokenizeKana(kanaStr) {
  const RT = GAME_DATA.ROMAJI_TABLE;
  const tokens = [];
  let i = 0;
  while (i < kanaStr.length) {
    const two = kanaStr.slice(i, i + 2);
    const one = kanaStr[i];
    if (i + 1 < kanaStr.length && RT[two]) {
      tokens.push(RT[two].slice());
      i += 2;
    } else if (one === 'っ' && i + 1 < kanaStr.length) {
      const n2 = kanaStr.slice(i + 1, i + 3), n1 = kanaStr[i + 1];
      const opts = RT[n2] || RT[n1] || [''];
      const soku = [];
      for (const o of opts) {
        if (o && !'AEIOUN-'.includes(o[0]) && !soku.includes(o[0])) soku.push(o[0]);
      }
      if (!soku.includes('XTU')) soku.push('XTU');
      if (!soku.includes('LTU')) soku.push('LTU');
      tokens.push(soku);
      i += 1;
    } else if (RT[one]) {
      tokens.push(RT[one].slice());
      i += 1;
    } else if (/^[A-Za-z-]$/.test(one)) {
      tokens.push([one.toUpperCase()]);
      i += 1;
    } else {
      i += 1;
    }
  }
  for (let idx = 0; idx < tokens.length - 1; idx++) {
    if (tokens[idx].includes('NN')) {
      const nextFirsts = new Set(tokens[idx + 1].filter(Boolean).map(o => o[0]));
      let blockSingle = false;
      for (const ch of 'AEIOUNY') { if (nextFirsts.has(ch)) { blockSingle = true; break; } }
      tokens[idx] = blockSingle ? ['NN', 'XN'] : ['N', 'NN', 'XN'];
    }
  }
  if (tokens.length && tokens[tokens.length - 1].includes('NN')) {
    tokens[tokens.length - 1] = ['NN', 'XN'];
  }
  return tokens;
}

const M4 = {
  ident() {
    const m = new Float32Array(16);
    m[0] = m[5] = m[10] = m[15] = 1;
    return m;
  },
  mul(a, b, out = new Float32Array(16)) {
    for (let c = 0; c < 4; c++) {
      const b0 = b[c*4], b1 = b[c*4+1], b2 = b[c*4+2], b3 = b[c*4+3];
      out[c*4]   = a[0]*b0 + a[4]*b1 + a[8]*b2  + a[12]*b3;
      out[c*4+1] = a[1]*b0 + a[5]*b1 + a[9]*b2  + a[13]*b3;
      out[c*4+2] = a[2]*b0 + a[6]*b1 + a[10]*b2 + a[14]*b3;
      out[c*4+3] = a[3]*b0 + a[7]*b1 + a[11]*b2 + a[15]*b3;
    }
    return out;
  },
  fromTRS(px, py, pz, rxDeg, ryDeg, rzDeg, sx, sy, sz, out = new Float32Array(16)) {
    // M = T * Ry * Rx * Rz * S (Left-handed +X right, +Y up, +Z forward)
    const rx = rxDeg * Math.PI / 180, ry = ryDeg * Math.PI / 180, rz = rzDeg * Math.PI / 180;
    const cx = Math.cos(rx), sinx = Math.sin(rx);
    const cy = Math.cos(ry), siny = Math.sin(ry);
    const cz = Math.cos(rz), sinz = Math.sin(rz);

    // R = Ry * Rx * Rz
    const r00 = cy * cz + siny * sinx * sinz;
    const r10 = cx * sinz;
    const r20 = -siny * cz + cy * sinx * sinz;

    const r01 = -cy * sinz + siny * sinx * cz;
    const r11 = cx * cz;
    const r21 = siny * sinz + cy * sinx * cz;

    const r02 = siny * cx;
    const r12 = -sinx;
    const r22 = cy * cx;

    out[0] = r00 * sx; out[1] = r10 * sx; out[2] = r20 * sx; out[3] = 0;
    out[4] = r01 * sy; out[5] = r11 * sy; out[6] = r21 * sy; out[7] = 0;
    out[8] = r02 * sz; out[9] = r12 * sz; out[10] = r22 * sz; out[11] = 0;
    out[12] = px;      out[13] = py;      out[14] = pz;      out[15] = 1;
    return out;
  },
  perspectiveLH(fovYDeg, aspect, near, far) {
    const f = 1.0 / Math.tan(fovYDeg * Math.PI / 360);
    const m = new Float32Array(16);
    m[0] = f / aspect;
    m[5] = f;
    m[10] = (far + near) / (far - near);
    m[11] = 1.0;
    m[14] = (-2.0 * far * near) / (far - near);
    return m;
  },
  viewFromCamera(px, py, pz, rxDeg, ryDeg, rzDeg) {
    // R_cam = Ry * Rx * Rz; V = R_cam^T * T(-p)
    const R = M4.fromTRS(0, 0, 0, rxDeg, ryDeg, rzDeg, 1, 1, 1);
    const V = new Float32Array(16);
    V[0] = R[0]; V[1] = R[4]; V[2] = R[8];  V[3] = 0;
    V[4] = R[1]; V[5] = R[5]; V[6] = R[9];  V[7] = 0;
    V[8] = R[2]; V[9] = R[6]; V[10] = R[10]; V[11] = 0;
    V[12] = -(V[0]*px + V[4]*py + V[8]*pz);
    V[13] = -(V[1]*px + V[5]*py + V[9]*pz);
    V[14] = -(V[2]*px + V[6]*py + V[10]*pz);
    V[15] = 1;
    return {
      view: V,
      right: [R[0], R[1], R[2]],
      up: [R[4], R[5], R[6]],
      fwd: [R[8], R[9], R[10]],
    };
  },
  transformPt(m, x, y, z) {
    const w = m[3]*x + m[7]*y + m[11]*z + m[15];
    return [
      m[0]*x + m[4]*y + m[8]*z + m[12],
      m[1]*x + m[5]*y + m[9]*z + m[13],
      m[2]*x + m[6]*y + m[10]*z + m[14],
      w
    ];
  }
};

    pos.push(0,0,0, x0,y0,0, x1,y1,0);
    norm.push(0,0,-1, 0,0,-1, 0,0,-1);
    uv.push(0.5,0.5, x0+0.5,y0+0.5, x1+0.5,y1+0.5);
  }
  return { pos: new Float32Array(pos), norm: new Float32Array(norm), uv: new Float32Array(uv), count: pos.length / 3 };
}

function buildSphereGeo(latSegs = 10, lonSegs = 14) {
  const pos = [], norm = [], uv = [];
  const pt = (lat, lon) => {
    const th = (lat / latSegs) * Math.PI;
    const ph = (lon / lonSegs) * Math.PI * 2;
    const st = Math.sin(th), ct = Math.cos(th);
    const nx = st * Math.cos(ph), ny = ct, nz = st * Math.sin(ph);
    return { p:[nx*0.5, ny*0.5, nz*0.5], n:[nx, ny, nz], u:[lon/lonSegs, 1 - lat/latSegs] };
  };
  for (let la = 0; la < latSegs; la++) {
    for (let lo = 0; lo < lonSegs; lo++) {
      const a = pt(la, lo), b = pt(la+1, lo), c = pt(la+1, lo+1), d = pt(la, lo+1);
      for (const v of [a,b,c, a,c,d]) {
        pos.push(...v.p); norm.push(...v.n); uv.push(...v.u);
      }
    }
  }
  return { pos: new Float32Array(pos), norm: new Float32Array(norm), uv: new Float32Array(uv), count: pos.length / 3 };
}

function buildConeGeo(segs = 12) {
  const pos = [], norm = [], uv = [];
  const tip = [0, 0.5, 0];
  for (let i = 0; i < segs; i++) {
    const a0 = (i / segs) * Math.PI * 2, a1 = ((i + 1) / segs) * Math.PI * 2;
    const x0 = Math.cos(a0)*0.5, z0 = Math.sin(a0)*0.5;
    const x1 = Math.cos(a1)*0.5, z1 = Math.sin(a1)*0.5;
    const nx0 = Math.cos(a0)*0.894, nz0 = Math.sin(a0)*0.894;
    const nx1 = Math.cos(a1)*0.894, nz1 = Math.sin(a1)*0.894;
    // Side
    pos.push(...tip, x0,-0.5,z0, x1,-0.5,z1);
    norm.push((nx0+nx1)*0.5, 0.447, (nz0+nz1)*0.5, nx0,0.447,nz0, nx1,0.447,nz1);
    uv.push(0.5,1, i/segs,0, (i+1)/segs,0);
    // Base cap
    pos.push(0,-0.5,0, x1,-0.5,z1, x0,-0.5,z0);
    norm.push(0,-1,0, 0,-1,0, 0,-1,0);
    uv.push(0.5,0.5, x1+0.5,z1+0.5, x0+0.5,z0+0.5);
  }
  return { pos: new Float32Array(pos), norm: new Float32Array(norm), uv: new Float32Array(uv), count: pos.length / 3 };
}

function buildDiamondGeo() {
  return buildSphereGeo(2, 4);
}

// --- Procedural Canvas Textures (matching Python build_textures 1:1) ---
function createProceduralTextures(gl) {
  const texMap = {};
  const rng = makeRng(101);
  const randInt = (a, b) => a + Math.floor(rng() * (b - a + 1));

  function makeCanvas(w, h, drawFn) {
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    drawFn(ctx, w, h);
    return cv;
  }

  function uploadTex(key, cv, clampEdge = false) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
    const wrap = clampEdge ? gl.CLAMP_TO_EDGE : gl.REPEAT;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    const isPow2 = (cv.width & (cv.width - 1)) === 0 && (cv.height & (cv.height - 1)) === 0;
    if (isPow2 && !clampEdge) {
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    } else {
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    }
    texMap[key] = { tex: t, clampEdge, isPow2 };
  }

  function fillNoise(ctx, w, h, lo, hi, rM, gM, bM) {
    const img = ctx.createImageData(w, h);
    const d = img.data;
    for (let i = 0; i < w * h; i++) {
      const v = lo + rng() * (hi - lo);
      d[i*4]   = clamp(Math.floor(v * rM), 0, 255);
      d[i*4+1] = clamp(Math.floor(v * gM), 0, 255);
      d[i*4+2] = clamp(Math.floor(v * bM), 0, 255);
      d[i*4+3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }

  // white
  uploadTex('white', makeCanvas(4, 4, (ctx) => { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 4, 4); }));

  // stone
  uploadTex('stone', makeCanvas(256, 256, (ctx, w, h) => {
    fillNoise(ctx, w, h, 112, 142, 1.03, 1.0, 0.90);
    ctx.strokeStyle = 'rgb(75,78,68)'; ctx.lineWidth = 3;
    for (let y = 0; y < 256; y += 32) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
      const off = ((y / 32) % 2) ? 18 : 0;
      for (let x = off; x < 256; x += 48) {
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 32); ctx.stroke();
      }
    }
    ctx.fillStyle = 'rgba(78,128,62,0.85)';
    for (let i = 0; i < 55; i++) {
      const mx = randInt(0, 240), my = randInt(0, 240), mr = randInt(5, 14);
      ctx.beginPath(); ctx.ellipse(mx, my, mr*0.5, mr*0.35, 0, 0, Math.PI*2); ctx.fill();
    }
  }));

  // wood
  uploadTex('wood', makeCanvas(256, 256, (ctx, w, h) => {
    fillNoise(ctx, w, h, 104, 134, 1.15, 0.92, 0.65);
    ctx.strokeStyle = 'rgb(65,45,30)'; ctx.lineWidth = 3;
    for (let y = 0; y < 256; y += 28) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
    }
  }));

  // brick
  uploadTex('brick', makeCanvas(256, 256, (ctx, w, h) => {
    fillNoise(ctx, w, h, 122, 152, 1.06, 1.0, 0.92);
    ctx.strokeStyle = 'rgb(84,78,70)'; ctx.lineWidth = 2;
    for (let y = 0; y < 256; y += 24) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
      const off = ((y / 24) % 2) ? 20 : 0;
      for (let x = off; x < 256; x += 44) {
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 24); ctx.stroke();
      }
    }
  }));

  // carpet
  uploadTex('carpet', makeCanvas(128, 256, (ctx) => {
    ctx.fillStyle = 'rgb(138,36,42)'; ctx.fillRect(0, 0, 128, 256);
    ctx.fillStyle = 'rgb(215,175,78)'; ctx.fillRect(10, 0, 8, 256); ctx.fillRect(110, 0, 8, 256);
  }));

  // grass
  uploadTex('grass', makeCanvas(256, 256, (ctx, w, h) => {
    fillNoise(ctx, w, h, 58, 92, 1.0, 1.55, 0.65);
    ctx.strokeStyle = 'rgb(92,152,65)'; ctx.lineWidth = 2;
    for (let i = 0; i < 300; i++) {
      const gx = randInt(0, 255), gy = randInt(0, 255);
      ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + randInt(-3, 3), gy + randInt(4, 10)); ctx.stroke();
    }
  }));

  // rock
  uploadTex('rock', makeCanvas(256, 256, (ctx, w, h) => {
    fillNoise(ctx, w, h, 108, 140, 1.12, 1.0, 0.85);
  }));

  // bark
  uploadTex('bark', makeCanvas(128, 128, (ctx, w, h) => {
    fillNoise(ctx, w, h, 76, 102, 1.18, 0.85, 0.56);
  }));

  // stained glass
  uploadTex('stained', makeCanvas(128, 256, (ctx) => {
    ctx.fillStyle = 'rgb(40,85,160)'; ctx.fillRect(0, 0, 128, 256);
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgb(35,35,45)';
    ctx.fillStyle = 'rgb(235,195,70)'; ctx.fillRect(16, 16, 96, 104); ctx.strokeRect(16, 16, 96, 104);
    ctx.fillStyle = 'rgb(75,185,225)'; ctx.fillRect(16, 130, 44, 110); ctx.strokeRect(16, 130, 44, 110);
    ctx.fillStyle = 'rgb(215,85,110)'; ctx.fillRect(68, 130, 44, 110); ctx.strokeRect(68, 130, 44, 110);
    ctx.fillStyle = 'rgb(255,245,190)'; ctx.beginPath(); ctx.arc(64, 68, 28, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  }));

  // tapestry
  uploadTex('tapestry', makeCanvas(64, 128, (ctx) => {
    ctx.fillStyle = 'rgb(132,28,34)'; ctx.fillRect(0, 0, 64, 128);
    ctx.strokeStyle = 'rgb(218,178,78)'; ctx.lineWidth = 3; ctx.strokeRect(6, 6, 52, 116);
    ctx.fillStyle = 'rgb(218,178,78)';
    ctx.beginPath(); ctx.moveTo(32, 34); ctx.lineTo(48, 64); ctx.lineTo(32, 94); ctx.lineTo(16, 64); ctx.closePath(); ctx.fill();
  }));

  // crate
  uploadTex('crate', makeCanvas(64, 64, (ctx) => {
    ctx.fillStyle = 'rgb(118,84,52)'; ctx.fillRect(0, 0, 64, 64);
    ctx.strokeStyle = 'rgb(68,46,26)'; ctx.lineWidth = 5; ctx.strokeRect(2, 2, 60, 60);
    ctx.strokeStyle = 'rgb(78,54,32)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(6, 6); ctx.lineTo(58, 58); ctx.moveTo(58, 6); ctx.lineTo(6, 58); ctx.stroke();
  }));

  // roof
  uploadTex('roof', makeCanvas(128, 128, (ctx) => {
    ctx.fillStyle = 'rgb(74,56,52)'; ctx.fillRect(0, 0, 128, 128);
    for (let ry = 0; ry < 128; ry += 16) {
      ctx.strokeStyle = 'rgb(48,36,34)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(128, ry); ctx.stroke();
      ctx.strokeStyle = 'rgb(54,40,38)'; ctx.lineWidth = 2;
      for (let rx = ((ry / 16) % 2) * 12; rx < 128; rx += 24) {
        ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx, ry + 16); ctx.stroke();
      }
    }
  }));

  // bars (transparent iron bars)
  uploadTex('bars', makeCanvas(128, 128, (ctx) => {
    ctx.clearRect(0, 0, 128, 128);
    ctx.fillStyle = 'rgb(42,46,52)';
    for (let bx = 10; bx < 128; bx += 22) ctx.fillRect(bx, 0, 6, 128);
    ctx.fillStyle = 'rgb(38,42,48)';
    ctx.fillRect(0, 26, 128, 8); ctx.fillRect(0, 92, 128, 8);
  }));

  // bookshelf
  uploadTex('bookshelf', makeCanvas(128, 128, (ctx) => {
    ctx.fillStyle = 'rgb(58,38,24)'; ctx.fillRect(0, 0, 128, 128);
    const cols = ['rgb(145,45,42)','rgb(42,78,125)','rgb(48,102,58)','rgb(168,132,48)','rgb(105,58,108)','rgb(138,86,48)'];
    for (const sy of [4, 36, 68, 100]) {
      ctx.fillStyle = 'rgb(42,26,16)'; ctx.fillRect(0, sy + 24, 128, 4);
      let bx = 4;
      while (bx < 120) {
        const bw = randInt(6, 12), bh = randInt(18, 23);
        ctx.fillStyle = cols[randInt(0, cols.length - 1)];
        ctx.fillRect(bx, sy + (24 - bh), Math.min(124 - bx, bw - 1), bh);
        bx += bw;
      }
    }
  }));

  // soft_beam
  uploadTex('soft_beam', makeCanvas(64, 128, (ctx, w, h) => {
    const img = ctx.createImageData(w, h);
    const d = img.data;
    for (let y = 0; y < h; y++) {
      const ny = y / (h - 1);
      const vy = Math.min(1, ny / 0.14) * Math.pow(1 - ny, 1.85);
      for (let x = 0; x < w; x++) {
        const nx = x / (w - 1);
        const edge = Math.pow(Math.sin(Math.PI * nx), 2.2);
        const rays = 0.58 + 0.42 * Math.pow(Math.sin(nx * Math.PI * 5), 2);
        const idx = (y * w + x) * 4;
        d[idx] = 255; d[idx+1] = 250; d[idx+2] = 238;
        d[idx+3] = Math.floor(110 * edge * vy * rays);
      }
    }
    ctx.putImageData(img, 0, 0);
  }), true);

  // soft_glow
  uploadTex('soft_glow', makeCanvas(128, 128, (ctx, w, h) => {
    const img = ctx.createImageData(w, h);
    const d = img.data;
    for (let y = 0; y < h; y++) {
      const dy = (y - 63.5) / 63.5;
      for (let x = 0; x < w; x++) {
        const dx = (x - 63.5) / 63.5;
        const r2 = dx*dx + dy*dy;
        const idx = (y * w + x) * 4;
        d[idx] = 255; d[idx+1] = 248; d[idx+2] = 234;
        d[idx+3] = r2 < 1 ? Math.floor(145 * Math.exp(-r2 * 4.2) * Math.pow(1 - r2, 1.5)) : 0;
      }
    }
    ctx.putImageData(img, 0, 0);
  }), true);

  // 5 Skies
  const makeSky = (top, mid, bot, clouds) => makeCanvas(256, 256, (ctx) => {
    const grad = ctx.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0.0, `rgb(${top[0]},${top[1]},${top[2]})`);
    grad.addColorStop(0.5, `rgb(${mid[0]},${mid[1]},${mid[2]})`);
    grad.addColorStop(1.0, `rgb(${bot[0]},${bot[1]},${bot[2]})`);
    ctx.fillStyle = grad; ctx.fillRect(0, 0, 256, 256);
    if (clouds) {
      ctx.fillStyle = 'rgba(255,252,245,0.26)';
      for (let i = 0; i < 18; i++) {
        const cx = randInt(0, 255), cy = randInt(45, 135), rw = randInt(24, 58), rh = randInt(8, 18);
        ctx.beginPath(); ctx.ellipse(cx, cy, rw, rh, 0, 0, Math.PI*2); ctx.fill();
      }
    }
  });
  uploadTex('sky_morning',   makeSky([52,128,215], [125,195,242], [218,238,245], true), true);
  uploadTex('sky_afternoon', makeSky([68,118,185], [158,186,215], [232,218,195], true), true);
  uploadTex('sky_clear',     makeSky([30,108,218], [95,178,245],  [210,238,255], true), true);
  uploadTex('sky_crystal',   makeSky([16,28,52],   [32,58,92],    [48,86,118],   false), true);
  uploadTex('sky_sunset',    makeSky([62,46,108],  [212,106,68],  [255,198,112], true), true);

  return texMap;
}

// --- WebGL Renderer & Batched Stage Drawing ---
class WebGLRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    const gl = canvas.getContext('webgl', { alpha: false, antialias: true, powerPreference: 'high-performance' })
            || canvas.getContext('experimental-webgl', { alpha: false, antialias: true });
    if (!gl) throw new Error("WebGLが利用できません。Chromeのハードウェアアクセラレーション設定をご確認ください。");
    this.gl = gl;

    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.disable(gl.CULL_FACE);

    this.textures = createProceduralTextures(gl);
    this.geos = {
      cube: buildCubeGeo(),
      quad: buildQuadGeo(),
      circle: buildCircleGeo(18),
      sphere: buildSphereGeo(10, 14),
      icosphere: buildSphereGeo(6, 9),
      cone: buildConeGeo(12),
      diamond: buildDiamondGeo(),
    };
    this.geoVBOs = {};
    for (const [k, g] of Object.entries(this.geos)) {
      this.geoVBOs[k] = this._createDynamicGeoVBO(g);
    }

    this.opaqueProg = this._compileProgram(
      `attribute vec3 aPos;
       attribute vec3 aNorm;
       attribute vec2 aUv;
       attribute vec4 aCol;
       uniform mat4 uModel;
       uniform mat4 uView;
       uniform mat4 uProj;
       uniform vec2 uUvScale;
       varying vec2 vUv;
       varying vec4 vCol;
       varying vec3 vNorm;
       varying float vDist;
       void main() {
         vec4 wp = uModel * vec4(aPos, 1.0);
         vec4 vp = uView * wp;
         vDist = length(vp.xyz);
         gl_Position = uProj * vp;
         vUv = aUv * uUvScale;
         vCol = aCol;
         vNorm = normalize(mat3(uModel) * aNorm);
       }`,
      `precision mediump float;
       uniform sampler2D uTex;
       uniform vec4 uColor;
       uniform vec3 uFogColor;
       uniform float uFogNear;
       uniform float uFogFar;
       uniform float uUseFog;
       uniform float uShade;
       varying vec2 vUv;
       varying vec4 vCol;
       varying vec3 vNorm;
       varying float vDist;
       void main() {
         vec4 tc = texture2D(uTex, vUv) * vCol * uColor;
         if (tc.a < 0.05) discard;
         vec3 sunDir = normalize(vec3(0.42, 0.78, 0.46));
         float ndl = abs(dot(normalize(vNorm), sunDir));
         float light = mix(1.0, 0.76 + 0.28 * ndl, uShade);
         vec3 rgb = tc.rgb * light;
         if (uUseFog > 0.5) {
           float t = clamp((vDist - uFogNear) / max(1.0, uFogFar - uFogNear), 0.0, 1.0);
           float haze = pow(t, 1.15);
           rgb = mix(rgb, uFogColor, haze * 0.94);
         }
         gl_FragColor = vec4(rgb, tc.a);
       }`
    );

    this.batchProg = this._compileProgram(
      `attribute vec3 aPos;
       attribute vec3 aNorm;
       attribute vec2 aUv;
       attribute vec4 aCol;
       uniform mat4 uView;
       uniform mat4 uProj;
       varying vec2 vUv;
       varying vec4 vCol;
       varying vec3 vNorm;
       varying float vDist;
       void main() {
         vec4 vp = uView * vec4(aPos, 1.0);
         vDist = length(vp.xyz);
         gl_Position = uProj * vp;
         vUv = aUv;
         vCol = aCol;
         vNorm = aNorm;
       }`,
      `precision mediump float;
       uniform sampler2D uTex;
       uniform vec3 uFogColor;
       uniform float uFogNear;
       uniform float uFogFar;
       uniform float uUseFog;
       varying vec2 vUv;
       varying vec4 vCol;
       varying vec3 vNorm;
       varying float vDist;
       void main() {
         vec4 tc = texture2D(uTex, vUv) * vCol;
         if (tc.a < 0.05) discard;
         vec3 sunDir = normalize(vec3(0.42, 0.78, 0.46));
         float ndl = abs(dot(normalize(vNorm), sunDir));
         vec3 rgb = tc.rgb * (0.76 + 0.28 * ndl);
         if (uUseFog > 0.5) {
           float t = clamp((vDist - uFogNear) / max(1.0, uFogFar - uFogNear), 0.0, 1.0);
           float haze = pow(t, 1.15);
           rgb = mix(rgb, uFogColor, haze * 0.94);
         }
         gl_FragColor = vec4(rgb, tc.a);
       }`
    );

    this.camPos = [0, 2.2, 0];
    this.camRot = [0, 0, 0];
    this.camFwd = [0, 0, 1];
    this.camRight = [1, 0, 0];
    this.camUp = [0, 1, 0];
    this.viewMat = M4.ident();
    this.projMat = M4.perspectiveLH(62, 16/9, 0.45, 160);
    this.vpMat = M4.ident();
    this.fogColor = [0.78, 0.89, 0.94];
    this.fogNear = 10.0;
    this.fogFar = 58.0;
    this.useFog = true;
    this.clearColor = [0.47, 0.69, 0.86];
    this.skyTexKey = 'sky_morning';
    this.skyEnabled = true;
    this.clipFar = 160.0;
    this.resScale = 1.0;
    this.resize();
  }

  _compileProgram(vsSrc, fsSrc) {
    const gl = this.gl;
    const mk = (type, src) => {
      const sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(sh));
      }
      return sh;
    };
    const p = gl.createProgram();
    gl.attachShader(p, mk(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fsSrc));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(p));
    }
    return {
      prog: p,
      aPos: gl.getAttribLocation(p, 'aPos'),
      aNorm: gl.getAttribLocation(p, 'aNorm'),
      aUv: gl.getAttribLocation(p, 'aUv'),
      aCol: gl.getAttribLocation(p, 'aCol'),
      uModel: gl.getUniformLocation(p, 'uModel'),
      uView: gl.getUniformLocation(p, 'uView'),
      uProj: gl.getUniformLocation(p, 'uProj'),
      uUvScale: gl.getUniformLocation(p, 'uUvScale'),
      uTex: gl.getUniformLocation(p, 'uTex'),
      uColor: gl.getUniformLocation(p, 'uColor'),
      uFogColor: gl.getUniformLocation(p, 'uFogColor'),
      uFogNear: gl.getUniformLocation(p, 'uFogNear'),
      uFogFar: gl.getUniformLocation(p, 'uFogFar'),
      uUseFog: gl.getUniformLocation(p, 'uUseFog'),
      uShade: gl.getUniformLocation(p, 'uShade'),
    };
  }

  _createDynamicGeoVBO(g) {
    const gl = this.gl;
    // Interleaved: pos3 + norm3 + uv2 + col4 (white) = 12 floats/vertex
    const stride = 12;
    const data = new Float32Array(g.count * stride);
    for (let i = 0; i < g.count; i++) {
      data[i*12]   = g.pos[i*3];   data[i*12+1] = g.pos[i*3+1]; data[i*12+2] = g.pos[i*3+2];
      data[i*12+3] = g.norm[i*3];  data[i*12+4] = g.norm[i*3+1]; data[i*12+5] = g.norm[i*3+2];
      data[i*12+6] = g.uv[i*2];    data[i*12+7] = g.uv[i*2+1];
      data[i*12+8] = 1; data[i*12+9] = 1; data[i*12+10] = 1; data[i*12+11] = 1;
    }
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    return { buf, count: g.count };
  }

  createStaticBatch(items) {
    // Group items by texture key and bake world transforms + vertex colors into 1 VBO per texture!
    const gl = this.gl;
    const byTex = {};
    for (const it of items) {
      const tk = it.tex || 'white';
      if (!byTex[tk]) byTex[tk] = [];
      byTex[tk].push(it);
    }
    const groups = [];
    for (const [tk, list] of Object.entries(byTex)) {
      let totalVerts = 0;
      for (const it of list) totalVerts += this.geos[it.model].count;
      const data = new Float32Array(totalVerts * 12);
      let ptr = 0;
      for (const it of list) {
        const g = this.geos[it.model];
        const m = it.worldMat;
        const col = it.color || [1,1,1,1];
        const uvs = it.uvScale || [1,1];
        for (let i = 0; i < g.count; i++) {
          const px = g.pos[i*3], py = g.pos[i*3+1], pz = g.pos[i*3+2];
          const nx = g.norm[i*3], ny = g.norm[i*3+1], nz = g.norm[i*3+2];
          data[ptr]   = m[0]*px + m[4]*py + m[8]*pz  + m[12];
          data[ptr+1] = m[1]*px + m[5]*py + m[9]*pz  + m[13];
          data[ptr+2] = m[2]*px + m[6]*py + m[10]*pz + m[14];
          let wnx = m[0]*nx + m[4]*ny + m[8]*nz;
          let wny = m[1]*nx + m[5]*ny + m[9]*nz;
          let wnz = m[2]*nx + m[6]*ny + m[10]*nz;
          const nl = Math.hypot(wnx, wny, wnz) || 1;
          data[ptr+3] = wnx / nl; data[ptr+4] = wny / nl; data[ptr+5] = wnz / nl;
          data[ptr+6] = g.uv[i*2] * uvs[0];
          data[ptr+7] = g.uv[i*2+1] * uvs[1];
          data[ptr+8] = col[0]; data[ptr+9] = col[1]; data[ptr+10] = col[2]; data[ptr+11] = col[3];
          ptr += 12;
        }
      }
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
      groups.push({ texKey: tk, buf, count: totalVerts });
    }
    return groups;
  }

  destroyStaticBatch(groups) {
    if (!groups) return;
    for (const g of groups) this.gl.deleteBuffer(g.buf);
  }

  applyTextureFilterQuality(useMip) {
    const gl = this.gl;
    for (const t of Object.values(this.textures)) {
      gl.bindTexture(gl.TEXTURE_2D, t.tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, (useMip && t.isPow2 && !t.clampEdge) ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
    }
  }

  resize() {
    const w = Math.max(320, Math.floor(window.innerWidth * this.resScale));
    const h = Math.max(180, Math.floor(window.innerHeight * this.resScale));
    if (this.canvas.width !== w || this.canvas.height !== h) {
      this.canvas.width = w;
      this.canvas.height = h;
    }
    this.gl.viewport(0, 0, w, h);
    this.aspect = window.innerWidth / Math.max(1, window.innerHeight);
    this.projMat = M4.perspectiveLH(62, this.aspect, 0.45, this.clipFar);
  }

  updateCameraMatrices() {
    const res = M4.viewFromCamera(
      this.camPos[0], this.camPos[1], this.camPos[2],
      this.camRot[0], this.camRot[1], this.camRot[2]
    );
    this.viewMat = res.view;
    this.camRight = res.right;
    this.camUp = res.up;
    this.camFwd = res.fwd;
    this.vpMat = M4.mul(this.projMat, this.viewMat);
  }

  projectWorldToScreen(wx, wy, wz) {
    const relX = wx - this.camPos[0], relY = wy - this.camPos[1], relZ = wz - this.camPos[2];
    const dotF = relX * this.camFwd[0] + relY * this.camFwd[1] + relZ * this.camFwd[2];
    const dotR = relX * this.camRight[0] + relY * this.camRight[1] + relZ * this.camRight[2];
    if (dotF <= 0.35) {
      return { inFront: false, x: dotR >= 0 ? 0.92 : 0.08, y: 0.5, side: dotR >= 0 ? 1 : -1 };
    }
    const clip = M4.transformPt(this.vpMat, wx, wy, wz);
    if (!Number.isFinite(clip[3]) || clip[3] <= 0.01) {
      return { inFront: false, x: dotR >= 0 ? 0.92 : 0.08, y: 0.5, side: dotR >= 0 ? 1 : -1 };
    }
    const ndcX = clip[0] / clip[3];
    const ndcY = clip[1] / clip[3];
    if (!Number.isFinite(ndcX) || !Number.isFinite(ndcY)) {
      return { inFront: false, x: 0.5, y: 0.5, side: 1 };
    }
    return {
      inFront: true,
      ndcX, ndcY,
      x: (ndcX * 0.5 + 0.5),
      y: (0.5 - ndcY * 0.5),
      side: dotR >= 0 ? 1 : -1,
    };
  }

  beginFrame() {
    const gl = this.gl;
    this.updateCameraMatrices();
    gl.clearColor(this.clearColor[0], this.clearColor[1], this.clearColor[2], 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    if (this.skyEnabled) {
      gl.depthMask(false);
      gl.disable(gl.BLEND);
      const skyM = M4.fromTRS(this.camPos[0], this.camPos[1], this.camPos[2], 0, 0, 0, this.clipFar * 0.85, this.clipFar * 0.85, this.clipFar * 0.85);
      this._drawOpaqueMesh('sphere', skyM, this.skyTexKey, [1,1,1,1], [1,1], false, false);
      gl.depthMask(true);
    }
  }

  _bindStride12(prog, buf) {
    const gl = this.gl;
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    const S = 12 * 4;
    gl.enableVertexAttribArray(prog.aPos);
    gl.vertexAttribPointer(prog.aPos, 3, gl.FLOAT, false, S, 0);
    gl.enableVertexAttribArray(prog.aNorm);
    gl.vertexAttribPointer(prog.aNorm, 3, gl.FLOAT, false, S, 12);
    gl.enableVertexAttribArray(prog.aUv);
    gl.vertexAttribPointer(prog.aUv, 2, gl.FLOAT, false, S, 24);
    gl.enableVertexAttribArray(prog.aCol);
    gl.vertexAttribPointer(prog.aCol, 4, gl.FLOAT, false, S, 32);
  }

  drawStaticBatches(batchList) {
    const gl = this.gl, p = this.batchProg;
    gl.useProgram(p.prog);
    gl.disable(gl.BLEND);
    gl.depthMask(true);
    gl.uniformMatrix4fv(p.uView, false, this.viewMat);
    gl.uniformMatrix4fv(p.uProj, false, this.projMat);
    gl.uniform3fv(p.uFogColor, this.fogColor);
    gl.uniform1f(p.uFogNear, this.fogNear);
    gl.uniform1f(p.uFogFar, this.fogFar);
    gl.uniform1f(p.uUseFog, this.useFog ? 1.0 : 0.0);
    gl.uniform1i(p.uTex, 0);
    gl.activeTexture(gl.TEXTURE0);

    for (const groups of batchList) {
      if (!groups) continue;
      for (const g of groups) {
        const texObj = this.textures[g.texKey] || this.textures.white;
        gl.bindTexture(gl.TEXTURE_2D, texObj.tex);
        this._bindStride12(p, g.buf);
        gl.drawArrays(gl.TRIANGLES, 0, g.count);
      }
    }
  }

  _drawOpaqueMesh(model, worldMat, texKey, color, uvScale, useFog, shade) {
    const gl = this.gl, p = this.opaqueProg;
    const vbo = this.geoVBOs[model] || this.geoVBOs.cube;
    const texObj = this.textures[texKey || 'white'] || this.textures.white;
    gl.useProgram(p.prog);
    gl.uniformMatrix4fv(p.uModel, false, worldMat);
    gl.uniformMatrix4fv(p.uView, false, this.viewMat);
    gl.uniformMatrix4fv(p.uProj, false, this.projMat);
    gl.uniform2fv(p.uUvScale, uvScale || [1, 1]);
    gl.uniform4fv(p.uColor, color || [1, 1, 1, 1]);
    gl.uniform3fv(p.uFogColor, this.fogColor);
    gl.uniform1f(p.uFogNear, this.fogNear);
    gl.uniform1f(p.uFogFar, this.fogFar);
    gl.uniform1f(p.uUseFog, useFog ? 1.0 : 0.0);
    gl.uniform1f(p.uShade, shade ? 1.0 : 0.0);
    gl.uniform1i(p.uTex, 0);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texObj.tex);
    this._bindStride12(p, vbo.buf);
    gl.drawArrays(gl.TRIANGLES, 0, vbo.count);
  }

  drawDynamicList(opaqueNodes, transNodes, additiveNodes) {
    const gl = this.gl;
    // 1. Opaque dynamic nodes
    gl.disable(gl.BLEND);
    gl.depthMask(true);
    for (const d of opaqueNodes) {
      this._drawOpaqueMesh(d.model, d.worldMat, d.tex, d.color, d.uvScale, d.useFog, d.shade);
    }
    // 2. Alpha-blended dynamic nodes (ghosts, shadows, magic rings)
    if (transNodes.length) {
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.depthMask(false);
      for (const d of transNodes) {
        this._drawOpaqueMesh(d.model, d.worldMat, d.tex, d.color, d.uvScale, d.useFog, d.shade);
      }
    }
    // 3. Additive FX nodes (sunbeams, sun halo, glows, light motes, hit smoke)
    if (additiveNodes.length) {
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      gl.depthMask(false);
      for (const d of additiveNodes) {
        this._drawOpaqueMesh(d.model, d.worldMat, d.tex, d.color, d.uvScale, false, false);
      }
    }
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }
}

// --- Lightweight Hierarchical 3D Node ---
class Node3D {
  constructor(opts = {}) {
    this.pos = opts.pos ? opts.pos.slice() : [0, 0, 0];
    this.rot = opts.rot ? opts.rot.slice() : [0, 0, 0];
    this.scale = typeof opts.scale === 'number' ? [opts.scale, opts.scale, opts.scale] : (opts.scale ? opts.scale.slice() : [1, 1, 1]);
    this.model = opts.model || null;
    this.tex = opts.tex || 'white';
    this.uvScale = opts.uvScale || [1, 1];
    this.color = opts.color ? opts.color.slice() : [1, 1, 1, 1];
    this.billboard = !!opts.billboard;
    this.additive = !!opts.additive;
    this.useFog = opts.useFog !== undefined ? opts.useFog : true;
    this.shade = opts.shade !== undefined ? opts.shade : true;
    this.enabled = opts.enabled !== undefined ? opts.enabled : true;
    this.children = [];
    this.worldMat = M4.ident();
    if (opts.parent) opts.parent.children.push(this);
  }
  addChild(opts) {
    opts.parent = this;
    return new Node3D(opts);
  }
  collectDrawables(parentMat, renderer, outOpaque, outTrans, outAdd) {
    if (!this.enabled) return;
    let wm;
    if (this.billboard) {
      const wp = parentMat ? M4.transformPt(parentMat, this.pos[0], this.pos[1], this.pos[2]) : [this.pos[0], this.pos[1], this.pos[2], 1];
      const r = renderer.camRight, u = renderer.camUp, f = renderer.camFwd;
      const sx = this.scale[0], sy = this.scale[1], sz = this.scale[2];
      wm = new Float32Array([
        r[0]*sx, r[1]*sx, r[2]*sx, 0,
        u[0]*sy, u[1]*sy, u[2]*sy, 0,
        f[0]*sz, f[1]*sz, f[2]*sz, 0,
        wp[0],   wp[1],   wp[2],   1
      ]);
    } else {
      const lm = M4.fromTRS(
        this.pos[0], this.pos[1], this.pos[2],
        this.rot[0], this.rot[1], this.rot[2],
        this.scale[0], this.scale[1], this.scale[2]
      );
      wm = parentMat ? M4.mul(parentMat, lm) : lm;
    }
    this.worldMat = wm;
    if (this.model) {
      const item = {
        model: this.model, worldMat: wm, tex: this.tex, color: this.color,
        uvScale: this.uvScale, useFog: this.useFog, shade: this.shade
      };
      if (this.additive) outAdd.push(item);
      else if (this.color[3] < 0.99 || this.tex === 'soft_glow' || this.tex === 'soft_beam') outTrans.push(item);
      else outOpaque.push(item);
    }
    for (let i = 0; i < this.children.length; i++) {
      this.children[i].collectDrawables(wm, renderer, outOpaque, outTrans, outAdd);
    }
  }
}
